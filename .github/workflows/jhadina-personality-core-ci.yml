permissions:
  contents: read

jobs:
  core-spine:
    name: Core Spine type-check and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check Core Spine
        run: pnpm --filter @jhadina/core-spine type-check

      - name: Execute Core Spine regressions
        run: pnpm --filter @jhadina/core-spine test

      - name: Type-check Intelligence Core
        run: pnpm --filter @jhadina/intelligence-core type-check

      - name: Certify Personality behavioral drift
        run: pnpm --filter @jhadina/core-spine exec vitest run src/personality-drift.test.ts

      - name: Execute Intelligence Core regressions
        run: pnpm --filter @jhadina/intelligence-core test

      - name: Type-check Jhadina Web integration
        run: pnpm --filter @jhadina/jhadina-web type-check

      - name: Execute persisted personality, Hippocampus, and Ask Jhadina vertical regressions
        run: |
          pnpm --filter @jhadina/jhadina-web exec vitest run \
            src/lib/personality/personality-core.test.ts \
            src/lib/personality/supabase-personality-state-repository.test.ts \
            src/lib/personality/production-personality-context-provider.test.ts \
            src/lib/personality/personality-memory-final.test.ts \
            src/lib/personality/personality-drift-observer.test.ts \
            src/lib/hippocampus/persisted-experience-pattern-adapter.test.ts \
            src/lib/context/context-builder.test.ts \
            src/lib/context/production-knowledge-context-provider.test.ts \
            src/lib/context/production-social-context-provider.test.ts \
            src/lib/context/social-context.integration.test.ts \
            src/lib/context/production-growth-context-provider.test.ts \
            src/lib/context/growth-context.integration.test.ts \
            src/lib/intelligence/jhadina-command.test.ts \
            src/lib/intelligence/ask-expression.test.ts \
            src/lib/intelligence/ask-shortcut-experience.test.ts \
            src/lib/intelligence/ask-contextual-read-routing.test.ts \
            src/lib/intelligence/ask-social-command.test.ts \
            src/lib/intelligence/ask-growth-command.test.ts \
            src/app/api/jhadina/command/route.social.test.ts \
            src/app/api/jhadina/command/route.growth.test.ts \
            src/app/api/jhadina/expression/route.test.ts \
            src/lib/intelligence/governed-intelligence-proposal.test.ts \
            src/lib/personality/personality-outcome-feedback.test.ts \
            src/lib/storage/SupabaseMemoryStorage.test.ts \
            src/lib/storage/createMemoryStorage.test.ts \
            src/lib/application/createJhadinaApplication.test.ts \
            src/__tests__/sprint1.test.ts \
            src/app/api/jhadina/personality/feedback/route.test.ts

      - name: Build Jhadina Web production bundle
        run: pnpm --filter @jhadina/jhadina-web build
