function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function log(action,detail){state.activity.unshift({id:Date.now()+Math.random(),when:new Date().toISOString(),action,detail});state.activity=state.activity.slice(0,80);persist();renderSide()}
function notify(msg){const n=document.getElementById('toast');n.textContent=msg;n.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),2200)}
function icon(name){return ({Home:'⌂',Discover:'⌕',Ask:'✦',Activity:'◷',Settings:'⚙',Music:'♫',TV:'▣',Money:'◈',Director:'✧'})[name]||'✦'}
const navItems=['Home','Discover','Ask','Activity','Settings'];const worldItems=['Music','TV','Money','Director'];
function renderShell(){document.getElementById('sidebar').innerHTML=`<div class="brand"><span class="logo">J</span><div><b>JHADINA</b><small>PERSONAL OS</small></div></div><div class="demotag">◈ PLAYABLE SANDBOX · SAMPLE DATA</div><div class="navlabel">NAVIGATION</div><div class="nav">${navItems.map(n=>`<button data-go="${n}" class="${page===n?'on':''}"><span class="ico">${icon(n)}</span>${n}</button>`).join('')}</div><div class="navlabel" style="margin-top:28px">YOUR WORLDS</div><div class="worldnav nav">${worldItems.map(n=>`<button data-go="${n}" class="${page===n?'on':''}"><span class="ico">${icon(n)}</span>${n}</button>`).join('')}</div><div class="navbottom">◉ <b>Private local demo</b><br>No accounts, money or social publishing connected.</div>`;
document.getElementById('dock').innerHTML=navItems.map(n=>`<button data-go="${n}" class="${page===n?'on':''}" aria-label="Go to ${n}"><span class="ico">${icon(n)}</span>${n}</button>`).join('')}
function header(location='MY WORLD'){return `<div class="topbar"><div class="breadcrumbs">JHADINA / ${esc(location)}</div><div class="actions-inline"><button class="circlebtn" data-go="Discover" aria-label="Search">⌕</button><button class="circlebtn" data-go="Activity" aria-label="Activity">◷</button><button class="avatarmini" data-go="Settings" aria-label="Settings">J</button></div></div>`}
function worldTiles(){return `<div class="worldgrid">${worldItems.map(w=>`<button class="worldtile" data-go="${w}"><span class="symbol">${icon(w)}</span><b>${w}</b></button>`).join('')}</div>`}
function orderedRows(rows){const sorted=rows.slice().sort((a,b)=>b.time-a.time);if(sort==='Latest')return sorted;let grouped={};for(const x of sorted)(grouped[x.lane]??=[]).push(x);let out=[];while(out.length<sorted.length){for(const xs of Object.values(grouped)){const x=xs.shift();if(x)out.push(x)}}return out}
function storyCard(s){const saved=state.saved.includes(s.id);return `<article class="item"><div class="itemtop"><div class="sourceico ${s.lane==='Watch'?'gold':''}">${s.icon}</div><div><div class="src">${esc(s.network)}</div><div class="provenance">${esc(s.meta)}</div></div><span class="timestamp">${s.age}</span></div><h3>${esc(s.title)}</h3><p>${esc(s.desc)}</p>${s.art?`<div class="cover ${s.art}">${esc(s.artText)}</div>`:''}<div class="itemfoot"><span class="tag">${esc(s.tag)}</span><div class="itembuttons"><button class="sm-btn ghost ${saved?'saved':''}" data-save="${s.id}" aria-label="${saved?'Unsave':'Save'} ${esc(s.title)}">${saved?'♥ Saved':'♡ Save'}</button><button class="sm-btn" data-detail="${s.id}">${esc(s.action)} →</button></div></div></article>`}
function renderHome(){let list=orderedRows(stories.filter(s=>view==='All'||s.lane===view));return `${header('HOME')}<div class="hero"><div class="intro-orb"></div><div class="eyebrow">YOUR PERSONAL COMMAND CENTER</div><h1>Your world,<br><em>in motion.</em></h1><p>Social signals, useful work and entertainment in one calm place. Explore the sandbox and make it yours.</p></div><div class="statusline"><span class="statuspill"><span class="dot"></span> Source previews: sample</span><span class="statuspill"><span class="dot warn"></span> Accounts not linked</span><span class="statuspill">◷ ${state.saved.length} saved</span></div><div class="sectionhead"><h2>Your worlds</h2><small>Go anywhere</small></div>${worldTiles()}<div class="sectionhead" style="margin-top:28px"><h2>For your attention</h2><small>${list.length} sample updates</small></div><div class="segrow"><div class="tabs" role="tablist">${['All','Social','Watch','Work'].map(t=>`<button class="tab ${view===t?'on':''}" data-view="${t}" aria-selected="${view===t}">${t}</button>`).join('')}</div><select class="sort" id="feedSort" aria-label="Feed ordering"><option ${sort==='Latest'?'selected':''}>Latest</option><option ${sort==='Balanced'?'selected':''}>Balanced</option></select></div><div id="feedCards">${list.length?list.map(storyCard).join(''):'<div class="empty">No items in this lane.</div>'}</div><div class="notice">🔒 <b>About this demo</b><br>All feed items are invented. No external feeds, personal data, auto-learning, publishing or spending. Your demo changes stay in this browser when local storage is available.</div>`}
function renderDiscover(){return `${header('DISCOVER')}<section class="page"><div class="eyebrow">FIND SOMETHING GOOD</div><h1>Explore the signals.</h1><p class="pagelead">Search fictional sources, topics and sample projects. Saved posts are available here too.</p><div class="searchwrap"><input class="input searchinput" id="discoverSearch" placeholder="Search: music, Bluesky, AI, Director..." aria-label="Search demo content" autocomplete="off"></div><div class="scrollchips" style="margin-top:13px">${['All','Saved','Social','Watch','Work'].map(x=>`<button class="chip ${searchKind===x?'on':''}" data-search-kind="${x}">${x}${x==='Saved'?' ('+state.saved.length+')':''}</button>`).join('')}</div><div id="searchResults"></div></section>`}
let searchKind='All';let searchQuery='';function refreshSearch(){const el=document.getElementById('searchResults');if(!el)return;let arr=stories.filter(s=>(searchKind==='All'||(searchKind==='Saved'?state.saved.includes(s.id):s.lane===searchKind))&&(`${s.title} ${s.desc} ${s.network}`.toLowerCase().includes(searchQuery.toLowerCase())));el.innerHTML=arr.length?arr.map(storyCard).join(''):`<div class="empty-state"><div class="big">⌕</div>No matching demo items.<br>Try another keyword or filter.</div>`}
function renderAsk(){return `${header('ASK JHADINA')}<section class="page"><div class="eyebrow">YOUR PERSONAL ASSISTANT · SANDBOX</div><h1>Ask me anything.</h1><p class="pagelead">This is a scripted, local demo responder, not the live JLLM. It can navigate the sample and explain its simulated state.</p><div class="statusnote">✳ Scripted response engine · no model API · no messages leave this file</div><div class="chatbox" id="chatBox">${state.chat.length?state.chat.map(x=>`<div class="bubble ${x.role==='user'?'user':'assistant'}">${esc(x.text)}</div>`).join(''):'<div class="bubble assistant">Hey, I’m Jhadina — in demo mode. I can show you what needs attention, find your saved posts, open Music, or explain what’s actually connected. Try one of the suggestions below.</div>'}</div><div class="suggestions">${['What needs my attention?','Show saved items','Play music','What is connected?'].map(x=>`<button data-prompt="${esc(x)}">${esc(x)}</button>`).join('')}</div><form id="chatForm" class="formrow"><input class="input" id="chatInput" placeholder="Talk to Jhadina..." aria-label="Ask Jhadina" style="flex:1;min-width:150px"><button class="btn" type="submit">Send ↗</button></form></section>`}
function respond(text){const t=text.toLowerCase();const pending=state.drafts.filter(d=>d.status==='pending').length;const unreviewed=state.memory.filter(m=>m.status==='pending').length;if(/attention|to.do|pending|task|next/.test(t))return `Here's your local demo briefing:\n• ${pending} Director draft(s) awaiting your decision.\n• ${unreviewed} suggested memory item(s) need review.\n• ${state.saved.length} item(s) saved for later.\nNo real posts, messages or transactions have occurred.`;if(/saved|bookmark|favorite/.test(t))return `You have ${state.saved.length} saved sample card(s). Open Discover → Saved to browse them.`;if(/connected|connection|account|real/.test(t))return `This is a standalone offline-friendly demo. No real Google, YouTube, Instagram, Facebook, social or Supabase accounts are connected. Settings has fictional preview switches; production connector status cannot be inferred from them.`;if(/play|song|music|beat/.test(t)){startAudio();return 'I started the original synthetic demo loop (if audio is supported). Use the mini-player to pause or switch tracks, or open Music for controls.'}if(/money|trade|bitcoin|solana|coin|alpha/.test(t))return 'Money Lab contains fictional paper values only. Open Money to explore the watchlist and a simulated signal report. No live order or trading API exists here.';if(/director|draft|approve|video/.test(t))return `There are ${pending} fictional drafts in Director waiting for review. Open that world to approve or reject them locally — nothing publishes.`;if(/tv|movie|show|watch/.test(t))return 'Open TV to play a synthetic preview with progress and resume. There are no licensed streams in this demo.';if(/who are you|how do you work|model|llm/.test(t))return 'I am a scripted demo of Jhadina’s assistant interface. The real JLLM would use authorized tools, context and provider permissions. This page does not call any AI model.';return 'I can help you explore this sample. Ask about your attention queue, saved items, connections, Music, TV, Money or Director. In this version, my answers are local scripted examples.'}
function sendChat(q){const value=String(q||'').trim().slice(0,600);if(!value)return;state.chat.push({role:'user',text:value},{role:'assistant',text:respond(value)});state.chat=state.chat.slice(-40);persist();renderMain();const box=document.getElementById('chatBox');if(box)box.scrollTop=box.scrollHeight;log('Asked Jhadina','Local scripted answer only')}
function renderActivity(){return `${header('ACTIVITY')}<section class="page"><div class="eyebrow">AUDIT TRAIL</div><h1>What happened here.</h1><p class="pagelead">Every interaction here is a local demo event, not a Jhadina production audit receipt.</p><div class="formrow"><button class="btn light" data-export="1">↓ Export demo JSON</button><button class="btn outline" data-clearlog="1">Clear activity</button></div><div class="panel">${state.activity.length?state.activity.map(x=>`<div class="event"><div class="eventico">◷</div><div><b>${esc(x.action)}</b><p>${esc(x.detail)}</p><small>${new Date(x.when).toLocaleString()}</small></div></div>`).join(''):'<div class="empty-state"><div class="big">◷</div>Your sandbox activity will show up here.<br>Save an item, review a draft, or try music.</div>'}</div></section>`}
function renderSettings(){let connections=[['youtube','YouTube','Google consent required in production'],['bluesky','Bluesky public preview','Only public-author posts supported in source'],['mastodon','Mastodon public preview','Public-author view only, no personal following timeline'],['instagram','Instagram Professional','Approved Meta Graph ownership/scopes needed'],['facebook','Facebook Pages','Owned Page data only with approved scopes'],['reddit','Reddit','Provider approval and permitted API use']];return `${header('SETTINGS')}<section class="page"><div class="eyebrow">PERSONALIZE YOUR SANDBOX</div><h1>Make it yours.</h1><p class="pagelead">These controls only change this demo on this device. They do not authorize, register, or contact external providers.</p><div class="panel"><h3>Appearance</h3><div class="settingrow"><div><b>Dark forest mode</b><small>Apply the darker palette to the whole demo.</small></div><input type="checkbox" class="toggle" data-theme-toggle="1" ${state.theme==='dark'?'checked':''} aria-label="Dark forest mode"></div><div class="settingrow"><div><b>Demo notifications</b><small>Show feedback when you act; never sends push alerts.</small></div><input type="checkbox" class="toggle" data-notify-toggle="1" ${state.notifications?'checked':''} aria-label="Demo notifications"></div></div><div class="panel"><h3>Connection previews</h3><div class="statusnote">None of these switches connect a real account. They only change a fictional status card.</div>${connections.map(x=>`<div class="settingrow"><div><b>${x[1]}</b><small>${x[2]}</small></div><input type="checkbox" class="toggle" data-connection="${x[0]}" ${state.connections[x[0]]?'checked':''} aria-label="Toggle illustrative ${x[1]} preview"></div>`).join('')}</div><div class="panel"><h3>Local data</h3><p>Saved cards, draft decisions, chat, history and settings can be stored in your current browser. No personal information needs to be entered.</p><div class="formrow"><button class="btn light" data-export="1">Export JSON</button><button class="btn danger" data-reset="1">Reset demo</button></div></div></section>`}
function renderMusic(){return `${header('MUSIC')}<section class="page"><div class="eyebrow">JHADINA MUSIC</div><h1>Find your frequency.</h1><p class="pagelead">An original in-browser synthesizer, not streaming music. Tap Play to hear a generated melody and rhythm.</p><div class="screen green" style="min-height:225px"><div style="width:100px;height:100px;border-radius:50%;border:28px solid #355a42;background:conic-gradient(#e2cda5,#809d7c,#d6bc97,#7c9a72);box-shadow:0 10px 35px #162b2370;animation:float 5s infinite"></div><div class="screen-word" style="font-size:27px;margin-top:16px">${esc(tracks[media.track].title)}</div></div><div class="panel"><div class="eyebrow">NOW CREATING · SYNTH AUDIO</div><h3>${esc(tracks[media.track].title)}</h3><p>${esc(tracks[media.track].artist)}</p><div class="formrow" style="margin:17px 0"><button class="btn light" data-prevtrack="1">⏮ Previous</button><button class="btn" data-play="1">${media.playing?'Ⅱ Pause':'▶ Play demo'}</button><button class="btn light" data-nexttrack="1">Next ⏭</button></div><label class="muted">Volume <input id="vol" type="range" min="0" max="0.35" step="0.01" value="${state.volume}" style="width:100%;accent-color:#477452;margin-top:10px" aria-label="Volume"></label></div><div class="sectionhead"><h2>Local demo tracks</h2><small>3 patterns</small></div>${tracks.map((t,i)=>`<div class="panel" style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><b style="font-size:13px">${i+1}. ${esc(t.title)}</b><p style="margin:3px 0">${t.tempo} BPM · Generated melody</p></div><button class="btn ${media.track===i?'':'light'}" data-track="${i}">${media.playing&&media.track===i?'Ⅱ Pause':'▶ Listen'}</button></div>`).join('')}</section>`}
function renderTV(){let sc=scenes[currentScene];return `${header('TV')}<section class="page"><div class="eyebrow">JHADINA TV</div><h1>Press play.</h1><p class="pagelead">A simulated show interface. The screen animation and resume timer work, but no provider video or live channels are loaded.</p><div class="screen ${sc.class}" id="tvScreen"><div class="mini-label" style="color:#efeee9">LOCAL VISUAL TEST</div><div class="screen-word">${esc(sc.word)}</div><button data-tvplay="1" aria-label="${media.tv?'Pause':'Play'} preview">${media.tv?'Ⅱ':'▶'}</button><div class="screenprogress"><span id="tvProgress" style="width:${(media.tvSeconds%91)/90*100}%"></span></div></div><div class="panel"><h3>${esc(sc.title)}</h3><p>${esc(sc.genre)} · Demo sequence ${currentScene+1}/3</p><div class="formrow"><button class="btn light" data-tvrewind="1">↶ 10s</button><button class="btn" data-tvplay="1">${media.tv?'Ⅱ Pause':'▶ Play'}</button><button class="btn light" data-tvnext="1">Next scene ⏭</button></div><div class="muted" style="margin-top:13px">Resume time: <b id="tvClock">${fmt(media.tvSeconds)}</b> · loops at 1:30</div></div><div class="sectionhead"><h2>Explore scenes</h2><small>Demo only</small></div><div class="grid2">${scenes.map((s,i)=>`<button class="panel" style="text-align:left;border-color:${i===currentScene?'#7b9a7d':'var(--line)'}" data-scene="${i}"><div style="height:80px;border-radius:12px;margin-bottom:11px" class="screen ${s.class}"><span class="screen-word" style="font-size:18px">${esc(s.word)}</span></div><b>${esc(s.title)}</b><p>${esc(s.genre)}</p></button>`).join('')}</div></section>`}
function fmt(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`}
function renderMoney(){return `${header('MONEY')}<section class="page"><div class="eyebrow">CAPITAL LAB · PAPER SANDBOX</div><h1>Watch the moves.</h1><p class="pagelead">A mock market board for testing Jhadina's watchlist UX. These are invented values, not market quotes, advice, trades or wallet balances.</p><div class="statusnote">◈ PAPER SIMULATION · No live prices, broker, exchange, wallet or wagers connected.</div><div class="grid2"><div class="panel"><div class="mini-label">PAPER EXPOSURE</div><div class="metric">$0.00</div><div class="muted">No real funds connected</div></div><div class="panel"><div class="mini-label">WATCHED SYMBOLS</div><div class="metric">${state.watchlist.length}</div><div class="muted">Saved in this demo</div></div></div><div class="sectionhead"><h2>Paper watchlist</h2><small>Made-up values</small></div>${[['SOL','Solana','$175.42','+2.7%'],['BTC','Bitcoin','$71,820','+1.4%'],['ETH','Ethereum','$3,785','−0.8%'],['BONK','Demo memecoin','$0.000024','+4.1%']].map(a=>`<div class="panel" style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div><b>${a[0]} · ${a[1]}</b><p style="margin:4px 0">${a[2]} <span style="color:${a[3][0]==='−'?'#bd7464':'#548969'}">${a[3]}</span> · fictitious</p></div><button class="btn ${state.watchlist.includes(a[0])?'light':'outline'}" data-watch="${a[0]}">${state.watchlist.includes(a[0])?'✓ Watching':'+ Watch'}</button></div>`).join('')}<div class="panel"><h3>SHARK simulation</h3><p>Try a paper-only research card. This output is generated locally and has no access to Telegram, DEX liquidity or live bonding curves.</p><button class="btn" data-scanshark="1">Run sample scan ↗</button><div id="scanResult"></div></div></section>`}
function renderDirector(){return `${header('DIRECTOR')}<section class="page"><div class="eyebrow">CREATIVE STUDIO · APPROVAL GATED</div><h1>Ideas into motion.</h1><p class="pagelead">Create draft concepts, inspect them and change their review status locally. Nothing is rendered, sent, posted or purchased.</p><div class="panel"><h3>New concept</h3><form id="draftForm"><label class="mini-label">Working title<input class="input" id="draftTitle" maxlength="90" placeholder="A new scene or campaign" required style="margin:7px 0 11px"></label><label class="mini-label">Brief<textarea class="textarea" id="draftBody" maxlength="500" placeholder="Mood, creative direction, audience..." required style="margin:7px 0 11px"></textarea></label><button class="btn" type="submit">+ Create sample draft</button></form></div><div class="sectionhead"><h2>Review queue</h2><small>${state.drafts.filter(d=>d.status==='pending').length} awaiting you</small></div>${state.drafts.map(d=>`<div class="panel"><div class="itemtop"><div class="sourceico">✦</div><div><b style="font-size:12px">${esc(d.brand)}</b><div class="muted">${esc(d.status.toUpperCase())} · Local demo</div></div></div><h3 style="margin-top:13px">${esc(d.title)}</h3><p>${esc(d.description)}</p><div class="formrow">${d.status==='pending'?`<button class="btn light" data-approve="${d.id}">✓ Approve locally</button><button class="btn danger" data-reject="${d.id}">✕ Reject</button>`:`<span class="statuspill">Decision: ${esc(d.status)}</span><button class="btn outline" data-reopen="${d.id}">Reopen</button>`}</div></div>`).join('')}</section>`}
function renderSide(){document.getElementById('sidepanel').innerHTML=`<div class="sidetitle">YOUR COMPANION</div><div class="orbarea"><div class="bigorb"></div><h3>Jhadina is here.</h3><p>Ask a question, explore an idea, or make the next move. This is the interactive prototype.</p><button data-go="Ask">Talk to Jhadina ↗</button></div><div class="statbox"><h4>Demo system status</h4><div class="statrow"><span>Interface</span><b>Interactive</b></div><div class="statrow"><span>Real social accounts</span><b>Not linked</b></div><div class="statrow"><span>Database storage</span><b>Not connected</b></div><div class="statrow"><span>Local saved items</span><b>${state.saved.length}</b></div><div class="statrow"><span>Pending drafts</span><b>${state.drafts.filter(d=>d.status==='pending').length}</b></div></div><div class="statbox"><h4>Recent demo actions</h4>${state.activity.length?state.activity.slice(0,3).map(a=>`<div class="activitymini"><b>${esc(a.action)}</b>${esc(a.detail)}</div>`).join(''):'<div class="activitymini">No actions yet. Try saving a post.</div>'}</div>`}
function renderPlayer(){document.getElementById('player').innerHTML=`<div class="albumart">♫</div><div class="track"><b>${esc(tracks[media.track].title)}</b><small>${media.playing?'Playing original synth demo':'Jhadina Music · Tap Play'}</small></div><button class="playerbutton" data-nexttrack="1" aria-label="Next track">⏭</button><button class="playerbutton" data-play="1" aria-label="${media.playing?'Pause':'Play'} music">${media.playing?'Ⅱ':'▶'}</button>`}
function renderMain(){document.body.classList.toggle('theme-dark',state.theme==='dark');renderShell();const pages={Home:renderHome,Discover:renderDiscover,Ask:renderAsk,Activity:renderActivity,Settings:renderSettings,Music:renderMusic,TV:renderTV,Money:renderMoney,Director:renderDirector};document.getElementById('main').innerHTML=pages[page]();renderPlayer();renderSide();if(page==='Discover'){const input=document.getElementById('discoverSearch');input.value=searchQuery;refreshSearch()}if(page==='Ask'){const box=document.getElementById('chatBox');box.scrollTop=box.scrollHeight}}
function go(p){if(![...navItems,...worldItems].includes(p))return;page=p;renderMain();document.getElementById('main').scrollTo({top:0,behavior:'instant'});if(state.notifications)notify('Opened '+p)}
function detail(id){const s=stories.find(x=>x.id===id);if(!s)return;const isSaved=state.saved.includes(id);document.getElementById('modal').innerHTML=`<div class="modalbar"><span class="mini-label">${esc(s.network)} · ${esc(s.lane)} · SIMULATION</span><button class="close" data-close="1" aria-label="Close">×</button></div><h2>${esc(s.title)}</h2><p>${esc(s.desc)}</p>${s.art?`<div class="cover ${s.art}" style="height:175px">${esc(s.artText)}</div>`:''}<div class="statusnote"><b>Evidence boundary:</b> ${esc(s.meta)}. This has no original external source URL because the content is fictional.</div><div class="formrow"><button class="btn light" data-save="${s.id}">${isSaved?'♥ Unsave':'♡ Save for later'}</button>${s.network==='Director'?'<button class="btn" data-go="Director">Review drafts</button>':s.network==='Money Lab'?'<button class="btn" data-go="Money">Explore Money</button>':s.network==='JhadinaTV'?'<button class="btn" data-go="TV">Open TV</button>':s.network==='YouTube'?'<button class="btn" data-go="Music">Try audio</button>':'<button class="btn" data-go="Settings">Connection info</button>'}</div>`;document.getElementById('modalback').classList.add('open')}
function closeModal(){document.getElementById('modalback').classList.remove('open')}
function save(id){const s=stories.find(x=>x.id===id);if(!s)return;if(state.saved.includes(id)){state.saved=state.saved.filter(x=>x!==id);log('Item unsaved',s.title);notify('Removed from saved items')}else{state.saved.push(id);log('Item saved',s.title);notify('Saved for later')}persist();renderMain();if(document.getElementById('modalback').classList.contains('open'))detail(id)}
function audioStep(){if(!audioCtx||!media.playing)return;let now=audioCtx.currentTime;const tr=tracks[media.track];const steps=tr.tempo;let i=media.seconds++%16;const melodies=[[0,2,4,7,4,2,0,5],[0,3,5,7,5,3,2,0],[0,4,7,9,7,4,2,5]];let m=melodies[media.track][i%8];tone(220*Math.pow(2,m/12),now,.15,'sine',.14);if(i%4===0){tone(98,now,.10,'triangle',.27);tone(58,now,.13,'sine',.20)}if(i%4===2){tone(210,now,.065,'square',.035)}}
function tone(f,t,d,type,amp){if(!audioCtx)return;const osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type=type;osc.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(Math.max(.0001,amp*state.volume),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);osc.connect(g);g.connect(audioCtx.destination);osc.start(t);osc.stop(t+d+.02)}
function startAudio(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();clearInterval(audioTimer);media.playing=true;audioStep();audioTimer=setInterval(audioStep,Math.round(60000/tracks[media.track].tempo/2));renderPlayer();if(page==='Music')renderMain();log('Music started',tracks[media.track].title)}catch(e){media.playing=false;notify('Browser audio unavailable')}}
function stopAudio(){media.playing=false;clearInterval(audioTimer);audioTimer=null;renderPlayer();if(page==='Music')renderMain();log('Music paused','Local audio only')}
function toggleAudio(){media.playing?stopAudio():startAudio()}
function changeTrack(n){const was=media.playing;clearInterval(audioTimer);media.playing=false;media.track=(n+tracks.length)%tracks.length;media.seconds=0;if(was)startAudio();else{renderMain();log('Track selected',tracks[media.track].title)}}
function changeTV(){if(media.tv){clearInterval(tvTimer);media.tv=false;log('TV preview paused',scenes[currentScene].title)}else{media.tv=true;tvTimer=setInterval(()=>{media.tvSeconds=(media.tvSeconds+1)%91;const b=document.getElementById('tvClock');if(b)b.textContent=fmt(media.tvSeconds);const p=document.getElementById('tvProgress');if(p)p.style.width=(media.tvSeconds/90*100)+'%'},1000);log('TV preview started',scenes[currentScene].title)}renderMain()}
function exportState(){const clean=JSON.stringify({...state,disclaimer:'Jhadina UX2 local demo only. Fictional sample activity; not a real account export.'},null,2);const blob=new Blob([clean],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='jhadina-demo-state.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);log('Exported demo state','Downloaded local JSON')}
function resetState(){if(!confirm('Reset the LOCAL demo? This clears demo saves, chat, drafts and activity on this device only.'))return;stopAudio();state=JSON.parse(JSON.stringify(seed));searchQuery='';searchKind='All';view='All';sort='Latest';media={playing:false,track:0,seconds:0,tv:false,tvSeconds:0};clearInterval(tvTimer);persist();page='Home';closeModal();renderMain();notify('Demo reset')}
function actionDecision(type,id){const d=state.drafts.find(x=>x.id===id);if(!d)return;d.status=type;persist();log('Director draft '+type,d.title+' · demo only');notify('Draft '+type+' locally');renderMain()}
function changeWatch(symbol){if(state.watchlist.includes(symbol))state.watchlist=state.watchlist.filter(s=>s!==symbol);else state.watchlist.push(symbol);persist();log('Paper watchlist updated',symbol+' · no live price or trade');renderMain()}
function scan(){const target=document.getElementById('scanResult');if(!target)return;state.counter++;const grade=['NO SIGNAL','OBSERVE ONLY','HIGH RISK'][state.counter%3];target.innerHTML=`<div class="statusnote"><b>Simulated scan #${state.counter} · ${grade}</b><br>Liquidity: unverified · Migration: unverified · Social claims: unverified<br>No trading decision or alert is authorized; these results are fabricated for the UX.</div>`;log('Ran paper scan','Fictional '+grade+' result');persist();notify('Paper scan complete')}
// One delegated action surface for mouse, keyboard and touch.
document.addEventListener('click',ev=>{const btn=ev.target.closest('button');if(!btn)return;if(btn.dataset.go){closeModal();go(btn.dataset.go)}else if(btn.dataset.view){view=btn.dataset.view;state.view=view;persist();renderMain()}else if(btn.dataset.save)save(btn.dataset.save);else if(btn.dataset.detail)detail(btn.dataset.detail);else if(btn.dataset.close)closeModal();else if(btn.dataset.play)toggleAudio();else if(btn.dataset.nexttrack)changeTrack(media.track+1);else if(btn.dataset.prevtrack)changeTrack(media.track-1);else if(btn.dataset.track){const n=Number(btn.dataset.track);if(media.track===n)toggleAudio();else{changeTrack(n);startAudio()}}else if(btn.dataset.tvplay)changeTV();else if(btn.dataset.tvrewind){media.tvSeconds=Math.max(0,media.tvSeconds-10);renderMain();log('Rewound TV preview','10 simulated seconds')}else if(btn.dataset.tvnext){currentScene=(currentScene+1)%scenes.length;media.tvSeconds=0;renderMain();log('Switched TV scene',scenes[currentScene].title)}else if(btn.dataset.scene){currentScene=Number(btn.dataset.scene);media.tvSeconds=0;renderMain();log('Selected TV scene',scenes[currentScene].title)}else if(btn.dataset.approve)actionDecision('approved',btn.dataset.approve);else if(btn.dataset.reject)actionDecision('rejected',btn.dataset.reject);else if(btn.dataset.reopen)actionDecision('pending',btn.dataset.reopen);else if(btn.dataset.watch)changeWatch(btn.dataset.watch);else if(btn.dataset.scanshark)scan();else if(btn.dataset.prompt){sendChat(btn.dataset.prompt)}else if(btn.dataset.export)exportState();else if(btn.dataset.clearlog){state.activity=[];persist();renderMain();notify('Demo activity cleared')}else if(btn.dataset.reset)resetState();else if(btn.dataset.searchKind){searchKind=btn.dataset.searchKind;renderMain()}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.id==='feedSort'){sort=t.value;state.sort=sort;persist();renderMain()}if(t.dataset.themeToggle){state.theme=t.checked?'dark':'light';persist();renderMain();log('Theme changed',state.theme)}if(t.dataset.notifyToggle){state.notifications=t.checked;persist();renderMain()}if(t.dataset.connection){state.connections[t.dataset.connection]=t.checked;persist();log('Sample source switch',t.dataset.connection+': '+(t.checked?'preview on':'preview off'));renderMain()}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='discoverSearch'){searchQuery=t.value;refreshSearch()}else if(t.id==='vol'){state.volume=Number(t.value);persist()}});
document.addEventListener('submit',ev=>{if(ev.target.id==='chatForm'){ev.preventDefault();const el=document.getElementById('chatInput');sendChat(el.value)}if(ev.target.id==='draftForm'){ev.preventDefault();const title=document.getElementById('draftTitle').value.trim(),desc=document.getElementById('draftBody').value.trim();if(!title||!desc)return;state.drafts.unshift({id:'d'+Date.now(),title,description:desc,brand:'My demo project',status:'pending'});persist();log('Creative draft created',title+' · local only');renderMain();notify('Sample draft added')}});
document.getElementById('modalback').addEventListener('click',ev=>{if(ev.target.id==='modalback')closeModal()});document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal()});renderMain();
</script></body></html>
