name: Music Deep Stems source contract

on:
  pull_request:
    paths:
      - 'services/music-restoration-worker/**'
      - 'packages/music-core/src/restoration-engine/**'
      - '.github/workflows/music-deepstems-contract.yml'
  push:
    branches:
      - main
      - 'feat/music-drive-deepstems-*'
    paths:
      - 'services/music-restoration-worker/**'
      - 'packages/music-core/src/restoration-engine/**'
      - '.github/workflows/music-deepstems-contract.yml'
permissions:
  contents: read
jobs:
  deep-stems-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile services/music-restoration-worker/worker.py services/music-restoration-worker/app.py services/music-restoration-worker/deep_stems.py
      - name: Hermetic deep drums
        run: python3 -m unittest discover -s services/music-restoration-worker -p 'test_deep_stems.py' -v
