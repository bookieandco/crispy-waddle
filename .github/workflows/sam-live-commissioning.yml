name: SAM Live Commissioning

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sam-live-commissioning.yml"
      - "apps/jhadina-web/scripts/sam-live-commissioning.ts"
      - "apps/jhadina-web/src/lib/internal-scheduler-auth.ts"
      - "apps/jhadina-web/src/lib/money-opportunities/sam-*.ts"
      - "apps/jhadina-web/src/app/api/internal/sam/upstream/**"
      - "packages/opportunity-core/src/domain/sam-*.ts"
      - "supabase/functions/jhadina-sam-gateway/**"
      - "supabase/functions/jhadina-sam-runtime-gateway/**"
  schedule:
    - cron: "11 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sam-live-commissioning
  cancel-in-progress: true

jobs:
  commission:
    name: Real SAM evidence commissioning
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://kqbkaozfjubkjevdfvic.supabase.co
      SAM_RUNTIME_GATEWAY_URL: https://kqbkaozfjubkjevdfvic.supabase.co/functions/v1/jhadina-sam-runtime-gateway
      SAM_UPSTREAM_URL: https://crispy-waddle-jhadina-web.vercel.app/api/internal/sam/upstream
      SAM_ENTITY_REQUEST_BUDGET_PER_ENRICHMENT: "6"
      SAM_AWARD_REQUEST_BUDGET_PER_ENRICHMENT: "3"
      USASPENDING_REQUEST_BUDGET_PER_ENRICHMENT: "12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine whether Vercel SAM upstream changed
        id: deploy_scope
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-fA-F]{40}$ || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "needs_deployment=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          fi
          if git diff --quiet "$BEFORE_SHA" "$CURRENT_SHA" -- \
            apps/jhadina-web/src/app/api/internal/sam/upstream \
            apps/jhadina-web/src/lib/internal-scheduler-auth.ts; then
            echo "needs_deployment=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_deployment=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for production deployment containing SAM upstream change
        if: github.event_name == 'push' && steps.deploy_scope.outputs.needs_deployment == 'true'
        env:
          ORIGIN: ${{ vars.JHADINA_PRODUCTION_ORIGIN || 'https://crispy-waddle-jhadina-web.vercel.app' }}
          EXPECTED_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          url="${ORIGIN%/}/api/health"
          compare_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/compare"
          for attempt in $(seq 1 60); do
            response_file="$(mktemp)"
            status="$(curl --silent --show-error \
              --connect-timeout 20 \
              --max-time 30 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header "Accept: application/json" \
              --header "User-Agent: sam-live-commissioning/${GITHUB_RUN_ID}" \
              "$url" || true)"
            success="$(jq -r '.success // false' "$response_file" 2>/dev/null || echo false)"
            deployed_sha="$(jq -r '.commitSha // empty' "$response_file" 2>/dev/null || true)"
            environment="$(jq -r '.environment // empty' "$response_file" 2>/dev/null || true)"
            relation=""
            if [[ "$status" == "200" && "$success" == "true" && "$environment" == "production" && "$deployed_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
              if [[ "$deployed_sha" == "$EXPECTED_SHA" ]]; then
                relation="identical"
              else
                compare_file="$(mktemp)"
                compare_status="$(curl --silent --show-error \
                  --connect-timeout 20 \
                  --max-time 30 \
                  --output "$compare_file" \
                  --write-out '%{http_code}' \
                  --header "Accept: application/vnd.github+json" \
                  --header "Authorization: Bearer ${GITHUB_TOKEN}" \
                  --header "X-GitHub-Api-Version: 2022-11-28" \
                  "${compare_url}/${EXPECTED_SHA}...${deployed_sha}" || true)"
                if [[ "$compare_status" == "200" ]]; then
                  relation="$(jq -r '.status // empty' "$compare_file" 2>/dev/null || true)"
                fi
              fi
            fi
            echo "attempt=${attempt} status=${status} environment=${environment} deployed_sha=${deployed_sha} relation=${relation}"
            if [[ "$relation" == "identical" || "$relation" == "ahead" ]]; then
              exit 0
            fi
            sleep 15
          done
          echo "Production never reported a deployment containing the SAM upstream change $EXPECTED_SHA" >&2
          exit 1

      - name: Request SWLC runtime OIDC token
        id: runtime_oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('jhadina-sam-runtime')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Request Vercel SAM upstream OIDC token
        id: upstream_oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('jhadina-sam-upstream')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Commission real SAM evidence
        env:
          SAM_RUNTIME_OIDC_TOKEN: ${{ steps.runtime_oidc.outputs.token }}
          SAM_UPSTREAM_OIDC_TOKEN: ${{ steps.upstream_oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @jhadina/opportunity-core exec tsx ../../apps/jhadina-web/scripts/sam-live-commissioning.ts | tee /tmp/sam-commissioning.json
          echo "### SAM live commissioning" >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 /tmp/sam-commissioning.json >> "$GITHUB_STEP_SUMMARY"
