name: Media Production Certification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/music-core/**'
      - 'packages/jhadina-tv-core/**'
      - 'apps/jhadina-web/**'
      - 'services/director-character-training/**'
      - 'services/replacement-service/**'
      - 'services/music-restoration-worker/**'
      - 'scripts/music-restoration-runpod-bootstrap.sh'
      - '.github/workflows/media-production-certification.yml'
      - 'docs/MEDIA_PROD_FINAL_CERTIFICATION.md'
  push:
    branches:
      - main
      - 'repair/media-prod-final'
    paths:
      - 'packages/music-core/**'
      - 'packages/jhadina-tv-core/**'
      - 'apps/jhadina-web/**'
      - 'services/director-character-training/**'
      - 'services/music-restoration-worker/**'
      - 'scripts/music-restoration-runpod-bootstrap.sh'
      - '.github/workflows/media-production-certification.yml'
jobs:
  certify-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 8.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jhadina/music-core type-check
      - run: pnpm --filter @jhadina/music-core test
      - run: pnpm --filter @jhadina/tv-core type-check
      - run: pnpm --filter @jhadina/tv-core test
      - run: pnpm --filter @jhadina/jhadina-web type-check
      - name: Director character-training runtime
        run: |
          python -m pip install -r services/director-character-training/requirements.txt
          python -m unittest discover -s services/director-character-training -p 'test_*.py'
      - name: Director replacement runtime
        run: |
          python -m unittest discover -s services/replacement-service -p 'test_*.py'
      - name: Music restoration runtime
        run: |
          python -m py_compile services/music-restoration-worker/worker.py services/music-restoration-worker/source_fetch.py services/music-restoration-worker/vercel_oidc.py services/music-restoration-worker/app.py
          python -m unittest discover -s services/music-restoration-worker -p 'test_*.py'
          bash -n scripts/music-restoration-runpod-bootstrap.sh
