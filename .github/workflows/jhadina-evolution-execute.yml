name: Jhadina Evolution Execute

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Approved Backlog/Evolution task ID"
        required: true
        type: string
      prompt:
        description: "Approved repair/upgrade instruction"
        required: true
        type: string
      base_branch:
        description: "Branch to start from"
        required: true
        default: "agent/jhadina-integration-spine"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: jhadina-evolution-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  execute-approved-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: jhadina-evolution-approval
    permissions:
      contents: write
      pull-requests: write
    env:
      TASK_ID: ${{ inputs.task_id }}
      APPROVED_PROMPT: ${{ inputs.prompt }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      BRANCH_NAME: jhadina/evolution/${{ inputs.task_id }}-${{ github.run_id }}

    steps:
      - name: Checkout approved base
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Create isolated branch
        run: |
          git switch -c "$BRANCH_NAME"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Claude Code in the isolated workspace
        id: claude
        uses: anthropics/claude-code-base-action@beta
        with:
          prompt: |
            You are Jhadina's approved evolution worker.

            TASK ID: ${{ inputs.task_id }}
            APPROVED REQUEST:
            ${{ inputs.prompt }}

            Work ONLY on the approved request.
            Work only inside the repository workspace.
            Do not access secrets, credentials, production systems, payment systems,
            identity systems, policy/values enforcement, or military/security systems.
            Do not modify workflow permissions or GitHub Actions security settings.
            Do not modify .github/workflows files.
            Do not modify files outside the approved task scope.
            Do not commit or push changes; the workflow will do that after verification.

            Inspect first. Make the smallest safe change.
            Run the requested tests/typechecks when applicable.
            Leave a concise summary of the root cause, files changed, and verification performed.
          allowed_tools: "View,GlobTool,GrepTool,BatchTool,Write,Edit,Bash(git status),Bash(git diff:*),Bash(pnpm test),Bash(pnpm typecheck)"
          disallowed_tools: "WebFetch,WebSearch,Task,TaskOutput,Bash(git push),Bash(git commit),Bash(gh:*)"
          max_turns: "12"
          append_system_prompt: |
            Jhadina governance is authoritative. Never weaken or bypass a policy boundary.
            Never edit protected authority code or workflow configuration.
            If the request requires a protected change, stop and explain why.

      - name: Verify protected paths were not changed
        run: |
          if git diff --name-only "$BASE_BRANCH...HEAD" | grep -E '(^|/)(\.github/workflows/|identity/|policy/|values/|security/|secrets/|payments/|transfers/|military/)' ; then
            echo "Protected path changed; blocking execution."
            exit 1
          fi

      - name: Run independent verification
        run: |
          pnpm --filter jhadina-evolution-core test
          if pnpm --filter jhadina-evolution-core typecheck; then
            echo "Evolution-core typecheck passed."
          else
            echo "Evolution-core typecheck unavailable or failed."
            exit 1
          fi

      - name: Write evidence packet
        run: |
          mkdir -p .jhadina/evidence
          {
            echo "# Jhadina Evolution Evidence"
            echo
            echo "Task: $TASK_ID"
            echo "Run: $GITHUB_RUN_ID"
            echo "Base: $BASE_BRANCH"
            echo "Branch: $BRANCH_NAME"
            echo
            echo "## Changed files"
            git diff --name-only "$BASE_BRANCH...HEAD" || true
            echo
            echo "## Diff stat"
            git diff --stat "$BASE_BRANCH...HEAD" || true
            echo
            echo "## Verification"
            echo "jhadina-evolution-core tests: passed"
            echo "jhadina-evolution-core typecheck: passed"
          } > .jhadina/evidence/$TASK_ID.md

      - name: Commit verified change
        run: |
          git config user.name "Jhadina Evolution"
          git config user.email "jhadina-evolution@users.noreply.github.com"
          git add -A
          git commit -m "chore(jhadina): apply approved evolution ${TASK_ID}"
          git push --set-upstream origin "$BRANCH_NAME"

      - name: Open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --draft \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "Jhadina evolution: $TASK_ID" \
            --body "## Approved Jhadina Evolution\n\nTask: \`$TASK_ID\`\n\nThis change was executed only after the Jhadina evolution approval gate.\n\n### Verification\n- jhadina-evolution-core tests passed\n- jhadina-evolution-core typecheck passed\n- protected-path verification passed\n\n### Evidence\nSee \`.jhadina/evidence/$TASK_ID.md\`."
