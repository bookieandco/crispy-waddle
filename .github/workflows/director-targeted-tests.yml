          src/app/api/director/bonez/voice-identity/approve/route.test.ts
          src/app/api/jhadina/voice/[action]/route.test.ts
          src/lib/director-reference-asset-resolver.test.ts
          src/lib/director-reference-media.test.ts
          src/app/api/workstation/editing-assets/route.test.ts
          src/app/api/workstation/recovery-readiness/route.test.ts
          src/lib/social/director-bridge.test.ts
          src/lib/growth/ugc-batch-experiment-bridge.test.ts
          src/lib/opportunities/director-local-ugc-canary-ledger.test.ts
          src/lib/supabase/middleware.test.ts
          src/lib/supabase/public-config.test.ts
          src/lib/supabase/service-role.test.ts
      - run: pnpm --filter @jhadina/jhadina-web run type-check
      - name: Phantom worker contract
        run: python -m unittest services/director-phantom/test_worker.py
      - name: Hunyuan worker contract
        run: |
          python -m pip install -r services/director-hunyuan/requirements.txt
          python -m py_compile services/director-hunyuan/app.py services/director-hunyuan/music_proxy_policy.py services/director-hunyuan/human_media_proxy_policy.py services/director-hunyuan/vercel_oidc.py
          python -m unittest services/director-hunyuan/test_worker.py services/director-hunyuan/test_music_proxy_policy.py services/director-hunyuan/test_human_media_proxy_policy.py services/director-hunyuan/test_vercel_oidc.py
      - name: MuseTalk human-media worker contract
        run: |
          python -m pip install -r services/director-human-media/requirements.txt
          python -m py_compile services/director-human-media/app.py services/director-human-media/worker.py
          python -m unittest services/director-human-media/test_worker.py
      - name: Speaker QC worker contract
        run: |
          python -m py_compile services/director-speaker-qc/app.py services/director-speaker-qc/vercel_oidc.py
          python -m unittest services/director-speaker-qc/test_worker.py services/director-speaker-qc/test_vercel_oidc.py
      - name: Director Watch worker syntax
        run: >
          python -m py_compile
          services/director-watch-worker/handler.py
          services/director-watch-worker/edge_prefilter.py
          services/director-watch-worker/local_qwen.py
          services/director-watch-worker/cloud_server.py
          services/director-watch-worker/homebase_handler.py
          services/director-watch-worker/homebase_server.py
          services/director-edge-vision-worker/server.py
      - name: Director edge Watch and CVAT safety contract
        run: python scripts/director-edge-watch-contract.py
      - name: Director Colab notebook safety contract
        run: python -m unittest infrastructure/homebase/google-drive/test_director_colab_ai_plus.py -v
      - name: Provision open-source FFmpeg for offline media acceptance
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -version | head -n 1
      - name: Director genuine offline FFmpeg output and media integrity acceptance
        run: |
          python3 scripts/director-offline-final-render-test.py
          pnpm --filter @jhadina/director-core exec vitest run src/timeline-playback-plan.test.ts src/offline-final-render-plan.test.ts src/explainer-director.test.ts src/recast-preview.test.ts
      - name: Director background OIDC/storage readiness regressions
        run: pnpm --filter @jhadina/jhadina-web exec vitest run src/lib/director-background-readiness.test.ts src/lib/director-schema-recovery.test.ts
      - name: Director project/timeline secure request-context OIDC tests
        run: pnpm --filter @jhadina/jhadina-web exec vitest run src/app/api/workstation/timeline/route.test.ts src/app/api/workstation/timeline/command/route.test.ts
      - name: Director missing-schema isolated PostgreSQL 17 replay and tenant ACL/RPC proof
        run: bash scripts/director-commission-13-staging.sh
      - name: Director migration ledger collision inventory (never apply)
        run: |
          python3 scripts/director-converge-schema-preflight.py > /tmp/director-commission-13-inventory.json
          python3 -c "import json; p=json.load(open('/tmp/director-commission-13-inventory.json')); print('DIRECTOR_MIGRATION_TIMESTAMP_COLLISIONS:',json.dumps(p['collidingVersions'],sort_keys=True)); assert p['safeForAutomaticReplay'] is False"
      - name: Director LIVE.20 read-only migration collision and payload-identity gate
        run: |
          python3 scripts/director-live-migration-admission-test.py
          python3 scripts/director-live-migration-admission.py --output /tmp/director-live-20.json
          python3 -c "import json; x=json.load(open('/tmp/director-live-20.json')); assert x['automaticReplayAllowed'] is False; assert x['liveRestoreVerified'] is False; print('DIRECTOR_LIVE_20_SOURCE_AUDIT_PASS; PRODUCTION_DDL_BLOCKED')"
      - name: Director pilot technical QC adversarial smoke (synthetic only)
        run: python3 scripts/director-commission-18-media-qc-test.py
      - name: Director migration collision, RLS, grants and timeline RPC source preflight
        run: |
          python3 scripts/director-converge-background-contract.py
          python3 scripts/director-converge-schema-preflight-test.py
          python3 scripts/director-converge-schema-preflight.py > /tmp/director-schema-preflight.json
          python3 -c "import json; v=json.load(open('/tmp/director-schema-preflight.json')); assert not v['sourceCheckFailures'], v['sourceCheckFailures']; assert v['safeForAutomaticReplay'] is False; print('DIRECTOR_SCHEMA_SOURCE_PREFLIGHT_PASS; LIVE_MIGRATIONS_NOT_APPLIED')"
      - name: Director AUTO.FINAL source contract
        run: python scripts/director-auto-final-contract.py
      - name: Director local UGC canary ledger safety contract
        run: python scripts/director-local-ugc-canary-ledger-contract.py
      - name: Runpod replacement safety contract
        run: python scripts/director-runpod-replacement-contract.py
      - name: Hunyuan immutable source pins
        run: python scripts/director-hunyuan-source-pins-contract.py
      - name: MuseTalk immutable source pins
        run: python scripts/director-human-media-source-pins-contract.py
      - name: MuseTalk one-shot reconcile safety
        run: python scripts/director-human-media-one-shot-contract.py
      - name: Director RunPod outage inventory recovery safety
        run: python scripts/director-runpod-inventory-recovery-contract.py
      - name: Runpod Hunyuan shell contracts
        run: >
          bash -n scripts/runpod-agent-setup.sh &&
          bash -n scripts/director-hunyuan-source-pins.sh &&
          bash -n scripts/director-human-media-source-pins.sh &&
          bash -n scripts/director-human-media-runpod-bootstrap.sh &&
          bash -n scripts/director-hunyuan-runpod-create.sh &&
          bash -n scripts/director-hunyuan-runpod-bootstrap.sh &&
          bash -n scripts/director-hunyuan-lambda-bootstrap.sh &&
          bash -n scripts/director-speaker-qc-runpod-bootstrap.sh &&
          bash -n scripts/music-restoration-runpod-bootstrap.sh &&
          bash -n scripts/music-restoration-runpod-commission.sh
