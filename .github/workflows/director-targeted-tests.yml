          src/animation-performance-state.test.ts
          src/directed-take-qc.test.ts
          src/live-quality-gates.test.ts
          src/ugc-production.test.ts
          src/ugc-batch-experiment.test.ts
          src/local-human-media-stack.test.ts
          src/human-media-worker-contract.test.ts
          src/human-media-adapters.test.ts
          src/human-media-qc.test.ts
          src/human-media-economics.test.ts
