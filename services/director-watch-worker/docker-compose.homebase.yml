services:
  edge-vision:
    build:
      context: ../director-edge-vision-worker
    restart: unless-stopped
    environment:
      DIRECTOR_EDGE_VISION_TOKEN: ${DIRECTOR_EDGE_VISION_TOKEN}
      DIRECTOR_EDGE_VISION_MODEL_PATH: /models/detector.onnx
      DIRECTOR_EDGE_VISION_MODEL_ID: ${DIRECTOR_EDGE_VISION_MODEL_ID}
      DIRECTOR_EDGE_VISION_MODEL_LICENSE: ${DIRECTOR_EDGE_VISION_MODEL_LICENSE}
      DIRECTOR_EDGE_VISION_MODEL_LICENSE_APPROVED: ${DIRECTOR_EDGE_VISION_MODEL_LICENSE_APPROVED:-false}
      DIRECTOR_EDGE_VISION_PROVIDER: ${DIRECTOR_EDGE_VISION_PROVIDER:-generic-yolo-onnx}
      DIRECTOR_EDGE_VISION_PRODUCTION_READY: ${DIRECTOR_EDGE_VISION_PRODUCTION_READY:-false}
      DIRECTOR_EDGE_VISION_BIND: 0.0.0.0
      DIRECTOR_EDGE_VISION_PORT: 8098
      DIRECTOR_EDGE_VISION_INPUT_SIZE: ${DIRECTOR_EDGE_VISION_INPUT_SIZE:-640}
      DIRECTOR_EDGE_VISION_CONFIDENCE: ${DIRECTOR_EDGE_VISION_CONFIDENCE:-0.30}
      DIRECTOR_EDGE_VISION_IOU: ${DIRECTOR_EDGE_VISION_IOU:-0.45}
      DIRECTOR_EDGE_VISION_CLASS_NAMES_JSON: ${DIRECTOR_EDGE_VISION_CLASS_NAMES_JSON:-}
    volumes:
      - ${DIRECTOR_EDGE_VISION_MODEL_HOST_PATH}:/models/detector.onnx:ro
    networks:
      - director-watch-private

  watch-homebase:
    build:
      context: .
      dockerfile: Dockerfile.homebase
    restart: unless-stopped
    depends_on:
      - edge-vision
    environment:
      JHADINA_DIRECTOR_WATCH_HOMEBASE_TOKEN: ${JHADINA_DIRECTOR_WATCH_HOMEBASE_TOKEN}
      DIRECTOR_WATCH_HOMEBASE_PRODUCTION_READY: ${DIRECTOR_WATCH_HOMEBASE_PRODUCTION_READY:-false}
      DIRECTOR_WATCH_HOMEBASE_BIND: 0.0.0.0
      DIRECTOR_WATCH_HOMEBASE_PORT: 8097
      DIRECTOR_WATCH_HOMEBASE_MEDIA_ROOTS: /media
      DIRECTOR_WATCH_HOMEBASE_RTSP_ALLOWLIST: ${DIRECTOR_WATCH_HOMEBASE_RTSP_ALLOWLIST:-}
      DIRECTOR_WATCH_HOMEBASE_CAPTURE_SOURCES: ${DIRECTOR_WATCH_HOMEBASE_CAPTURE_SOURCES:-}
      DIRECTOR_WATCH_HOMEBASE_DECKLINK_ALLOWLIST: ${DIRECTOR_WATCH_HOMEBASE_DECKLINK_ALLOWLIST:-}

      DIRECTOR_WATCH_VLM_BACKEND: ${DIRECTOR_WATCH_VLM_BACKEND:-local-qwen}
      DIRECTOR_WATCH_QWEN_MODEL_PATH: /models/qwen
      DIRECTOR_WATCH_VLM_URL: ${DIRECTOR_WATCH_VLM_URL:-}
      DIRECTOR_WATCH_VLM_MODEL: ${DIRECTOR_WATCH_VLM_MODEL:-}
      DIRECTOR_WATCH_VLM_TOKEN: ${DIRECTOR_WATCH_VLM_TOKEN:-}

      DIRECTOR_WATCH_EDGE_DETECTOR_URL: http://edge-vision:8098/detect
      DIRECTOR_WATCH_EDGE_DETECTOR_HEALTH_URL: http://edge-vision:8098/health
      DIRECTOR_WATCH_EDGE_DETECTOR_HTTP_ALLOWLIST: edge-vision
      DIRECTOR_WATCH_EDGE_DETECTOR_TOKEN: ${DIRECTOR_EDGE_VISION_TOKEN}
      DIRECTOR_WATCH_EDGE_DETECTOR_PROVIDER: ${DIRECTOR_EDGE_VISION_PROVIDER:-generic-yolo-onnx}
      DIRECTOR_WATCH_EDGE_DETECTOR_MODEL: ${DIRECTOR_EDGE_VISION_MODEL_ID}
      DIRECTOR_WATCH_EDGE_DETECTOR_LICENSE: ${DIRECTOR_EDGE_VISION_MODEL_LICENSE}
      DIRECTOR_WATCH_EDGE_DETECTOR_LICENSE_APPROVED: ${DIRECTOR_EDGE_VISION_MODEL_LICENSE_APPROVED:-false}

      JHADINA_DIRECTOR_WATCH_CALLBACK_SECRET: ${JHADINA_DIRECTOR_WATCH_CALLBACK_SECRET}
    volumes:
      - ${DIRECTOR_WATCH_HOMEBASE_MEDIA_HOST_PATH:-/srv/jhadina/media}:/media:ro
      - ${DIRECTOR_WATCH_QWEN_MODEL_HOST_PATH:-/srv/jhadina/models/qwen}:/models/qwen:ro
    ports:
      - "127.0.0.1:8097:8097"
    networks:
      - director-watch-private
      - director-watch-egress

networks:
  director-watch-private:
    internal: true
  director-watch-egress:
    driver: bridge
