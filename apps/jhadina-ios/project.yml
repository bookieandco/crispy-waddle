name: JhadinaSafety
options:
  bundleIdPrefix: com.jhadina
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
schemes:
  JhadinaSafety:
    build:
      targets:
        JhadinaSafety: all
        JhadinaSafetyTests: [test]
    test:
      targets:
        - JhadinaSafetyTests
targets:
  JhadinaSafety:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
    entitlements:
      path: Sources/JhadinaSafety.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jhadina.safety
        PRODUCT_NAME: Jhadina
        EXECUTABLE_NAME: Jhadina
        CODE_SIGN_STYLE: Automatic
  JhadinaSafetyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: JhadinaSafety
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Jhadina.app/Jhadina"
        BUNDLE_LOADER: "$(TEST_HOST)"
