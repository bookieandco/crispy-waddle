name: jhadina-portable

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${JHADINA_POSTGRES_DB:-jhadina}
      POSTGRES_USER: ${JHADINA_POSTGRES_USER:-jhadina}
      POSTGRES_PASSWORD: ${JHADINA_POSTGRES_PASSWORD:?set JHADINA_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${JHADINA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${JHADINA_DATA_ROOT:-./.jhadina-data}/postgres:/var/lib/postgresql/data
      - ./postgres-init/000_supabase_compat.sql:/docker-entrypoint-initdb.d/000_supabase_compat.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JHADINA_POSTGRES_USER:-jhadina} -d ${JHADINA_POSTGRES_DB:-jhadina}"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${JHADINA_MINIO_ROOT_USER:?set JHADINA_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${JHADINA_MINIO_ROOT_PASSWORD:?set JHADINA_MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${JHADINA_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${JHADINA_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${JHADINA_DATA_ROOT:-./.jhadina-data}/minio:/data
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${JHADINA_VALKEY_PORT:-6379}:6379"

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:${JHADINA_NATS_PORT:-4222}:4222"
      - "127.0.0.1:${JHADINA_NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - ${JHADINA_DATA_ROOT:-./.jhadina-data}/nats:/data
