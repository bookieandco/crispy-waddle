name: MONEY-FINISH.15 FINAL Evidence Gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/money-finish-final-evidence.yml"
      - "packages/money-core/src/money-finish-final-gate*"
      - "packages/money-core/src/index.ts"
      - "docs/architecture/MONEY-FINISH-15-FINAL-*"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/money-finish-final-evidence.yml"
      - "packages/money-core/src/money-finish-final-gate*"
permissions:
  contents: read
jobs:
  software-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile
      - name: Money Core type-check
        run: pnpm --filter @jhadina/money-core type-check
      - name: Strict FINAL denial and historical paper regression
        run: pnpm --filter @jhadina/money-core exec tsx --test src/money-finish-final-gate.test.ts src/money-finish-forward-grades.test.ts src/money-finish-forward-journal.test.ts src/money-finish-incubation.test.ts src/money-finish-strategy-factory.test.ts
      - name: Full Money Core regression
        run: pnpm --filter @jhadina/money-core test
