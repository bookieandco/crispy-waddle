name: Director RunPod One Shot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/director-runpod-one-shot.yml
      - .github/workflows/director-runpod-replacement.yml
      - supabase/functions/jhadina-director-bonez-gateway/index.ts
      - services/director-human-media/**
      - services/director-hunyuan/**
      - scripts/director-human-media-*
      - scripts/director-runpod-live-commission.py
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: director-runpod-one-shot
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commission: ${{ steps.state.outputs.commission }}
      reconcile: ${{ steps.state.outputs.reconcile }}
      state: ${{ steps.state.outputs.state }}
      pod_id: ${{ steps.state.outputs.pod_id }}
      hunyuan_base_url: ${{ steps.state.outputs.hunyuan_base_url }}
    env:
      ORIGIN: ${{ vars.JHADINA_PRODUCTION_ORIGIN || 'https://crispy-waddle-jhadina-web.vercel.app' }}
      SWLC_GATEWAY: https://kqbkaozfjubkjevdfvic.supabase.co/functions/v1/jhadina-director-bonez-gateway
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY || secrets.runpod_key }}
      FALLBACK_POD_ID: ${{ vars.DIRECTOR_RUNPOD_POD_ID || '' }}
      FALLBACK_HUNYUAN_BASE_URL: ${{ vars.DIRECTOR_HUNYUAN_BASE_URL || '' }}
      FALLBACK_LOCATOR_SHA: ${{ vars.DIRECTOR_RUNTIME_LOCATOR_SHA || '' }}
    steps:
      - name: Request Director provisioning OIDC
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('director-runpod-provisioning')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Install RunPod CLI for read-only recovery
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}" || { echo "DIRECTOR_RUNPOD_API_KEY_REQUIRED" >&2; exit 1; }
          curl -fsSL https://cli.runpod.net | sudo bash
          runpodctl version

      - name: Resolve Director commissioning state
        id: state
        env:
          DIRECTOR_PROVISION_OIDC: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          provision_body="$(mktemp)"
          provision_status="$(curl --silent --show-error --connect-timeout 5 --max-time 12 \
            --request POST \
            --output "$provision_body" --write-out '%{http_code}' \
            --header "Authorization: Bearer $DIRECTOR_PROVISION_OIDC" \
            --header "Content-Type: application/json" \
            --data '{"action":"runpod-provisioning-status"}' \
            "$SWLC_GATEWAY" || true)"
          provision_authorized="$(jq -r '.authorized // false' "$provision_body" 2>/dev/null || echo false)"
          director_authority_ready=false
          if [[ "$provision_status" =~ ^2 && "$provision_authorized" == "true" ]]; then
            director_authority_ready=true
          fi

          director_body="$(mktemp)"
          director_status="$(curl --silent --show-error --connect-timeout 5 --max-time 12 \
            --output "$director_body" --write-out '%{http_code}' \
            --header "Accept: application/json" \
            "${ORIGIN%/}/api/director/hunyuan/health" || true)"
          runtime_ready="$(jq -r '.productionReady // false' "$director_body" 2>/dev/null || echo false)"
          generation_enabled="$(jq -r '.generationEnabled // false' "$director_body" 2>/dev/null || echo false)"
          governed_ready="$(jq -r '.governedGenerationReady // false' "$director_body" 2>/dev/null || echo false)"
          governed_error="$(jq -r '.governedGenerationError // empty' "$director_body" 2>/dev/null || true)"

          registered_pod_id="$(jq -r '.runtime.podId // empty' "$provision_body" 2>/dev/null || true)"
          hunyuan_base_url="$(jq -r '.runtime.hunyuanBaseUrl // empty' "$provision_body" 2>/dev/null || true)"
          human_media_base_url="$(jq -r '.runtime.humanMediaBaseUrl // empty' "$provision_body" 2>/dev/null || true)"

          inventory_state="not-needed"
          inventory_candidates=0
          healthy_candidates=0
          recovered_runtime_ready=false
          recovered_pod_id=""
          recovered_hunyuan_base_url=""

          locator_source="runpod-inventory"
          fallback_pod_id="${FALLBACK_POD_ID:-}"
          fallback_hunyuan="${FALLBACK_HUNYUAN_BASE_URL%/}"
          fallback_sha="${FALLBACK_LOCATOR_SHA:-}"
          fallback_locator_valid=false
          expected_fallback=""
          if [[ "$fallback_pod_id" =~ ^[A-Za-z0-9]+$ ]]; then
            expected_fallback="https://${fallback_pod_id}-8091.proxy.runpod.net"
          fi
          if [[ -n "$fallback_sha" && -n "$expected_fallback" && "$fallback_hunyuan" == "$expected_fallback" ]]; then
            fallback_locator_valid=true
          fi

          if [[ "$director_authority_ready" != "true" || -z "$registered_pod_id" || -z "$hunyuan_base_url" ]]; then
            inventory_state="inventory"
            runpodctl pod list --all --compute-type GPU -o json >/tmp/director-runpod-inventory.json
            jq -c '
              (if type=="array" then . else (.pods // .items // []) end)
              | map(
                  select((.name // "") | startswith("jhadina-director-"))
                  | select((.gpuCount // 0) >= 1)
                  | select(((.runtimeStatus // .status // "") | ascii_downcase) == "running")
                  | {id,name,runtimeStatus:(.runtimeStatus // .status // null),gpuCount:(.gpuCount // 0),desiredStatus:(.desiredStatus // null)}
                )
            ' /tmp/director-runpod-inventory.json >/tmp/director-runpod-candidates-safe.json
            inventory_candidates="$(jq 'length' /tmp/director-runpod-candidates-safe.json)"

            : >/tmp/director-runpod-healthy-safe.jsonl
            while IFS= read -r candidate; do
              pod_id="$(jq -r '.id' <<<"$candidate")"
              pod_name="$(jq -r '.name' <<<"$candidate")"
              test -n "$pod_id" || continue
              health_file="$(mktemp)"
              h_code="$(curl --silent --show-error --connect-timeout 5 --max-time 10                 --output "$health_file" --write-out '%{http_code}'                 "https://${pod_id}-8091.proxy.runpod.net/health" || true)"
              h_ready="$(jq -r '.productionReady // false' "$health_file" 2>/dev/null || echo false)"
              if [[ "$h_code" == "200" && "$h_ready" == "true" ]]; then
                jq -cn --arg id "$pod_id" --arg name "$pod_name"                   --arg base "https://${pod_id}-8091.proxy.runpod.net"                   '{id:$id,name:$name,hunyuanBaseUrl:$base,productionReady:true}'                   >>/tmp/director-runpod-healthy-safe.jsonl
              fi
            done < <(jq -c '.[]' /tmp/director-runpod-candidates-safe.json)

            if [[ -s /tmp/director-runpod-healthy-safe.jsonl ]]; then
              jq -s '.' /tmp/director-runpod-healthy-safe.jsonl >/tmp/director-runpod-healthy-safe.json
            else
              printf '[]\n' >/tmp/director-runpod-healthy-safe.json
            fi
            healthy_candidates="$(jq 'length' /tmp/director-runpod-healthy-safe.json)"

            if [[ "$healthy_candidates" == "1" ]]; then
              recovered_pod_id="$(jq -r '.[0].id' /tmp/director-runpod-healthy-safe.json)"
              recovered_hunyuan_base_url="$(jq -r '.[0].hunyuanBaseUrl' /tmp/director-runpod-healthy-safe.json)"
              registered_pod_id="$recovered_pod_id"
              hunyuan_base_url="$recovered_hunyuan_base_url"
              human_media_base_url="${recovered_hunyuan_base_url%/}/human-media"
              recovered_runtime_ready=true
              inventory_state="single-healthy-existing-pod"
              echo "DIRECTOR_ONE_SHOT_RUNPOD_RECOVERY_SINGLE_HEALTHY:$recovered_pod_id"
            elif [[ "$healthy_candidates" -gt 1 ]]; then
              fallback_matches=0
              if [[ "$fallback_locator_valid" == "true" ]]; then
                fallback_matches="$(jq --arg id "$fallback_pod_id" '[.[] | select(.id==$id)] | length' /tmp/director-runpod-healthy-safe.json)"
              fi
              if [[ "$fallback_matches" == "1" ]]; then
                recovered_pod_id="$fallback_pod_id"
                recovered_hunyuan_base_url="$fallback_hunyuan"
                registered_pod_id="$recovered_pod_id"
                hunyuan_base_url="$recovered_hunyuan_base_url"
                human_media_base_url="${recovered_hunyuan_base_url%/}/human-media"
                recovered_runtime_ready=true
                inventory_state="fallback-disambiguated-existing-pod"
                locator_source="github-variable-fallback"
                echo "DIRECTOR_ONE_SHOT_USING_SAFE_RUNTIME_LOCATOR_FALLBACK:$recovered_pod_id"
              else
                inventory_state="ambiguous-healthy-existing-pods"
                echo "DIRECTOR_ONE_SHOT_RUNPOD_RECOVERY_AMBIGUOUS:$healthy_candidates"
              fi
            elif [[ "$inventory_candidates" == "0" ]]; then
              inventory_state="no-existing-director-pod"
              echo "DIRECTOR_ONE_SHOT_RUNPOD_RECOVERY_NONE"
            else
              inventory_state="no-healthy-existing-director-pod"
              echo "DIRECTOR_ONE_SHOT_RUNPOD_RECOVERY_NO_HEALTHY:$inventory_candidates"
            fi
          fi
          human_media_body="$(mktemp)"
          human_media_status="000"
          human_media_ready=false
          if [[ -n "$human_media_base_url" ]]; then
            human_media_status="$(curl --silent --show-error --connect-timeout 10 --max-time 20               --output "$human_media_body" --write-out '%{http_code}'               --header "Accept: application/json"               "${human_media_base_url%/}/health" || true)"
            if [[ "$human_media_status" == "200" ]] && [[ "$(jq -r '.productionReady // false' "$human_media_body" 2>/dev/null || echo false)" == "true" ]]; then
              human_media_ready=true
            fi
          fi

          commission=false
          reconcile=false
          state="waiting-swlc-recovery"

          if [[ "$director_status" == "200" && "$runtime_ready" == "true" && "$human_media_ready" == "true" ]]; then
            if [[ "$governed_ready" == "true" ]]; then
              state="generation-ready"
              echo "DIRECTOR_ONE_SHOT_GENERATION_AND_HUMAN_MEDIA_READY"
            else
              state="waiting-artifact-admission"
              echo "DIRECTOR_ONE_SHOT_RUNTIME_READY_WAITING_ARTIFACT_ADMISSION:${governed_error:-unknown}"
            fi
          elif [[ "$recovered_runtime_ready" == "true" && "$human_media_ready" == "true" ]]; then
            state="existing-runtime-ready-swlc-recovery"
            echo "DIRECTOR_ONE_SHOT_EXISTING_RUNTIME_AND_HUMAN_MEDIA_READY_SWLC_RECOVERY:$registered_pod_id"
          elif [[ "$recovered_runtime_ready" == "true" && -n "$registered_pod_id" && -n "$hunyuan_base_url" ]]; then
            reconcile=true
            state="reconcile-human-media-recovered"
            echo "DIRECTOR_ONE_SHOT_RECONCILE_RECOVERED_HUMAN_MEDIA:$registered_pod_id"
          elif [[ "$inventory_state" == "ambiguous-healthy-existing-pods" ]]; then
            state="ambiguous-existing-pods"
            echo "DIRECTOR_ONE_SHOT_EXISTING_POD_IDENTITY_AMBIGUOUS:$healthy_candidates"
          elif [[ "$inventory_state" == "no-existing-director-pod" || "$inventory_state" == "no-healthy-existing-director-pod" ]]; then
            state="replacement-required-waiting-approval"
            echo "DIRECTOR_ONE_SHOT_REPLACEMENT_REQUIRED_WAITING_APPROVAL:$inventory_state"
          elif [[ "$director_status" == "200" && "$runtime_ready" == "true" && "$director_authority_ready" == "true" && -n "$registered_pod_id" && -n "$hunyuan_base_url" ]]; then
            reconcile=true
            state="reconcile-human-media"
            echo "DIRECTOR_ONE_SHOT_RECONCILE_EXISTING_HUMAN_MEDIA:$registered_pod_id"
          elif [[ "$director_status" == "200" && "$runtime_ready" == "true" ]]; then
            state="waiting-human-media-registration"
            echo "DIRECTOR_ONE_SHOT_HEALTHY_POD_WAITING_HUMAN_MEDIA_REGISTRATION"
          elif [[ "$director_authority_ready" == "true" ]]; then
            commission=true
            state="commission-runtime"
            echo "DIRECTOR_ONE_SHOT_COMMISSION_ADMITTED"
          else
            echo "DIRECTOR_ONE_SHOT_WAITING_FOR_SWLC_RECOVERY:http=$provision_status:authorized=$provision_authorized"
          fi

          {
            echo "commission=$commission"
            echo "reconcile=$reconcile"
            echo "state=$state"
            echo "pod_id=$registered_pod_id"
            echo "hunyuan_base_url=$hunyuan_base_url"
          } >> "$GITHUB_OUTPUT"

          jq -n \
            --arg observedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg origin "$ORIGIN" \
            --arg provisionHttp "$provision_status" \
            --arg provisionAuthorized "$provision_authorized" \
            --arg directorHttp "$director_status" \
            --arg runtimeReady "$runtime_ready" \
            --arg generationEnabled "$generation_enabled" \
            --arg governedGenerationReady "$governed_ready" \
            --arg governedGenerationError "${governed_error:-}" \
            --arg inventoryState "$inventory_state" \
            --arg inventoryCandidates "$inventory_candidates" \
            --arg healthyCandidates "$healthy_candidates" \
            --arg recoveredPodId "$recovered_pod_id"             --arg locatorSource "$locator_source" \
            '{observedAt:$observedAt,origin:$origin,locatorSource:$locatorSource,directorAuthority:{http:$provisionHttp,authorized:($provisionAuthorized=="true")},director:{http:$directorHttp,productionReady:($runtimeReady=="true"),generationEnabled:($generationEnabled=="true"),governedGenerationReady:($governedGenerationReady=="true"),governedGenerationError:$governedGenerationError},runpodRecovery:{state:$inventoryState,candidateCount:($inventoryCandidates|tonumber),healthyCandidateCount:($healthyCandidates|tonumber),recoveredPodId:($recoveredPodId|select(length>0))}}' \
            >/tmp/director-one-shot-preflight.json

      - name: Upload one-shot preflight receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: director-one-shot-preflight-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            /tmp/director-one-shot-preflight.json
            /tmp/director-runpod-candidates-safe.json
            /tmp/director-runpod-healthy-safe.json
          retention-days: 14

  reconcile_existing:
    needs: preflight
    if: needs.preflight.outputs.reconcile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY || secrets.runpod_key }}
      POD_ID: ${{ needs.preflight.outputs.pod_id }}
      HUNYUAN_BASE_URL: ${{ needs.preflight.outputs.hunyuan_base_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Require existing RunPod authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}" || { echo "DIRECTOR_RUNPOD_API_KEY_REQUIRED" >&2; exit 1; }
          test -n "${POD_ID:-}" || { echo "DIRECTOR_EXISTING_POD_ID_REQUIRED" >&2; exit 1; }
          test -n "${HUNYUAN_BASE_URL:-}" || { echo "DIRECTOR_EXISTING_HUNYUAN_URL_REQUIRED" >&2; exit 1; }
      - name: Install RunPod CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.runpod.net | sudo bash
          runpodctl version
      - name: Reconcile existing Director pod
        shell: bash
        run: |
          set -euo pipefail
          runpodctl pod get "$POD_ID" -o json >/tmp/director-existing-pod.json
          runpodctl exec python scripts/director-runpod-live-commission.py --pod_id "$POD_ID"
      - name: Verify MuseTalk human-media runtime
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 540); do
            status="$(curl -sS -o /tmp/director-human-media-health.json -w '%{http_code}' "${HUNYUAN_BASE_URL%/}/human-media/health" || true)"
            ready="$(jq -r '.productionReady // false' /tmp/director-human-media-health.json 2>/dev/null || echo false)"
            if [[ "$status" == "200" && "$ready" == "true" ]]; then
              jq '{status,productionReady,engine,runtimeInstanceId,imageDigest,sourceRevision,modelArtifactSha256s,gpu,licenseEvidenceIds,reasons}' /tmp/director-human-media-health.json
              echo "DIRECTOR_EXISTING_POD_HUMAN_MEDIA_READY"
              exit 0
            fi
            sleep 10
          done
          echo "DIRECTOR_EXISTING_POD_HUMAN_MEDIA_TIMEOUT" >&2
          cat /tmp/director-human-media-health.json >&2 || true
          exit 1
      - name: Upload in-place reconcile receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: director-human-media-reconcile-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            /tmp/director-existing-pod.json
            /tmp/director-human-media-health.json
          retention-days: 14

  commission:
    needs: preflight
    if: needs.preflight.outputs.commission == 'true'
    uses: ./.github/workflows/director-runpod-replacement.yml
    with:
      mode: create
      confirmation: CREATE_BILLABLE_DIRECTOR_GPU
      gpu_id: AUTO
      max_hourly_usd: "0.60"
    secrets: inherit

  settled:
    needs:
      - preflight
      - reconcile_existing
      - commission
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Record supervisor outcome
        shell: bash
        run: |
          set -euo pipefail
          preflight="${{ needs.preflight.outputs.state }}"
          reconcile="${{ needs.reconcile_existing.result }}"
          commission="${{ needs.commission.result }}"
          echo "Director one-shot state: $preflight"
          echo "Existing-pod reconcile result: $reconcile"
          echo "Commission job result: $commission"
          if [[ "$preflight" == "waiting-swlc-recovery" ]]; then
            echo "No billable compute was created. SWLC is unavailable; the scheduled supervisor will retry after the control plane and database recover."
          elif [[ "$preflight" == "replacement-required-waiting-approval" ]]; then
            echo "No healthy Director GPU exists; billable replacement still requires explicit approval."
          elif [[ "$preflight" == "ambiguous-existing-pods" ]]; then
            echo "More than one healthy Director GPU exists; no pod was mutated until identity is disambiguated."
          elif [[ "$preflight" == "reconcile-human-media-recovered" && "$reconcile" == "success" ]]; then
            echo "Director recovered one healthy existing GPU by read-only inventory and commissioned MuseTalk in place without SWLC."
          elif [[ "$preflight" == "existing-runtime-ready-swlc-recovery" ]]; then
            echo "One healthy Director GPU and MuseTalk runtime were recovered directly while SWLC is unavailable; no billable mutation was performed."
          elif [[ "$preflight" == "waiting-human-media-registration" ]]; then
            echo "The existing Director GPU is healthy, so no replacement was created. MuseTalk reconcile waits for SWLC to expose the registered pod identity."
          elif [[ "$preflight" == "reconcile-human-media" && "$reconcile" == "success" ]]; then
            echo "Director reused the registered GPU Pod and commissioned MuseTalk in place; no replacement GPU was created."
          elif [[ "$preflight" == "waiting-artifact-admission" ]]; then
            echo "Director GPU and human-media runtimes are healthy. No duplicate GPU was created while REF-PROV admission/attestation remains pending."
          elif [[ "$preflight" == "generation-ready" ]]; then
            echo "Director governed generation and MuseTalk human-media runtime are ready; no replacement was created."
          elif [[ "$commission" == "success" ]]; then
            echo "Director runtime commission completed. Subsequent scheduled runs should no-op while runtime health remains ready."
          fi
