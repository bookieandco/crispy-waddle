name: PL-7 Live Stripe Verification

# Manual trigger only. This is the only workflow in the repo permitted
# to make a real call against Stripe's test API, and it never runs
# unless a human explicitly dispatches it — no push, pull_request, or
# schedule trigger exists here. Construction of this workflow does not
# authorize dispatching it; that is a separate, explicit decision made
# each time via the Actions tab (or the API), never automatic.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pl7-live-stripe-verification
  cancel-in-progress: false

jobs:
  live-verification:
    name: Seven-scenario live Stripe evidence run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Static self-check: the secret must be referenced in exactly one
      # place in this file (the scoped env: block on the final step)
      # and nowhere else — never echoed, never passed to an artifact
      # upload, never added to a broader job- or workflow-level env.
      - name: Verify the credential is scoped to exactly one step
        run: |
          count=$(grep -c "JHADINA_SECRET_STRIPE_SANDBOX" .github/workflows/pl7-live-stripe-verification.yml || true)
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one reference to JHADINA_SECRET_STRIPE_SANDBOX in this workflow file, found $count" >&2
            exit 1
          fi

      # No artifact is uploaded from this job — evidence lives only in
      # this step's own log output (GitHub Actions automatically
      # redacts the registered secret value anywhere it would appear
      # in step output, as a backstop behind the fact that the suite
      # itself never logs it). Fails closed before any Stripe call if
      # the credential is missing or isn't a real sk_test_ value —
      # see sandbox-credential.ts's assertStripeSandboxKey.
      - name: Run the seven-scenario live Stripe evidence suite
        working-directory: apps/jhadina-web
        env:
          JHADINA_SECRET_STRIPE_SANDBOX: ${{ secrets.JHADINA_SECRET_STRIPE_SANDBOX }}
        run: pnpm exec vitest run --config vitest.pl7-live.config.ts
