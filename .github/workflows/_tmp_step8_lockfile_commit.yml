name: Step 8 Temporary Lockfile Commit

on:
  push:
    branches:
      - fix/step8-lockfile

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/step8-lockfile
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Generate lockfile
        run: pnpm install --lockfile-only

      - name: Verify lockfile
        run: pnpm install --frozen-lockfile

      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/_tmp_step8_lockfile_commit.yml
          git diff --cached -- pnpm-lock.yaml
          git commit -m "fix: sync Step 8 workspace lockfile"
          git push origin fix/step8-lockfile
