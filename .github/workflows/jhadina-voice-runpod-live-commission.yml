name: Jhadina Voice RunPod Commission

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Plan only or create a dedicated audition GPU pod"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - create-audition
      confirmation:
        description: "For create-audition enter exactly CREATE_BILLABLE_JHADINA_VOICE_GPU"
        required: false
        type: string
      gpu_id:
        description: "RunPod GPU type, or AUTO to select current US Secure capacity"
        required: true
        default: "AUTO"
        type: string
      max_hourly_usd:
        description: "Maximum Secure Cloud hourly price when gpu_id=AUTO"
        required: true
        default: "1.10"
        type: string

permissions:
  contents: read

concurrency:
  group: jhadina-voice-runpod-commission
  cancel-in-progress: false

jobs:
  commission:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY || secrets.runpod_key }}
      REQUESTED_MODE: ${{ inputs.mode || 'plan' }}
      CONFIRMATION: ${{ inputs.confirmation || '' }}
      REQUESTED_GPU_ID: ${{ inputs.gpu_id || 'AUTO' }}
      MAX_GPU_HOURLY_USD: ${{ inputs.max_hourly_usd || '1.10' }}
      MIN_GPU_MEMORY_GB: "24"
    steps:
      - uses: actions/checkout@v4

      - name: Require RunPod API authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}" || { echo "JHADINA_VOICE_RUNPOD_API_KEY_REQUIRED" >&2; exit 1; }

      - name: Install RunPod CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.runpod.net | sudo bash
          runpodctl version
          runpodctl pod create --help >/tmp/jhadina-voice-runpod-create-help.txt
          if ! runpodctl exec python --help 2>&1 | grep -q -- '--pod_id'; then
            echo "JHADINA_VOICE_RUNPOD_EXEC_POD_ID_FLAG_UNAVAILABLE" >&2
            exit 1
          fi

      - name: Select viable US Secure GPU capacity
        id: gpu
        shell: bash
        run: |
          set -euo pipefail
          runpodctl gpu list >/tmp/jhadina-voice-gpu-list.json

          valid_gpu() {
            local id="$1"
            jq -ce \
              --arg id "$id" \
              --argjson max "$MAX_GPU_HOURLY_USD" \
              --argjson min "$MIN_GPU_MEMORY_GB" \
              '[.[]
                | select(.gpuId == $id)
                | select(.available == true)
                | select(.secureCloud == true)
                | select((.memoryInGb // 0) >= $min)
                | select((.securePricePerHr // 999999) <= $max)
                | select(any(.dataCenterAvailability[]?;
                    (.dataCenterId | startswith("US-")) and (.stockStatus != "none")))
              ] | first // empty' /tmp/jhadina-voice-gpu-list.json
          }

          selected=""
          if [[ "$REQUESTED_GPU_ID" != "AUTO" ]]; then
            selected="$(valid_gpu "$REQUESTED_GPU_ID" || true)"
            [[ -n "$selected" ]] || { echo "JHADINA_VOICE_REQUESTED_GPU_UNAVAILABLE_OR_OVER_CAP" >&2; exit 1; }
          else
            preferred=(
              "NVIDIA RTX A6000"
              "NVIDIA A40"
              "NVIDIA RTX 5090"
              "NVIDIA RTX 6000 Ada Generation"
              "NVIDIA L40"
              "NVIDIA RTX 4090"
              "NVIDIA RTX 3090"
            )
            for id in "${preferred[@]}"; do
              selected="$(valid_gpu "$id" || true)"
              [[ -n "$selected" ]] && break
            done
            if [[ -z "$selected" ]]; then
              selected="$(jq -ce \
                --argjson max "$MAX_GPU_HOURLY_USD" \
                --argjson min "$MIN_GPU_MEMORY_GB" \
                '[.[]
                  | select(.available == true)
                  | select(.secureCloud == true)
                  | select((.memoryInGb // 0) >= $min)
                  | select((.securePricePerHr // 999999) <= $max)
                  | select(any(.dataCenterAvailability[]?;
                      (.dataCenterId | startswith("US-")) and (.stockStatus != "none")))
                ]
                | sort_by([.securePricePerHr, -(.memoryInGb // 0)])
                | first // empty' /tmp/jhadina-voice-gpu-list.json || true)"
            fi
            [[ -n "$selected" ]] || { echo "JHADINA_VOICE_NO_US_SECURE_GPU_WITHIN_CAP" >&2; exit 1; }
          fi

          printf '%s\n' "$selected" >/tmp/jhadina-voice-selected-gpu.json
          SELECTED_GPU_ID="$(printf '%s' "$selected" | jq -r '.gpuId')"
          SELECTED_GPU_PRICE="$(printf '%s' "$selected" | jq -r '.securePricePerHr')"
          SELECTED_GPU_MEMORY="$(printf '%s' "$selected" | jq -r '.memoryInGb')"
          SELECTED_GPU_STOCK="$(printf '%s' "$selected" | jq -r '.stockStatus')"
          {
            echo "SELECTED_GPU_ID=$SELECTED_GPU_ID"
            echo "SELECTED_GPU_PRICE=$SELECTED_GPU_PRICE"
            echo "SELECTED_GPU_MEMORY=$SELECTED_GPU_MEMORY"
            echo "SELECTED_GPU_STOCK=$SELECTED_GPU_STOCK"
          } >> "$GITHUB_ENV"

      - name: Voice GPU plan
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Jhadina dedicated voice GPU plan"
            echo
            echo "- mode: $REQUESTED_MODE"
            echo "- selected GPU: $SELECTED_GPU_ID ($SELECTED_GPU_MEMORY GB, Secure \$$SELECTED_GPU_PRICE/hr)"
            echo "- max automatic price: \$$MAX_GPU_HOURLY_USD/hr"
            echo "- phase on creation: audition only"
            echo "- audition model: Qwen3-TTS 1.7B VoiceDesign"
            echo "- production transition later: Qwen3-TTS Base + VoxCPM2 + Jhadina router + ECAPA QC"
            echo "- ports: 8093/qwen, 8094/voxcpm, 8095/router, 8096/speaker-qc, 22/ssh"
            echo "- container disk: 80 GB"
            echo "- local workspace volume: 200 GB"
            echo "- auto-stop: 2h"
            echo "- auto-terminate: 72h"
            echo
            if [[ "$REQUESTED_MODE" == "plan" ]]; then
              echo "**Plan only. No billable GPU is created.**"
            else
              echo "**Billable creation requested; the explicit confirmation gate must pass.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop after plan
        if: env.REQUESTED_MODE == 'plan'
        shell: bash
        run: echo "JHADINA_VOICE_RUNPOD_PLAN_ONLY"

      - name: Enforce explicit billable creation approval
        if: env.REQUESTED_MODE == 'create-audition'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "CREATE_BILLABLE_JHADINA_VOICE_GPU" ]]; then
            echo "JHADINA_VOICE_RUNPOD_CREATE_CONFIRMATION_REQUIRED" >&2
            exit 1
          fi

      - name: Create private runtime credentials
        if: env.REQUESTED_MODE == 'create-audition'
        shell: bash
        run: |
          set -euo pipefail
          for name in QWEN_TOKEN VOX_TOKEN VOICE_TOKEN QC_TOKEN; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Create dedicated voice GPU pod
        if: env.REQUESTED_MODE == 'create-audition'
        id: create
        shell: bash
        run: |
          set -euo pipefail
          POD_NAME="jhadina-voice-$GITHUB_RUN_ID"
          ENV_JSON="$(jq -cn \
            --arg qwen "$QWEN_TOKEN" \
            --arg vox "$VOX_TOKEN" \
            --arg voice "$VOICE_TOKEN" \
            --arg qc "$QC_TOKEN" \
            '{
              JHADINA_VOICE_PHASE:"audition",
              JHADINA_QWEN3_TTS_TOKEN:$qwen,
              JHADINA_VOXCPM2_TTS_TOKEN:$vox,
              JHADINA_VOICE_TOKEN:$voice,
              JHADINA_SPEAKER_QC_TOKEN:$qc,
              JHADINA_SOURCE_REF:"main"
            }')"
          runpodctl pod create \
            --name "$POD_NAME" \
            --image "runpod/pytorch:1.0.3-cu1281-torch291-ubuntu2404" \
            --gpu-id "$SELECTED_GPU_ID" \
            --gpu-count 1 \
            --cloud-type SECURE \
            --container-disk-in-gb 80 \
            --volume-in-gb 200 \
            --volume-mount-path /workspace \
            --ports "8093/http,8094/http,8095/http,8096/http,22/tcp" \
            --min-cuda-version 12.4 \
            --ssh true \
            --country-code US \
            --stop-after 2h \
            --terminate-after 72h \
            --env "$ENV_JSON" \
            -o json >/tmp/jhadina-voice-pod-create.json

          POD_ID="$(jq -r '.id // .pod.id // .data.id // empty' /tmp/jhadina-voice-pod-create.json)"
          if [[ -z "$POD_ID" ]]; then
            runpodctl pod list --all --name "$POD_NAME" -o json >/tmp/jhadina-voice-pod-list.json
            POD_ID="$(jq -r '
              if type=="array" then (map(select(.name=="'"$POD_NAME"'"))[0].id // empty)
              else (.pods // [] | map(select(.name=="'"$POD_NAME"'"))[0].id // empty)
              end
            ' /tmp/jhadina-voice-pod-list.json)"
          fi
          test -n "$POD_ID" || { echo "JHADINA_VOICE_RUNPOD_ID_MISSING" >&2; exit 1; }
          echo "pod_id=$POD_ID" >> "$GITHUB_OUTPUT"
          echo "VOICE_POD_ID=$POD_ID" >> "$GITHUB_ENV"
          echo "QWEN_PROXY=https://$POD_ID-8093.proxy.runpod.net" >> "$GITHUB_ENV"
          jq '{id,name,desiredStatus,runtimeStatus,gpuCount,ports,ssh}' /tmp/jhadina-voice-pod-create.json \
            >/tmp/jhadina-voice-pod-create-safe.json 2>/dev/null || true

      - name: Wait for GPU and SSH
        if: env.REQUESTED_MODE == 'create-audition'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            runpodctl pod get "$VOICE_POD_ID" -o json >/tmp/jhadina-voice-pod.json
            gpu="$(jq -r '.gpuCount // 0' /tmp/jhadina-voice-pod.json)"
            runtime="$(jq -r '.runtimeStatus // "unknown"' /tmp/jhadina-voice-pod.json)"
            ssh_error="$(jq -r '.ssh.error // ""' /tmp/jhadina-voice-pod.json)"
            if [[ "$gpu" -ge 1 && "$runtime" == "running" && -z "$ssh_error" ]]; then
              jq '{id,name,desiredStatus,runtimeStatus,gpuCount,ports,ssh}' /tmp/jhadina-voice-pod.json \
                >/tmp/jhadina-voice-pod-safe.json
              echo "JHADINA_VOICE_RUNPOD_GPU_SSH_READY"
              exit 0
            fi
            sleep 10
          done
          echo "JHADINA_VOICE_RUNPOD_GPU_SSH_TIMEOUT" >&2
          exit 1

      - name: Bootstrap audition runtime
        if: env.REQUESTED_MODE == 'create-audition'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 8); do
            if timeout 180s runpodctl exec python scripts/jhadina-voice-runpod-live-commission.py --pod_id "$VOICE_POD_ID"; then
              echo "JHADINA_VOICE_AUDITION_BOOTSTRAP_ACCEPTED"
              exit 0
            fi
            sleep 20
          done
          echo "JHADINA_VOICE_AUDITION_BOOTSTRAP_FAILED" >&2
          exit 1

      - name: Verify public audition provider
        if: env.REQUESTED_MODE == 'create-audition'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            code="$(curl -sS -o /tmp/jhadina-qwen-health.json -w '%{http_code}' "$QWEN_PROXY/health" || true)"
            ready="$(jq -r '.auditionReady // false' /tmp/jhadina-qwen-health.json 2>/dev/null || echo false)"
            production="$(jq -r '.productionReady // false' /tmp/jhadina-qwen-health.json 2>/dev/null || echo false)"
            if [[ "$code" == "200" && "$ready" == "true" && "$production" == "false" ]]; then
              echo "JHADINA_VOICE_AUDITION_PROVIDER_READY"
              exit 0
            fi
            sleep 10
          done
          echo "JHADINA_VOICE_AUDITION_PROVIDER_TIMEOUT" >&2
          cat /tmp/jhadina-qwen-health.json 2>/dev/null || true
          exit 1

      - name: Record pod handoff
        if: env.REQUESTED_MODE == 'create-audition'
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg podId "$VOICE_POD_ID" \
            --arg qwen "$QWEN_PROXY" \
            --arg gpu "$SELECTED_GPU_ID" \
            --arg price "$SELECTED_GPU_PRICE" \
            '{
              podId:$podId,
              phase:"audition",
              qwenBaseUrl:$qwen,
              gpuId:$gpu,
              securePricePerHour:($price|tonumber),
              canonicalVoiceIdentity:"voice:jhadina:canonical:v1",
              productionCertified:false,
              next:"Generate and review audition candidates; do not approve automatically."
            }' >/tmp/jhadina-voice-pod-handoff.json
          cat /tmp/jhadina-voice-pod-handoff.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload safe commissioning receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jhadina-voice-runpod-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            /tmp/jhadina-voice-gpu-list.json
            /tmp/jhadina-voice-selected-gpu.json
            /tmp/jhadina-voice-pod-create-safe.json
            /tmp/jhadina-voice-pod-safe.json
            /tmp/jhadina-qwen-health.json
            /tmp/jhadina-voice-pod-handoff.json
          retention-days: 14
