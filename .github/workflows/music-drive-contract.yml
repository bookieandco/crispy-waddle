name: Music Drive source contract

on:
  pull_request:
    paths:
      - 'infrastructure/homebase/google-drive/music_assets.py'
      - 'infrastructure/homebase/google-drive/test_music_assets.py'
      - '.github/workflows/music-drive-contract.yml'
  push:
    branches:
      - main
      - 'feat/music-drive-*'
    paths:
      - 'infrastructure/homebase/google-drive/music_assets.py'
      - 'infrastructure/homebase/google-drive/test_music_assets.py'
      - '.github/workflows/music-drive-contract.yml'
permissions:
  contents: read
jobs:
  music-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: python3 -m py_compile infrastructure/homebase/google-drive/music_assets.py
      - name: Isolated hermetic tests
        run: python3 -m unittest discover -s infrastructure/homebase/google-drive -p 'test_music_assets.py' -v
