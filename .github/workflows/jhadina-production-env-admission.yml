name: Jhadina Production Environment Admission

on:
  pull_request:
    paths:
      - ".github/workflows/jhadina-production-env-admission.yml"
      - "apps/jhadina-web/scripts/vercel-production-env-admission.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/jhadina-production-env-admission.yml"
      - "apps/jhadina-web/scripts/vercel-production-env-admission.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jhadina-production-env-admission-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate production admission script syntax
        run: node --check apps/jhadina-web/scripts/vercel-production-env-admission.mjs

  sync-and-admit:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: pupsonstuff-production
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_NYQJ3NwijZZ6UJQdOdc5FjmX
      VERCEL_PROJECT_ID: prj_QK9bYgb8lwUvJgsYfJG6YLSzVPco
      VERCEL_PROJECT_NAME: crispy-waddle-jhadina-web
      JHADINA_PRODUCTION_ORIGIN: https://crispy-waddle-jhadina-web.vercel.app
      NEXT_PUBLIC_SUPABASE_URL: https://kqbkaozfjubkjevdfvic.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_FVcYgRA8XOS5ZvePFgU4GQ_vdWTTvA7
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require protected deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::VERCEL_TOKEN repository secret is required"; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY repository secret is required"; exit 1; }
          echo "::add-mask::${VERCEL_TOKEN}"
          echo "::add-mask::${SUPABASE_SERVICE_ROLE_KEY}"

      - name: Sync production Supabase environment and admit deployment
        run: node apps/jhadina-web/scripts/vercel-production-env-admission.mjs
