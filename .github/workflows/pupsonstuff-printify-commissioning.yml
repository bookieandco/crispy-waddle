name: PupsonStuff Printify Commissioning Probe

on:
  push:
    branches:
      - main
    paths:
      - ".launch/pupsonstuff-printify-commissioning"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Read-only Printify account + 11oz mug probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pupsonstuff-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Probe authenticated Printify account
        working-directory: apps/pupsonstuff
        env:
          PRINTIFY_API_KEY: ${{ secrets.PRINTIFY_API_KEY }}
        run: node --import tsx scripts/printify-commissioning-probe.ts

      - name: Publish shop IDs and mug variants
        if: always()
        run: |
          report="apps/pupsonstuff/docs/fulfillment/printify-commissioning-probe.json"
          echo "## Printify commissioning probe" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$report" ]; then
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            jq '{generatedAt,shops,mugBlueprint:{blueprintId,title,providers:[.mugBlueprint.providers[]|{printProviderId,printProviderTitle,error,variantCount:(.variants|length),variants:.variants}]}}' "$report" >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No commissioning report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload commissioning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pupsonstuff-printify-commissioning-probe
          retention-days: 14
          if-no-files-found: error
          path: apps/pupsonstuff/docs/fulfillment/printify-commissioning-probe.json
