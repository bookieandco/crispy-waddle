name: SPORT-SIM.2F Certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/money-core/src/sports-simulation-**'
      - 'packages/money-core/src/sports-correlated-monte-carlo.ts'
      - 'packages/money-core/src/sports-live-resimulation.ts'
      - 'packages/money-core/src/sports-sim-bet-alpha.ts'
      - 'packages/money-core/src/sports-vision-evidence.ts'
      - 'packages/money-core/src/sport-sim-2f-certification.ts'
      - 'packages/money-core/src/sport-sim-2f-certification.test.ts'
      - 'packages/money-core/src/index.ts'
      - 'packages/money-core/package.json'
      - '.github/workflows/sport-sim-2f-certification.yml'
      - 'services/roboflow-sports-workflow-observer/**'
  push:
    branches:
      - main
    paths:
      - 'packages/money-core/src/sports-simulation-**'
      - 'packages/money-core/src/sports-correlated-monte-carlo.ts'
      - 'packages/money-core/src/sports-live-resimulation.ts'
      - 'packages/money-core/src/sports-sim-bet-alpha.ts'
      - 'packages/money-core/src/sports-vision-evidence.ts'
      - 'packages/money-core/src/sport-sim-2f-certification.ts'
      - 'packages/money-core/src/sport-sim-2f-certification.test.ts'
      - 'packages/money-core/src/index.ts'
      - 'packages/money-core/package.json'
      - '.github/workflows/sport-sim-2f-certification.yml'
      - 'services/roboflow-sports-workflow-observer/**'

concurrency:
  group: sport-sim-2f-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certify:
    name: Type-check, SPORT-SIM.2F, Money regression, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: SPORT-SIM.2F
        run: pnpm --filter @jhadina/money-core verify:sport-sim-2f
