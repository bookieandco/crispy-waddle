name: SHARK Live Public Worker One-Shot

# Explicit owner dispatch only. NEVER scheduled. No real money, wallet, AI,
# Telegram bot, durable backend, or protected account connections.
on:
  workflow_dispatch:
    inputs:
      public_only_consent:
        description: 'Enter PUBLIC-SHARK-ONCE-NO-TRADES; no private keys or Telegram information'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: shark-live-manual-public-worker
  cancel-in-progress: false

jobs:
  manual-ephemeral-public-acceptance:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHARK_PUBLIC_HOST_COMMISSIONED: 'false'
      ENABLE_SHARK_PUBLIC_ALERTS: 'false'
      SHARK_ONE_SHOT_CONFIRM: ${{ inputs.public_only_consent }}
    steps:
      - name: Require explicit public-only consent
        shell: bash
        run: |
          if [ "$SHARK_ONE_SHOT_CONFIRM" != "PUBLIC-SHARK-ONCE-NO-TRADES" ]; then
            echo "::error::SHARK_PUBLIC_ONE_SHOT_CONSENT_MISSING"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hermetic receipt/privacy contracts (NO NETWORK)
        run: python -m unittest discover -s ops/meme -p 'test_shark_ephemeral_once.py' -v
      - name: One capped public-feed-to-market research cycle
        shell: bash
        run: |
          # A first-time transient SQLite study; never a persistent host or
          # scored trade. The child receives no Telegram/bot/wallet secrets.
          timeout 145 python3 ops/meme/shark_ephemeral_once.py --confirm "$SHARK_ONE_SHOT_CONFIRM"
