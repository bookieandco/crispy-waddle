name: Energy Opportunity Core CI

on:
  pull_request:
    paths:
      - 'packages/energy-opportunity-core/**'
      - 'packages/*/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/energy-opportunity-core-ci.yml'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: energy-opportunity-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Energy Opportunity Core
        run: pnpm --filter energy-opportunity-core test

      - name: Typecheck Energy Opportunity Core
        run: pnpm --filter energy-opportunity-core typecheck
