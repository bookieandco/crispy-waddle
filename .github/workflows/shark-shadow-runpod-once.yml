name: SHARK Shadow RunPod One Shot
# retry after runpodctl flag compatibility repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/shark-shadow-runpod-once.yml

permissions:
  contents: read

jobs:
  commission:
    uses: ./.github/workflows/shark-shadow-runpod-commission.yml
    with:
      shadow_host_action: create_dedicated_cpu_pod
    secrets: inherit
