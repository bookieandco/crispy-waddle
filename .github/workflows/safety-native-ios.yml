name: Safety Native iOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/jhadina-ios/**'
      - '.github/workflows/safety-native-ios.yml'
  push:
    branches: [main]
    paths:
      - 'apps/jhadina-ios/**'
      - '.github/workflows/safety-native-ios.yml'

jobs:
  build:
    name: Generate and build iOS shell
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/jhadina-ios
        run: xcodegen generate
      - name: Build simulator target without assuming an installed phone
        working-directory: apps/jhadina-ios
        run: |
          xcodebuild \
            -project JhadinaSafety.xcodeproj \
            -scheme JhadinaSafety \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Select an available iOS simulator (required for tests)
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess, sys
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          devices = [(runtime, device) for runtime, entries in data.get("devices", {}).items()
                     if "iOS" in runtime for device in entries if device.get("isAvailable")
                     and device.get("udid")]
          if not devices:
              print("::error::No installed iOS simulator device/runtime. Native unit tests are REQUIRED; provision a compatible simulator on the CI runner.")
              sys.exit(1)
          runtime, selected = devices[0]
          print("destination=platform=iOS Simulator,id=" + selected["udid"])
          PY
      - name: Run unit tests
        working-directory: apps/jhadina-ios
        run: |
          xcodebuild \
            -project JhadinaSafety.xcodeproj \
            -scheme JhadinaSafety \
            -sdk iphonesimulator \
            -destination "${{ steps.simulator.outputs.destination }}" \
            CODE_SIGNING_ALLOWED=NO \
            test
