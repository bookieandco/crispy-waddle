name: JLLM Fabric Reconciliation
on:
  pull_request:
    paths:
      - 'packages/jhadina-intelligence-core/**'
      - '.github/workflows/jllm-fabric-reconciliation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intelligence-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jhadina/intelligence-core type-check
      - run: pnpm --filter @jhadina/intelligence-core test
