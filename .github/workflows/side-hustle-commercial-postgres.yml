name: Side Hustle Commercial Postgres

on:
  pull_request:
    paths:
      - 'supabase/migrations/*side_hustle*.sql'
      - 'packages/opportunity-core/src/domain/side-hustle-commercial*'
      - 'packages/opportunity-core/src/domain/side-hustle-commerce*'
      - 'packages/opportunity-core/src/domain/side-hustle-owned-media*'
      - 'packages/opportunity-core/src/domain/side-hustle-physical-assets*'
      - 'packages/opportunity-core/src/domain/side-hustle-specialized*'
      - 'packages/opportunity-core/src/domain/side-hustle-drop-servicing*'
      - 'packages/opportunity-core/src/domain/side-hustle-commissioning*'
      - 'apps/jhadina-web/src/lib/opportunities/side-hustle-commercial-runtime*'
      - 'apps/jhadina-web/src/lib/opportunities/side-hustle-commerce-runtime*'
      - 'apps/jhadina-web/src/lib/opportunities/side-hustle-drop-servicing-runtime*'
      - 'apps/jhadina-web/src/lib/opportunities/side-hustle-commissioning-runtime*'
      - 'apps/jhadina-web/src/lib/opportunities/side-hustle-commissioning-repository.ts'
      - 'apps/jhadina-web/src/lib/opportunities/affiliate-payout-*'
      - 'packages/commerce-adapters/src/affiliate-payout*'
      - 'packages/commerce-adapters/src/affiliate-partnerize-payout*'
      - '.github/workflows/side-hustle-commercial-postgres.yml'
  push:
    paths:
      - 'supabase/migrations/*side_hustle*.sql'
      - 'packages/opportunity-core/src/domain/side-hustle-commercial*'
      - 'apps/jhadina-web/src/lib/opportunities/side-hustle-commercial-runtime*'
      - '.github/workflows/side-hustle-commercial-postgres.yml'
  workflow_dispatch:

jobs:
  commercial-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jhadina
          POSTGRES_PASSWORD: jhadina
          POSTGRES_DB: jhadina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jhadina -d jhadina_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://jhadina:jhadina@localhost:5432/jhadina_test
      TEST_USER_ID: 11111111-1111-4111-8111-111111111111

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap Supabase-compatible prerequisites
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=jhadina psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;

          create schema auth;
          create table auth.users (
            id uuid primary key
          );

          create or replace function auth.uid()
          returns uuid
          language sql
          stable
          as $$
            select nullif(current_setting('app.user_id', true), '')::uuid
          $$;

          create table public.jhadina_opportunities (
            user_id uuid not null references auth.users(id) on delete cascade,
            id text not null,
            family text not null,
            opportunity_type text not null,
            status text not null,
            payload jsonb not null,
            primary key (user_id, id)
          );

          create table public.jhadina_venture_records (
            owner_user_id uuid not null references auth.users(id) on delete cascade,
            id text not null,
            opportunity_id text not null,
            family text not null,
            primary key (owner_user_id, id),
            foreign key (owner_user_id, opportunity_id)
              references public.jhadina_opportunities(user_id, id) on delete cascade
          );

          create table public.jhadina_opportunity_outcomes (
            user_id uuid not null references auth.users(id) on delete cascade,
            id text not null,
            opportunity_id text not null,
            payload jsonb not null,
            primary key (user_id, id),
            foreign key (user_id, opportunity_id)
              references public.jhadina_opportunities(user_id, id) on delete cascade
          );
          SQL

      - name: Apply Side Hustle commercial migration
        run: |
          set -euo pipefail
          PGPASSWORD=jhadina psql "$DATABASE_URL" -v ON_ERROR_STOP=1             -f supabase/migrations/20261002190000_side_hustle_commercial_runtime.sql

      - name: Apply Side Hustle commerce migration
        run: |
          set -euo pipefail
          PGPASSWORD=jhadina psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261003143000_side_hustle_commerce_runtime.sql

      - name: Apply specialized Side Hustle migration
        run: |
          set -euo pipefail
          PGPASSWORD=jhadina psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261003150000_side_hustle_specialized_runtime.sql

      - name: Apply Drop Servicing migration
        run: |
          set -euo pipefail
          PGPASSWORD=jhadina psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261003173000_side_hustle_drop_servicing_runtime.sql

      - name: Apply commissioning evidence migration
        run: |
          set -euo pipefail
          PGPASSWORD=jhadina psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261003181500_side_hustle_commissioning_evidence.sql

      - name: Apply affiliate payout truth migration
        run: |
          set -euo pipefail
          PGPASSWORD=jhadina psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261003203000_side_hustle_affiliate_payout_snapshots.sql

      - name: Apply affiliate compliance migration
        run: |
          set -euo pipefail
          PGPASSWORD=jhadina psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261003214500_side_hustle_affiliate_compliance_snapshots.sql

      - name: Smoke atomic commercial transition
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=jhadina psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users(id)
          values ('11111111-1111-4111-8111-111111111111');

          insert into public.jhadina_opportunities(
            user_id,id,family,opportunity_type,status,payload
          ) values (
            '11111111-1111-4111-8111-111111111111',
            'opportunity:sql-smoke',
            'business',
            'commercial',
            'ready',
            jsonb_build_object(
              'id','opportunity:sql-smoke',
              'metadata',jsonb_build_object(
                'sideHustleProfile',jsonb_build_object(
                  'family','content_social',
                  'role','standalone',
                  'executionOwners',jsonb_build_array('growth','media')
                )
              )
            )
          );

          set app.user_id = '11111111-1111-4111-8111-111111111111';

          select public.jhadina_side_hustle_work_order_save(
            jsonb_build_object(
              'id','work-order:sql-smoke',
              'opportunityId','opportunity:sql-smoke',
              'family','content_social',
              'customerRef','relationship:customer:sql-smoke',
              'title','SQL smoke work order',
              'outcomePromise','Deliver a tested commercial artifact.',
              'scopeItems',jsonb_build_array(jsonb_build_object(
                'id','scope:1',
                'title','Artifact',
                'description','Deliver the artifact.',
                'evidenceRefs',jsonb_build_array('evidence:scope')
              )),
              'acceptanceCriteria',jsonb_build_array(jsonb_build_object(
                'id','criterion:1',
                'description','Artifact accepted.',
                'required',true
              )),
              'price',jsonb_build_object(
                'amount',100,
                'currency','USD',
                'cadence','project'
              ),
              'executionOwners',jsonb_build_array('growth','media'),
              'evidenceRefs',jsonb_build_array('evidence:work-order'),
              'status','draft',
              'createdAt','2026-10-02T20:00:00.000Z',
              'updatedAt','2026-10-02T20:00:00.000Z',
              'authority','COMMERCIAL_SCOPE_ONLY',
              'externalActionAuthorized',false,
              'paymentAuthorized',false,
              'signatureAuthorized',false
            )
          );

          select public.jhadina_side_hustle_work_order_save(
            (
              select payload
              from public.jhadina_side_hustle_work_orders
              where user_id = auth.uid() and id = 'work-order:sql-smoke'
            ) || jsonb_build_object(
              'status','scope_locked',
              'scopeLockedAt','2026-10-02T20:05:00.000Z',
              'updatedAt','2026-10-02T20:05:00.000Z',
              'evidenceRefs',jsonb_build_array('evidence:work-order','evidence:scope-lock')
            )
          );

          select public.jhadina_side_hustle_commercial_transition(
            (
              select payload
              from public.jhadina_side_hustle_work_orders
              where user_id = auth.uid() and id = 'work-order:sql-smoke'
            ) || jsonb_build_object(
              'status','delivery_in_progress',
              'startedAt','2026-10-02T20:10:00.000Z',
              'updatedAt','2026-10-02T20:10:00.000Z'
            ),
            jsonb_build_object(
              'id','receipt:start:sql-smoke',
              'workOrderId','work-order:sql-smoke',
              'opportunityId','opportunity:sql-smoke',
              'family','content_social',
              'kind','delivery_start',
              'evidenceRefs',jsonb_build_array('evidence:delivery-start'),
              'payload',jsonb_build_object(
                'id','receipt:start:sql-smoke',
                'workOrderId','work-order:sql-smoke',
                'opportunityId','opportunity:sql-smoke',
                'executionOwner','growth',
                'executionRef','execution:growth:sql-smoke',
                'evidenceRefs',jsonb_build_array('evidence:delivery-start'),
                'startedAt','2026-10-02T20:10:00.000Z',
                'authority','OBSERVATION_ONLY',
                'externalActionAuthorized',false
              ),
              'recordedAt','2026-10-02T20:10:00.000Z'
            )
          );

          do $$
          declare
            v_status text;
            v_receipts integer;
          begin
            select status into v_status
            from public.jhadina_side_hustle_work_orders
            where user_id = auth.uid() and id = 'work-order:sql-smoke';

            select count(*) into v_receipts
            from public.jhadina_side_hustle_commercial_receipts
            where user_id = auth.uid()
              and work_order_id = 'work-order:sql-smoke'
              and kind = 'delivery_start';

            if v_status <> 'delivery_in_progress' then
              raise exception 'atomic transition did not advance work order';
            end if;
            if v_receipts <> 1 then
              raise exception 'atomic transition did not persist exactly one receipt';
            end if;
          end $$;
          SQL


      - name: Smoke commissioning evidence
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=jhadina psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          set app.user_id = '11111111-1111-4111-8111-111111111111';

          select public.jhadina_side_hustle_commissioning_evidence_record(
            jsonb_build_object(
              'id','commissioning:sql:provider',
              'family','pod_personalized_commerce',
              'gateType','provider',
              'status','passed',
              'providerRef','printify',
              'evidenceRefs',jsonb_build_array('evidence:provider'),
              'observedAt','2026-10-03T18:30:00Z',
              'expiresAt','2026-11-03T18:30:00Z',
              'authority','COMMISSIONING_EVIDENCE_ONLY',
              'externalActionAuthorized',false,
              'moneyMovementAuthorized',false
            )
          );

          select public.jhadina_side_hustle_commissioning_evidence_record(
            (
              select payload
              from public.jhadina_side_hustle_commissioning_evidence
              where user_id=auth.uid() and id='commissioning:sql:provider'
            )
          );

          do $$
          declare
            v_count integer;
          begin
            select count(*) into v_count
            from public.jhadina_side_hustle_commissioning_evidence
            where user_id=auth.uid()
              and family='pod_personalized_commerce'
              and gate_type='provider'
              and status='passed';

            if v_count<>1 then
              raise exception 'commissioning evidence idempotency failed';
            end if;
          end $$;
          SQL

      - name: Smoke affiliate payout snapshots
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=jhadina psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          set app.user_id = '11111111-1111-4111-8111-111111111111';

          insert into public.jhadina_opportunities(
            user_id,id,family,opportunity_type,status,payload
          ) values (
            '11111111-1111-4111-8111-111111111111',
            'opportunity:affiliate-payout-sql',
            'business',
            'commercial',
            'ready',
            jsonb_build_object(
              'id','opportunity:affiliate-payout-sql',
              'metadata',jsonb_build_object(
                'sideHustleProfile',jsonb_build_object(
                  'family','commerce_affiliate',
                  'role','standalone'
                )
              )
            )
          )
          on conflict (user_id,id) do nothing;

          select public.jhadina_affiliate_payout_snapshot_record(
            jsonb_build_object(
              'id','affiliate-payout:partnerize:sql-baseline',
              'opportunityId','opportunity:affiliate-payout-sql',
              'provider','partnerize',
              'accountRef','publisher-sql',
              'snapshot',jsonb_build_object(
                'provider','partnerize',
                'accountRef','publisher-sql',
                'balances',jsonb_build_array(
                  jsonb_build_object(
                    'currency','USD',
                    'pending',10,
                    'approved',25,
                    'confirmed',20,
                    'available',5,
                    'paid',100
                  )
                ),
                'observedAt','2026-10-03T20:30:00Z',
                'evidenceRefs',jsonb_build_array('partnerize:publisher:publisher-sql:payment-summary'),
                'sourceSemantics','CUMULATIVE_PROVIDER_BALANCES',
                'readOnly',true,
                'externalActionAuthorized',false,
                'paymentAuthorized',false,
                'moneyMovementAuthorized',false
              ),
              'paidHighWater',jsonb_build_object('USD',100),
              'recognizedPayoutSinceBaseline',jsonb_build_object('USD',0),
              'observedAt','2026-10-03T20:30:00Z',
              'authority','AFFILIATE_PAYOUT_SNAPSHOT_ONLY',
              'externalActionAuthorized',false,
              'paymentAuthorized',false,
              'moneyMovementAuthorized',false
            )
          );

          select public.jhadina_affiliate_payout_snapshot_record(
            (
              select payload
              from public.jhadina_affiliate_payout_snapshots
              where user_id=auth.uid()
                and id='affiliate-payout:partnerize:sql-baseline'
            )
          );

          do $$
          declare
            v_count integer;
            v_rejected boolean:=false;
          begin
            select count(*) into v_count
            from public.jhadina_affiliate_payout_snapshots
            where user_id=auth.uid()
              and opportunity_id='opportunity:affiliate-payout-sql'
              and provider='partnerize';

            if v_count<>1 then
              raise exception 'affiliate payout snapshot idempotency failed';
            end if;

            begin
              perform public.jhadina_affiliate_payout_snapshot_record(
                jsonb_build_object(
                  'id','affiliate-payout:partnerize:bad-authority',
                  'opportunityId','opportunity:affiliate-payout-sql',
                  'provider','partnerize',
                  'accountRef','publisher-sql',
                  'snapshot',jsonb_build_object(
                    'provider','partnerize',
                    'accountRef','publisher-sql',
                    'balances',jsonb_build_array(
                      jsonb_build_object(
                        'currency','USD',
                        'pending',0,
                        'approved',0,
                        'confirmed',0,
                        'available',0,
                        'paid',100
                      )
                    ),
                    'observedAt','2026-10-03T20:31:00Z',
                    'evidenceRefs',jsonb_build_array('evidence:bad'),
                    'sourceSemantics','CUMULATIVE_PROVIDER_BALANCES',
                    'readOnly',true,
                    'externalActionAuthorized',false,
                    'paymentAuthorized',false,
                    'moneyMovementAuthorized',false
                  ),
                  'paidHighWater',jsonb_build_object('USD',100),
                  'recognizedPayoutSinceBaseline',jsonb_build_object('USD',0),
                  'observedAt','2026-10-03T20:31:00Z',
                  'authority','AFFILIATE_PAYOUT_SNAPSHOT_ONLY',
                  'externalActionAuthorized',false,
                  'paymentAuthorized',true,
                  'moneyMovementAuthorized',false
                )
              );
            exception when others then
              if position('cannot grant execution or money authority' in sqlerrm)>0 then
                v_rejected:=true;
              else
                raise;
              end if;
            end;

            if not v_rejected then
              raise exception 'affiliate payout authority guard did not reject mutation';
            end if;
          end $$;
          SQL


      - name: Smoke affiliate compliance snapshots
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=jhadina psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          set app.user_id = '11111111-1111-4111-8111-111111111111';

          insert into public.jhadina_opportunities(
            user_id,id,family,opportunity_type,status,payload
          ) values (
            '11111111-1111-4111-8111-111111111111',
            'opportunity:affiliate-compliance-sql',
            'business',
            'commercial',
            'ready',
            jsonb_build_object(
              'id','opportunity:affiliate-compliance-sql',
              'metadata',jsonb_build_object(
                'sideHustleProfile',jsonb_build_object(
                  'family','commerce_affiliate',
                  'role','standalone'
                )
              )
            )
          )
          on conflict (user_id,id) do nothing;

          select public.jhadina_affiliate_compliance_snapshot_record(
            jsonb_build_object(
              'id','affiliate-compliance:sql-pass',
              'opportunityId','opportunity:affiliate-compliance-sql',
              'family','commerce_affiliate',
              'status','passed',
              'activeProviderRefs',jsonb_build_array('provider:partnerize'),
              'activeProgramRefs',jsonb_build_array('partnerize:campaign:sql'),
              'usedChannels',jsonb_build_array('youtube'),
              'termsSnapshots',jsonb_build_array(
                jsonb_build_object(
                  'id','terms:network:sql',
                  'scope','network',
                  'providerRef','provider:partnerize',
                  'sourceUrl','https://provider.example/terms',
                  'verifiedAt','2026-10-03T21:00:00Z',
                  'evidenceRefs',jsonb_build_array('evidence:terms:network'),
                  'authority','AFFILIATE_TERMS_OBSERVATION_ONLY',
                  'externalActionAuthorized',false,
                  'publishingAuthorized',false,
                  'paymentAuthorized',false,
                  'moneyMovementAuthorized',false
                ),
                jsonb_build_object(
                  'id','terms:program:sql',
                  'scope','program',
                  'providerRef','provider:partnerize',
                  'programRef','partnerize:campaign:sql',
                  'sourceUrl','https://merchant.example/affiliate-terms',
                  'verifiedAt','2026-10-03T21:01:00Z',
                  'evidenceRefs',jsonb_build_array('evidence:terms:program'),
                  'authority','AFFILIATE_TERMS_OBSERVATION_ONLY',
                  'externalActionAuthorized',false,
                  'publishingAuthorized',false,
                  'paymentAuthorized',false,
                  'moneyMovementAuthorized',false
                )
              ),
              'disclosureObservations',jsonb_build_array(
                jsonb_build_object(
                  'id','disclosure:sql',
                  'channel','youtube',
                  'assetRef','content:sql',
                  'clearCommercialRelationship',true,
                  'prominent',true,
                  'beforeOrAdjacentToAffiliateLink',true,
                  'evidenceRefs',jsonb_build_array('evidence:disclosure'),
                  'observedAt','2026-10-03T21:02:00Z',
                  'authority','AFFILIATE_DISCLOSURE_OBSERVATION_ONLY',
                  'externalActionAuthorized',false,
                  'publishingAuthorized',false
                )
              ),
              'contentReviews',jsonb_build_array(
                jsonb_build_object(
                  'id','review:sql',
                  'channel','youtube',
                  'assetRef','content:sql',
                  'reviewerType','human',
                  'reviewerRef','reviewer:sql',
                  'checks',jsonb_build_object(
                    'channelAllowed','passed',
                    'claimsSubstantiated','passed',
                    'firstHandClaimsTruthful','not_applicable',
                    'syntheticMediaDisclosure','not_applicable',
                    'brandBidding','not_applicable',
                    'geoRestrictions','passed',
                    'emailRules','not_applicable'
                  ),
                  'evidenceRefs',jsonb_build_array('evidence:review'),
                  'reviewedAt','2026-10-03T21:03:00Z',
                  'authority','AFFILIATE_CONTENT_COMPLIANCE_REVIEW_ONLY',
                  'externalActionAuthorized',false,
                  'publishingAuthorized',false
                )
              ),
              'blockers',jsonb_build_array(),
              'evidenceRefs',jsonb_build_array(
                'evidence:terms:network',
                'evidence:terms:program',
                'evidence:disclosure',
                'evidence:review'
              ),
              'evaluatedAt','2026-10-03T21:05:00Z',
              'expiresAt','2026-11-02T21:05:00Z',
              'authority','AFFILIATE_COMPLIANCE_SNAPSHOT_ONLY',
              'externalActionAuthorized',false,
              'publishingAuthorized',false,
              'paymentAuthorized',false,
              'moneyMovementAuthorized',false
            )
          );

          select public.jhadina_affiliate_compliance_snapshot_record(
            (
              select payload
              from public.jhadina_affiliate_compliance_snapshots
              where user_id=auth.uid()
                and id='affiliate-compliance:sql-pass'
            )
          );

          do $$
          declare
            v_count integer;
            v_rejected boolean:=false;
          begin
            select count(*) into v_count
            from public.jhadina_affiliate_compliance_snapshots
            where user_id=auth.uid()
              and opportunity_id='opportunity:affiliate-compliance-sql'
              and status='passed';

            if v_count<>1 then
              raise exception 'affiliate compliance snapshot idempotency failed';
            end if;

            begin
              perform public.jhadina_affiliate_compliance_snapshot_record(
                (
                  select payload
                  from public.jhadina_affiliate_compliance_snapshots
                  where user_id=auth.uid()
                    and id='affiliate-compliance:sql-pass'
                )
                || jsonb_build_object(
                  'id','affiliate-compliance:sql-bad-authority',
                  'publishingAuthorized',true
                )
              );
            exception when others then
              if position('cannot grant execution or money authority' in sqlerrm)>0 then
                v_rejected:=true;
              else
                raise;
              end if;
            end;

            if not v_rejected then
              raise exception 'affiliate compliance authority guard did not reject mutation';
            end if;
          end $$;
          SQL
