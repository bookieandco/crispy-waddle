name: Social Core Certification

on:
  pull_request:
    paths:
      - 'packages/social-core/**'
      - 'packages/growth-core/**'
      - 'apps/jhadina-web/src/lib/social/**'
      - 'apps/jhadina-web/src/lib/growth/**'
      - 'apps/jhadina-web/src/lib/intelligence/ask-social-command*'
      - 'apps/jhadina-web/src/lib/intelligence/ask-growth-command*'
      - 'apps/jhadina-web/src/lib/context/production-social-context-provider*'
      - 'apps/jhadina-web/src/lib/context/production-growth-context-provider*'
      - 'apps/jhadina-web/src/lib/context/growth-context.integration.test.ts'
      - 'apps/jhadina-web/src/lib/context/social-context.integration.test.ts'
      - 'apps/jhadina-web/src/lib/context/context-builder.ts'
      - 'apps/jhadina-web/src/app/api/jhadina/command/**'
      - 'apps/jhadina-web/src/app/ask-jhadina/**'
      - 'packages/jhadina-core-spine/src/types.ts'
      - 'apps/jhadina-web/src/app/api/social/**'
      - 'apps/jhadina-web/src/app/api/growth/**'
      - 'apps/jhadina-web/src/app/social/**'
      - 'apps/jhadina-web/src/app/growth/**'
      - 'apps/jhadina-web/components/home/**'
      - 'supabase/migrations/*social*'
      - 'apps/jhadina-web/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/social-core-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    name: SOCIAL.10 source certification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile

      - name: Type-check Social Core
        run: pnpm --filter @jhadina/social-core type-check

      - name: Test Social Core
        run: pnpm --filter @jhadina/social-core test

      - name: Type-check Growth Core convergence
        run: pnpm --filter @jhadina/growth-core type-check

      - name: Test Growth Core convergence
        run: pnpm --filter @jhadina/growth-core test

      - name: Type-check Social and Growth web integration
        run: pnpm --filter @jhadina/jhadina-web exec tsc -p tsconfig.social.json --noEmit

      - name: Run Social web integration tests
        run: |
          pnpm --filter @jhadina/jhadina-web exec vitest run \
            src/lib/social \
            src/lib/intelligence/ask-social-command.test.ts \
            src/lib/intelligence/ask-growth-command.test.ts \
            src/lib/context/production-social-context-provider.test.ts \
            src/lib/context/production-growth-context-provider.test.ts \
            src/lib/context/growth-context.integration.test.ts \
            src/lib/context/social-context.integration.test.ts \
            src/app/api/jhadina/command/route.social.test.ts \
            src/app/api/jhadina/command/route.growth.test.ts


  ayrshare-binding-vault:
    name: Ayrshare binding vault
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jhadina
          POSTGRES_PASSWORD: jhadina
          POSTGRES_DB: jhadina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jhadina -d jhadina_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://jhadina:jhadina@localhost:5432/jhadina_test
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap Supabase roles
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=jhadina psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create schema auth;
          create table auth.users(id uuid primary key);
          insert into auth.users(id) values ('11111111-1111-4111-8111-111111111111');
          SQL

      - name: Apply Ayrshare binding migration
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=jhadina psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261004001500_social_ayrshare_binding_vault.sql

      - name: Prove encrypted binding is service-role only
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=jhadina psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.jhadina_social_ayrshare_bindings(
            user_id,provider_profile_id,encrypted_profile_key,platform,
            display_name,handle,evidence_refs,observed_at
          ) values (
            '11111111-1111-4111-8111-111111111111',
            'linkedin-main','ciphertext-not-plaintext','linkedin',
            'Main LinkedIn','@main','["evidence:owner"]'::jsonb,
            '2026-10-04T00:30:00Z'
          );

          set role service_role;
          select count(*) from public.jhadina_social_ayrshare_bindings
          where user_id='11111111-1111-4111-8111-111111111111';
          reset role;

          do $$
          begin
            if has_table_privilege('anon','public.jhadina_social_ayrshare_bindings','select')
              or has_table_privilege('authenticated','public.jhadina_social_ayrshare_bindings','select')
            then
              raise exception 'browser roles must not read Ayrshare profile credentials';
            end if;
          end $$;
          SQL
