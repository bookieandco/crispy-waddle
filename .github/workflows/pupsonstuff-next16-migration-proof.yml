name: PupsonStuff Next16 adapter migration proof

on:
  pull_request:
    paths:
      - '.github/workflows/pupsonstuff-next16-migration-proof.yml'
      - 'apps/pupsonstuff/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  migrate-no-release:
    permissions:
      contents: write
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/pupson-3d-autoframe-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Establish original frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Produce Next16 security-supported upgrade candidate (no repository writes)
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const filename='package.json';
          const json=JSON.parse(readFileSync(filename,'utf8'));
          const extensions=json.pnpm.packageExtensions;
          extensions['next@16.3.8']={dependencies:{
            '@types/react':'19.2.18',
            '@types/react-dom':'19.2.4',
          }};
          writeFileSync(filename,JSON.stringify(json,null,2)+'\n');
          const path='apps/pupsonstuff/package.json';
          const app=JSON.parse(readFileSync(path,'utf8'));
          app.scripts.build='next build --webpack';
          // Next 16 removes the obsolete `next lint` CLI. Keep linting as
          // a separate future ESLint config migration, not a false success.
          delete app.scripts.lint;
          writeFileSync(path,JSON.stringify(app,null,2)+'\n');
          const tsPath='apps/pupsonstuff/tsconfig.json';
          const ts=JSON.parse(readFileSync(tsPath,'utf8'));
          delete ts.compilerOptions.jsxFactory;
          delete ts.compilerOptions.jsxFragmentFactory;
          writeFileSync(tsPath,JSON.stringify(ts,null,2)+'\n');
          NODE
          pnpm --filter @jhadina/pupsonstuff add next@16.3.8 --save-exact --ignore-scripts
          pnpm install --frozen-lockfile
          node --input-type=module - <<'NODE'
          import{readFileSync}from'node:fs';
          const p=JSON.parse(readFileSync('apps/pupsonstuff/package.json','utf8'));
          if(p.dependencies.next!=='16.3.8') throw Error('Next 16 exact pin did not apply.');
          console.log('Candidate Next pinned to:',p.dependencies.next);
          NODE
      - name: Preserve reversible Next16 manifest and generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pupson-next16-candidate-lockfile
          path: |
            package.json
            apps/pupsonstuff/package.json
            pnpm-lock.yaml
          retention-days: 3
      - name: Next16 candidate compile/type and test proof (offline)
        run: |
          set -euo pipefail
          pnpm --filter @jhadina/pupsonstuff type-check
          pnpm --filter @jhadina/pupsonstuff test
          PUPSON_CLOUDFLARE_PREVIEW_ONLY=true PUPSON_FULFILLMENT_MODE=dry_run pnpm --filter @jhadina/pupsonstuff build
      - name: Preserve canonical candidate before ephemeral adapter install
        run: |
          mkdir -p "$RUNNER_TEMP/pupson-next16"
          cp package.json "$RUNNER_TEMP/pupson-next16/root-package.json"
          cp apps/pupsonstuff/package.json "$RUNNER_TEMP/pupson-next16/app-package.json"
          cp pnpm-lock.yaml "$RUNNER_TEMP/pupson-next16/pnpm-lock.yaml"
          cp apps/pupsonstuff/tsconfig.json "$RUNNER_TEMP/pupson-next16/tsconfig.json"
      - name: Run Cloudflare adapter against supported candidate only
        env:
          PUPSON_CLOUDFLARE_PREVIEW_ONLY: 'true'
          PUPSON_FULFILLMENT_MODE: dry_run
          PUPSON_LIVE_COMMERCE_APPROVED: 'false'
          PUPSON_PAYMENT_OPERATIONS_READY: 'false'
          CF_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          pnpm --filter @jhadina/pupsonstuff add --save-dev --ignore-scripts @opennextjs/cloudflare@1.20.11 wrangler@4.151.0
          cat > apps/pupsonstuff/open-next.config.ts <<'CONFIG'
          import { defineCloudflareConfig } from '@opennextjs/cloudflare';
          export default defineCloudflareConfig();
          CONFIG
          node apps/pupsonstuff/scripts/generate-cloudflare-preview.mjs
          cd apps/pupsonstuff
          pnpm exec opennextjs-cloudflare build
          pnpm exec wrangler deploy --config wrangler.jsonc --dry-run --outdir .cf-dryrun
          echo 'No Worker deployed or uploaded; only an offline dry run was performed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit validated exact Next16 files without checkout credentials
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const owner = context.repo.owner, repo = context.repo.repo;
            const branch = 'feat/pupson-3d-autoframe-20261021';
            const expected = context.payload.pull_request.head.sha;
            if (context.payload.pull_request.head.ref !== branch ||
                context.payload.pull_request.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo) {
              throw new Error('Wrong source branch: refusing write.');
            }
            const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/' + branch });
            if (ref.data.object.sha !== expected) {
              throw new Error('Branch moved since candidate was validated: refusing stale write.');
            }
            const existing = await github.rest.repos.getContent({
              owner, repo, path: 'apps/pupsonstuff/package.json', ref: branch,
            });
            const before = JSON.parse(Buffer.from(existing.data.content, 'base64').toString('utf8'));
            if (before.dependencies.next === '16.3.8') {
              core.info('Canonical supported Next16 pin already exists; no write necessary.');
              return;
            }
            if (before.dependencies.next !== '15.5.28') {
              throw new Error('Unexpected Next dependency; refusing implicit upgrade.');
            }
            const checkout = await github.rest.git.getCommit({ owner, repo, commit_sha: expected });
            const base = process.env.RUNNER_TEMP + '/pupson-next16';
            const files = [
              ['package.json','root-package.json'],
              ['apps/pupsonstuff/package.json','app-package.json'],
              ['apps/pupsonstuff/tsconfig.json','tsconfig.json'],
              ['pnpm-lock.yaml','pnpm-lock.yaml'],
            ];
            const tree = await github.rest.git.createTree({
              owner, repo, base_tree: checkout.data.tree.sha,
              tree: files.map(([gitPath, file]) => ({
                path: gitPath, mode: '100644', type: 'blob',
                content: fs.readFileSync(path.join(base, file), 'utf8'),
              })),
            });
            const commit = await github.rest.git.createCommit({
              owner, repo, message: 'build(pupson): adopt CI-verified Next 16.3.8 and frozen workspace lockfile',
              tree: tree.data.sha, parents: [expected],
            });
            await github.rest.git.updateRef({
              owner, repo, ref: 'heads/' + branch, sha: commit.data.sha, force: false,
            });
            core.info('Committed verified migration: ' + commit.data.sha);
            core.info('No release, deployment, API charge or secret mutation occurred.');
