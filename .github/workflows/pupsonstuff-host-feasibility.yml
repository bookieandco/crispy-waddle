name: PupsonStuff Free Commercial Host Feasibility
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/pupsonstuff-host-feasibility.yml"
      - "apps/pupsonstuff/scripts/host-feasibility*"
      - "apps/pupsonstuff/docs/launch/PUPSON-HOST-*"
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Verify hosting restrictions
        run: |
          node --test apps/pupsonstuff/scripts/host-feasibility.check.mjs
          node apps/pupsonstuff/scripts/host-feasibility.mjs
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Canonical Next.js build
        run: pnpm --filter @jhadina/pupsonstuff build
      - name: Experimental OpenNext build and local Wrangler dry-run only
        id: adapter
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @jhadina/pupsonstuff add --save-dev --ignore-scripts @opennextjs/cloudflare@1.20.11 wrangler@4.129.1
          cat > apps/pupsonstuff/open-next.config.ts <<'CONFIG'
          import { defineCloudflareConfig } from '@opennextjs/cloudflare';
          export default defineCloudflareConfig();
          CONFIG
          cat > apps/pupsonstuff/wrangler.jsonc <<'CONFIG'
          {
            "name": "pupsonstuff-feasibility-only",
            "main": ".open-next/worker.js",
            "compatibility_date": "2026-10-15",
            "compatibility_flags": ["nodejs_compat"],
            "assets": {"directory": ".open-next/assets", "binding": "ASSETS"},
            "workers_dev": false
          }
          CONFIG
          cd apps/pupsonstuff
          pnpm exec opennextjs-cloudflare build
          pnpm exec wrangler deploy --dry-run --outdir .cf-dryrun
      - name: Explain proof boundary
        if: always()
        run: |
          echo '## PupsonStuff host feasibility' >> "$GITHUB_STEP_SUMMARY"
          echo 'Experimental OpenNext build and Wrangler local dry-run results are visible above.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Cloudflare credentials, Worker upload, domain attachment, purchases, or live orders were performed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Even a successful dry-run is not an end-to-end Worker-runtime or CPU-usage certification.' >> "$GITHUB_STEP_SUMMARY"
