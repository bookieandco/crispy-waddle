name: SHARK Shadow RunPod Commission

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional Git ref to commission; blank uses the workflow branch
        required: false
        default: ""
      pod_id:
        description: Optional existing CPU Pod id; otherwise uses RUNPOD_SHADOW_POD_ID or discovery by name
        required: false
        default: ""
      create_cpu_pod:
        description: Create a new dedicated CPU Pod if none exists (billable; auto-stops after 24h)
        required: false
        type: boolean
        default: false
      start_existing_pod:
        description: Start the resolved dedicated CPU Pod if it is stopped (billable)
        required: false
        type: boolean
        default: false
      network_volume_id:
        description: Optional existing RunPod Network Volume id for /workspace
        required: false
        default: ""
  push:
    branches:
      - feat/shark-coffer-commission-2026-10-03
    paths:
      - packages/money-core/src/shark-shadow-runpod-*.ts
      - packages/money-core/src/shark-shadow-learning.ts
      - packages/money-core/migrations/032_shark_shadow_runpod_final.sql
      - scripts/shark-shadow-runpod-bootstrap.sh
      - scripts/shark-shadow-runpod-commission.py
      - .github/workflows/shark-shadow-runpod-commission.yml

permissions:
  contents: read

concurrency:
  group: shark-shadow-runpod-commission
  cancel-in-progress: false

jobs:
  commission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY || secrets.runpod_key }}
      RUNPOD_POD_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.pod_id || vars.RUNPOD_SHADOW_POD_ID }}
      RUNPOD_SHADOW_CREATE_CPU_POD: ${{ github.event_name == 'workflow_dispatch' && inputs.create_cpu_pod || false }}
      RUNPOD_SHADOW_START_EXISTING_POD: ${{ github.event_name == 'workflow_dispatch' && inputs.start_existing_pod || false }}
      RUNPOD_SHADOW_NETWORK_VOLUME_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.network_volume_id || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Require RunPod API authority
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RUNPOD_API_KEY:-}" ]]; then
            echo "RUNPOD_SHADOW_API_KEY_REQUIRED" >&2
            exit 1
          fi

      - name: Install RunPod CLI
        shell: bash
        run: bash scripts/install-runpodctl-ci.sh

      - name: Resolve or explicitly provision dedicated CPU Pod
        shell: bash
        run: |
          set -euo pipefail
          resolved="${RUNPOD_POD_ID:-}"

          if [[ -z "$resolved" ]]; then
            runpodctl pod list --all --compute-type CPU -o json > /tmp/shadow-cpu-pods.json
            jq -c '.' /tmp/shadow-cpu-pods.json >/dev/null
            resolved="$(jq -r '
              (if type=="array" then . else (.pods // .items // []) end)
              | map(select((.name // "")=="jhadina-shark-shadow"))
              | if length==1 then .[0].id else empty end
            ' /tmp/shadow-cpu-pods.json)"

            # Prefer a currently running reusable CPU Pod first. This allows a
            # manual owner-authorized start to be consumed by the following
            # push-triggered repair run without requiring the Boolean input again.
            if [[ -z "$resolved" ]]; then
              resolved="$(jq -r '
                (if type=="array" then . else (.pods // .items // []) end)
                | map(select(
                    ((.name // "") | startswith("jhadina-voice-audition-"))
                    and ((.runtimeStatus // .status // "")=="running")
                    and ((.volumeInGb // .volume_in_gb // 0) >= 20)
                  ))
                | if length>0 then .[0].id else empty end
              ' /tmp/shadow-cpu-pods.json)"
              if [[ -n "$resolved" ]]; then
                echo "RUNPOD_SHADOW_RUNNING_REUSE_CANDIDATE:$resolved"
              fi
            fi

            # If none is already running, resolve a stopped reusable CPU Pod.
            # Selection is deterministic from the CLI ordering and still does
            # not start the Pod unless the owner explicitly authorized that.
            if [[ -z "$resolved" ]]; then
              resolved="$(jq -r '
                (if type=="array" then . else (.pods // .items // []) end)
                | map(select(
                    ((.name // "") | startswith("jhadina-voice-audition-"))
                    and ((.runtimeStatus // .status // "")=="stopped")
                    and ((.volumeInGb // .volume_in_gb // 0) >= 20)
                  ))
                | if length>0 then .[0].id else empty end
              ' /tmp/shadow-cpu-pods.json)"
              if [[ -n "$resolved" ]]; then
                echo "RUNPOD_SHADOW_REUSE_CANDIDATE:$resolved"
              fi
            fi
          fi

          if [[ -z "$resolved" && "${RUNPOD_SHADOW_CREATE_CPU_POD:-false}" == "true" ]]; then
            echo "RUNPOD_SHADOW_CPU_CREATE_AUTHORIZED: creating dedicated CPU Pod with 24h auto-stop"
            cmd=(
              runpodctl pod create
              --compute-type cpu
              --image ubuntu:24.04
              --name jhadina-shark-shadow
              --volume-in-gb 20
              --volume-mount-path /workspace
              --ports 22/tcp,8094/http
              --stop-after 24h
              -o json
            )
            if [[ -n "${RUNPOD_SHADOW_NETWORK_VOLUME_ID:-}" ]]; then
              cmd+=(--network-volume-id "$RUNPOD_SHADOW_NETWORK_VOLUME_ID")
            fi
            "${cmd[@]}" > /tmp/shadow-created-pod.json
            resolved="$(jq -r '.id // .pod.id // .podId // empty' /tmp/shadow-created-pod.json)"
            [[ -n "$resolved" ]] || { echo "RUNPOD_SHADOW_CPU_CREATE_ID_MISSING" >&2; cat /tmp/shadow-created-pod.json >&2; exit 5; }
            echo "RUNPOD_SHADOW_CPU_CREATED:$resolved"
          fi

          if [[ -z "$resolved" ]]; then
            echo "OWNER_ACTION_REQUIRED:NO_DEDICATED_SHADOW_CPU_POD" >&2
            echo "Existing CPU Pod inventory (safe fields only):" >&2
            jq -r '
              (if type=="array" then . else (.pods // .items // []) end)
              | .[]?
              | {
                  id,
                  name,
                  status:(.runtimeStatus // .status // null),
                  desiredStatus,
                  computeType:(.computeType // .compute_type // null),
                  cpuCount:(.cpuCount // .vcpuCount // .vcpu_count // null),
                  memoryInGb:(.memoryInGb // .memory_in_gb // null),
                  containerDiskInGb:(.containerDiskInGb // .container_disk_in_gb // null),
                  volumeInGb:(.volumeInGb // .volume_in_gb // null),
                  volumeMountPath:(.volumeMountPath // .volume_mount_path // null),
                  ports
                }
              | @json
            ' /tmp/shadow-cpu-pods.json >&2 || true
            echo "No compute was created or started." >&2
            exit 2
          fi

          echo "RUNPOD_POD_ID=$resolved" >> "$GITHUB_ENV"
          echo "RUNPOD_SHADOW_POD_RESOLVED:$resolved"

      - name: Create transient SSH identity
        id: key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.runpod/ssh"
          KEY_NAME="jhadina-shadow-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          KEY_PATH="$HOME/.runpod/ssh/runpodctl-ssh-key"
          ssh-keygen -q -t rsa -b 2048 -m PEM -N '' -C "$KEY_NAME" -f "$KEY_PATH"
          runpodctl ssh add-key --key-file "$KEY_PATH.pub" >/dev/null
          FINGERPRINT="$(ssh-keygen -lf "$KEY_PATH.pub" -E sha256 | awk '{print $2}')"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Require dedicated existing CPU Pod to already be running
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RUNPOD_POD_ID:-}" ]]; then
            echo "OWNER_ACTION_REQUIRED: configure RUNPOD_SHADOW_POD_ID or provide an existing CPU pod_id." >&2
            exit 2
          fi
          runpodctl pod get "$RUNPOD_POD_ID" -o json > /tmp/shadow-pod.json
          runtime="$(jq -r '.runtimeStatus // "unknown"' /tmp/shadow-pod.json)"
          desired="$(jq -r '.desiredStatus // "unknown"' /tmp/shadow-pod.json)"
          gpu="$(jq -r '.gpuCount // 0' /tmp/shadow-pod.json)"
          compute="$(jq -r '.computeType // .compute_type // "unknown"' /tmp/shadow-pod.json)"
          if [[ "$runtime" != "running" ]]; then
            if [[ "${RUNPOD_SHADOW_START_EXISTING_POD:-false}" == "true" || "${RUNPOD_SHADOW_CREATE_CPU_POD:-false}" == "true" ]]; then
              echo "RUNPOD_SHADOW_CPU_START_AUTHORIZED:desired=$desired:runtime=$runtime"
              runpodctl pod start "$RUNPOD_POD_ID" >/dev/null
              for attempt in $(seq 1 60); do
                sleep 5
                runpodctl pod get "$RUNPOD_POD_ID" -o json > /tmp/shadow-pod.json
                runtime="$(jq -r '.runtimeStatus // "unknown"' /tmp/shadow-pod.json)"
                [[ "$runtime" == "running" ]] && break
              done
            fi
          fi
          if [[ "$runtime" != "running" ]]; then
            echo "OWNER_ACTION_REQUIRED:RUNPOD_SHADOW_POD_NOT_RUNNING:desired=$desired:runtime=$runtime" >&2
            echo "Re-run manually with start_existing_pod=true to authorize billable start." >&2
            exit 3
          fi
          # A GPU Pod started in RunPod's zero-GPU recovery mode is intentionally
          # not admitted as the shadow compute host. Dedicated CPU Pods normally
          # report gpuCount=0 and may omit computeType in older CLI responses.
          pod_name="$(jq -r '.name // ""' /tmp/shadow-pod.json)"
          if [[ "$RUNPOD_POD_ID" == "xn73vwwekavcc6" || "$pod_name" == *"director"* ]]; then
            echo "RUNPOD_SHADOW_RECOVERY_POD_REJECTED: use a dedicated CPU Pod, not the Director zero-GPU recovery Pod." >&2
            exit 4
          fi
          jq '{id,name,desiredStatus,runtimeStatus,gpuCount,computeType:(.computeType // .compute_type // null),ports,ssh}' /tmp/shadow-pod.json

      - name: Commission standalone shadow learner
        shell: bash
        env:
          SHARK_SHADOW_SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref != '' && inputs.source_ref || github.ref_name }}
        run: |
          set -euo pipefail

          try_commission() {
            timeout 1200s runpodctl exec python scripts/shark-shadow-runpod-commission.py --pod_id "$RUNPOD_POD_ID" | tee /tmp/shark-shadow-runpod-commission.txt
          }

          if try_commission; then
            echo "RUNPOD_SHADOW_REMOTE_COMMISSION_ACCEPTED"
            exit 0
          fi

          echo "RUNPOD_SHADOW_REMOTE_EXEC_RETRY_AFTER_RESTART"
          runpodctl pod restart "$RUNPOD_POD_ID" >/dev/null
          sleep 20

          for attempt in $(seq 1 12); do
            echo "RUNPOD_SHADOW_REMOTE_EXEC_WARMUP_ATTEMPT:$attempt"
            details="$(runpodctl pod get "$RUNPOD_POD_ID" -o json || true)"
            runtime="$(printf '%s' "$details" | jq -r '.runtimeStatus // "unknown"' 2>/dev/null || echo unknown)"
            ssh_error="$(printf '%s' "$details" | jq -r '.ssh.error // ""' 2>/dev/null || true)"
            if [[ "$runtime" == "running" && -z "$ssh_error" ]]; then
              if try_commission; then
                echo "RUNPOD_SHADOW_REMOTE_COMMISSION_ACCEPTED_AFTER_RESTART"
                exit 0
              fi
            fi
            sleep 10
          done

          echo "RUNPOD_SHADOW_REMOTE_EXEC_WARMUP_EXHAUSTED" >&2
          exit 1

      - name: Remove transient SSH identity
        if: always()
        shell: bash
        run: |
          set +e
          if command -v runpodctl >/dev/null 2>&1 && [[ -n "${RUNPOD_API_KEY:-}" && -n "${{ steps.key.outputs.fingerprint }}" ]]; then
            runpodctl ssh remove-key --fingerprint "${{ steps.key.outputs.fingerprint }}" >/dev/null 2>&1 || true
          fi
          rm -rf "$HOME/.runpod/ssh"

      - name: Upload commissioning receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shark-shadow-runpod-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            /tmp/shadow-pod.json
            /tmp/shark-shadow-runpod-commission.txt
          retention-days: 14
