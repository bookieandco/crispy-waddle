name: SPORT-PRED.FINAL Certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/money-core/src/sports-prediction-**'
      - 'packages/money-core/src/sports-intelligence-ingress.ts'
      - 'packages/money-core/src/sports-paper-betting.ts'
      - 'packages/money-core/src/sports-handicap-evidence.ts'
      - 'packages/money-core/src/sports-prop-intelligence.ts'
      - 'packages/money-core/src/sports-parlay-intelligence.ts'
      - 'packages/money-core/src/sports-pred-final-certification.test.ts'
      - 'packages/money-core/src/sports-pred-final-certification.ts'
      - 'packages/money-core/src/index.ts'
      - 'packages/money-core/package.json'
      - '.github/workflows/sport-pred-final-certification.yml'
      - 'pnpm-lock.yaml'
  push:
    branches:
      - main
    paths:
      - 'packages/money-core/src/sports-prediction-**'
      - 'packages/money-core/src/sports-intelligence-ingress.ts'
      - 'packages/money-core/src/sports-paper-betting.ts'
      - 'packages/money-core/src/sports-handicap-evidence.ts'
      - 'packages/money-core/src/sports-prop-intelligence.ts'
      - 'packages/money-core/src/sports-parlay-intelligence.ts'
      - 'packages/money-core/src/sports-pred-final-certification.test.ts'
      - 'packages/money-core/src/sports-pred-final-certification.ts'
      - 'packages/money-core/src/index.ts'
      - 'packages/money-core/package.json'
      - '.github/workflows/sport-pred-final-certification.yml'
      - 'pnpm-lock.yaml'

concurrency:
  group: sport-pred-final-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certify:
    name: Type-check, forward-shadow certification, full Money regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: SPORT-PRED.FINAL
        run: pnpm --filter @jhadina/money-core verify:sport-pred-final
