name: Jhadina Sports Lab tennis probe — source-rights hold
# Online tennis endpoint probes are intentionally disabled, including manual runs.
on:
  push:
    paths:
      - '.github/workflows/jhadina-sports-tennis-shape.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate tennis parsing using existing fixtures only
        run: node --test training/sports/experiments/2026-10-13-week-001/core.test.mjs
