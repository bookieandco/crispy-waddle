name: Jhadina Evolution Execute
run-name: Jhadina Evolution — ${{ inputs.evolution_id }}

on:
  workflow_dispatch:
    inputs:
      evolution_id:
        description: "Approved Jhadina evolution candidate ID"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  JHADINA_RESULT_VERSION: "2"

concurrency:
  group: jhadina-evolution-${{ inputs.evolution_id }}
  cancel-in-progress: false

jobs:
  execute-approved-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: jhadina-evolution-approval
    permissions:
      contents: write
      pull-requests: write
    env:
      EVOLUTION_ID: ${{ inputs.evolution_id }}
      SUPABASE_URL: ${{ secrets.JHADINA_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.JHADINA_SUPABASE_SECRET_KEY }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve approved evolution from Supabase
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "JHADINA_SUPABASE_URL is not configured"; exit 1; }
          test -n "$SUPABASE_SECRET_KEY" || { echo "JHADINA_SUPABASE_SECRET_KEY is not configured"; exit 1; }
          test -n "$EVOLUTION_ID" || { echo "evolution_id is required"; exit 1; }

          response=$(curl --fail-with-body --silent --show-error \
            --get "$SUPABASE_URL/rest/v1/jhadina_evolution_candidates" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            -H "Accept: application/json" \
            --data-urlencode "candidate_id=eq.$EVOLUTION_ID" \
            --data-urlencode "select=candidate_id,status,proposed_change,risk,affected_paths,verification_plan,proposal_hash,decided_by,decided_at,execution_id" \
            --data-urlencode "limit=1")

          node --input-type=module <<'NODE'
          const fs = await import('node:fs');
          const rows = JSON.parse(process.env.CANDIDATE_RESPONSE);
          if (!Array.isArray(rows) || rows.length !== 1) throw new Error('approved evolution candidate not found');
          const c = rows[0];
          if (c.status !== 'approved') throw new Error(`candidate is not approved: ${c.status}`);
          if (!c.decided_by || !c.decided_at) throw new Error('candidate has incomplete approval receipt');
          if (!c.proposal_hash) throw new Error('candidate has no proposal hash');
          if (!c.execution_id) throw new Error('candidate has no execution binding');
          if (c.risk === 'critical') throw new Error('critical-risk evolution is blocked');
          const paths = Array.isArray(c.affected_paths) ? c.affected_paths : [];
          const protectedPattern = /(^|\/)(\.github\/workflows\/|identity\/|policy\/|values\/|security\/|secrets\/|payments\/|transfers\/|military\/)/;
          if (paths.some((p) => protectedPattern.test(p))) throw new Error('candidate touches protected authority paths');
          fs.writeFileSync('/tmp/jhadina-approved.json', JSON.stringify(c, null, 2));
          NODE
        env:
          CANDIDATE_RESPONSE: ${{ steps.resolve.outputs.response }}

      - name: Export approved execution
        id: approved
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/jhadina-approved.json
          node --input-type=module <<'NODE'
          const fs = await import('node:fs');
          const c = JSON.parse(fs.readFileSync('/tmp/jhadina-approved.json', 'utf8'));
          const branch = `jhadina/evolution/${c.candidate_id}-${process.env.GITHUB_RUN_ID}`;
          const out = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(out, `candidate_id=${c.candidate_id}\n`);
          fs.appendFileSync(out, `execution_id=${c.execution_id}\n`);
          fs.appendFileSync(out, `proposal_hash=${c.proposal_hash}\n`);
          fs.appendFileSync(out, `branch=${branch}\n`);
          fs.appendFileSync(out, `affected_paths=${JSON.stringify(c.affected_paths || [])}\n`);
          fs.appendFileSync(out, `verification_plan=${JSON.stringify(c.verification_plan || [])}\n`);
          fs.appendFileSync(out, `suggested_change<<EOF\n${c.proposed_change}\nEOF\n`);
          NODE

      - name: Create isolated branch
        env:
          BRANCH_NAME: ${{ steps.approved.outputs.branch }}
        run: git switch -c "$BRANCH_NAME"

      - name: Run Claude Code on approved change only
        id: claude
        uses: anthropics/claude-code-base-action@beta
        with:
          prompt: |
            You are Jhadina's approved evolution worker.

            EVOLUTION ID: ${{ steps.approved.outputs.candidate_id }}
            EXECUTION ID: ${{ steps.approved.outputs.execution_id }}
            APPROVED PROPOSAL HASH: ${{ steps.approved.outputs.proposal_hash }}
            APPROVED CHANGE:
            ${{ steps.approved.outputs.suggested_change }}

            APPROVED AFFECTED PATHS:
            ${{ steps.approved.outputs.affected_paths }}

            VERIFICATION PLAN:
            ${{ steps.approved.outputs.verification_plan }}

            Work ONLY on the approved change and only within the approved affected paths.
            Do not access secrets, credentials, production systems, payment systems,
            identity systems, policy/values enforcement, or military/security systems.
            Do not modify workflow permissions, GitHub Actions security settings, or .github/workflows.
            Do not commit or push changes.
            Inspect first. Make the smallest safe change.
            Run the approved verification plan when applicable.
            Leave a concise summary of root cause, files changed, and verification performed.
          allowed_tools: "View,GlobTool,GrepTool,BatchTool,Write,Edit,Bash(git status),Bash(git diff:*),Bash(pnpm test),Bash(pnpm typecheck)"
          disallowed_tools: "WebFetch,WebSearch,Task,TaskOutput,Bash(git push),Bash(git commit),Bash(git merge),Bash(gh:*)"
          max_turns: "12"
          append_system_prompt: |
            Jhadina governance is authoritative. Never weaken or bypass a policy boundary.
            Never edit protected authority code or workflow configuration.
            If the approved request requires a protected change, stop and explain why.

      - name: Verify approved paths were not exceeded
        id: verification_paths
        env:
          BASE_BRANCH: main
          APPROVED_PATHS: ${{ steps.approved.outputs.affected_paths }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const { execSync } = await import('node:child_process');
          const approved = JSON.parse(process.env.APPROVED_PATHS || '[]');
          const changed = execSync(`git diff --name-only main...HEAD`, { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          const ok = changed.every((file) => approved.includes(file));
          if (!ok) {
            console.error(JSON.stringify({ approved, changed }, null, 2));
            throw new Error('execution changed files outside the approved affected_paths');
          }
          NODE

      - name: Run independent verification
        id: verification
        run: |
          pnpm --filter jhadina-evolution-core test
          pnpm --filter jhadina-evolution-core typecheck

      - name: Write structured result
        if: always()
        env:
          STATUS: ${{ steps.verification_paths.outcome == 'success' && steps.verification.outcome == 'success' && 'VERIFIED' || 'FAILED' }}
          PROTECTED_PATHS_OUTCOME: ${{ steps.verification_paths.outcome }}
          VERIFICATION_OUTCOME: ${{ steps.verification.outcome }}
        run: |
          set -euo pipefail
          mkdir -p .jhadina/results .jhadina/evidence
          node --input-type=module <<'NODE'
          const fs = await import('node:fs');
          const { execSync } = await import('node:child_process');
          const changed = execSync('git diff --name-only main...HEAD', {encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const result = {
            version: process.env.JHADINA_RESULT_VERSION,
            evolutionId: process.env.EVOLUTION_ID,
            executionId: process.env.EXECUTION_ID,
            proposalHash: process.env.PROPOSAL_HASH,
            runId: Number(process.env.GITHUB_RUN_ID),
            status: process.env.STATUS,
            baseBranch: 'main',
            branch: process.env.BRANCH_NAME,
            changedFiles: changed,
            verification: {
              approvedPaths: process.env.PROTECTED_PATHS_OUTCOME,
              evolutionCore: process.env.VERIFICATION_OUTCOME,
            },
            draftPr: null,
          };
          fs.writeFileSync(`.jhadina/results/${process.env.EVOLUTION_ID}.json`, JSON.stringify(result, null, 2));
          fs.writeFileSync(`.jhadina/evidence/${process.env.EVOLUTION_ID}.json`, JSON.stringify(result, null, 2));
          NODE
        env:
          EXECUTION_ID: ${{ steps.approved.outputs.execution_id }}
          PROPOSAL_HASH: ${{ steps.approved.outputs.proposal_hash }}
          BRANCH_NAME: ${{ steps.approved.outputs.branch }}

      - name: Commit verified change
        if: steps.verification_paths.outcome == 'success' && steps.verification.outcome == 'success'
        env:
          BRANCH_NAME: ${{ steps.approved.outputs.branch }}
        run: |
          git config user.name "Jhadina Evolution"
          git config user.email "jhadina-evolution@users.noreply.github.com"
          git add -A
          git commit -m "chore(jhadina): apply approved evolution $EVOLUTION_ID"
          git push --set-upstream origin "$BRANCH_NAME"

      - name: Open draft PR
        id: draft_pr
        if: steps.verification_paths.outcome == 'success' && steps.verification.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.approved.outputs.branch }}
        run: |
          PR_URL=$(gh pr create --draft --base main --head "$BRANCH_NAME" --title "Jhadina evolution: $EVOLUTION_ID" --body "Approved evolution $EVOLUTION_ID. Execution ${{ steps.approved.outputs.execution_id }}. Proposal hash ${{ steps.approved.outputs.proposal_hash }}.")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Upload structured result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jhadina-evolution-result-${{ inputs.evolution_id }}-${{ github.run_id }}
          path: .jhadina/results/${{ inputs.evolution_id }}.json
          if-no-files-found: warn
          retention-days: 30
