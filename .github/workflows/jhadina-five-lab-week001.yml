name: Jhadina Five Lab Seven Day Evidence
on:
  push:
    branches: [main]
    paths:
      - 'scripts/experiments/week001-five-lab/**'
      - '.github/workflows/jhadina-five-lab-week001.yml'
  pull_request:
    paths:
      - 'scripts/experiments/week001-five-lab/**'
      - '.github/workflows/jhadina-five-lab-week001.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: evidence schema only; package tests are not executed"
        type: boolean
        required: true
        default: true
  schedule:
    - cron: '37 12 14-21 10 *'
permissions:
  contents: read
  actions: read
concurrency:
  group: jhadina-five-lab-week001
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Guardrail unit tests
        run: python3 -m unittest discover -s scripts/experiments/week001-five-lab -p 'test_*.py'
      - name: Frozen dependency installation
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: pnpm install --frozen-lockfile
      - name: Obtain previous day's sealed evidence, if available
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          target=$(date -u -d yesterday +%Y-%m-%d)
          if [ "$target" = "2026-10-14" ]; then
            # Exact genuinely observed first scheduled run, externally backed up.
            candidates="38567194569"
          else
            candidates=$(gh run list -R "$GITHUB_REPOSITORY" --workflow jhadina-five-lab-week001.yml --branch main --event schedule --limit 30 --json databaseId,createdAt,event | jq -r --arg day "$target" '.[] | select(.createdAt | startswith($day)) | .databaseId') || true
          fi
          for previous in $candidates; do
            if [[ "$previous" = "$GITHUB_RUN_ID" ]]; then continue; fi
            mkdir -p "$RUNNER_TEMP/previous-evidence"
            if gh run download "$previous" -R "$GITHUB_REPOSITORY" -n "five-lab-week001-$previous" -D "$RUNNER_TEMP/previous-evidence"; then
              echo "Candidate prior-day evidence downloaded from GitHub Actions run $previous" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
          done
          if [ ! -f "$RUNNER_TEMP/previous-evidence/evidence.json" ]; then
            echo "No previous-day artifact was available; the runner will record this explicitly." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Bounded five-lab read-only package tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set +e
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then args+=(--preflight); fi
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(date -u +%Y-%m-%d)" = "2026-10-21" ]; then args+=(--settlement); fi
          if [ -f "$RUNNER_TEMP/previous-evidence/evidence.json" ]; then args+=(--previous "$RUNNER_TEMP/previous-evidence/evidence.json"); fi
          browser_code=0
          if [ "$DRY_RUN" != "true" ]; then
            python3 scripts/experiments/week001-five-lab/browser_qa.py --output "${RUNNER_TEMP}/five-lab-evidence/browser_qa.json" || browser_code=$?
            args+=(--browser-evidence "${RUNNER_TEMP}/five-lab-evidence/browser_qa.json")
          fi
          python3 scripts/experiments/week001-five-lab/runner.py --research --output "${RUNNER_TEMP}/five-lab-evidence" "${args[@]}"
          code=$?
          echo "evaluation_exit_code=$code" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/experiments/week001-five-lab/report.py "$RUNNER_TEMP/five-lab-evidence/evidence.json" >> "$GITHUB_STEP_SUMMARY"
          if [ "$browser_code" != "0" ]; then echo "Headless browser QA failed or unavailable" >> "$GITHUB_STEP_SUMMARY"; exit "$browser_code"; fi
          exit "$code"
      - name: Upload evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-lab-week001-${{ github.run_id }}
          path: ${{ runner.temp }}/five-lab-evidence/
          retention-days: 14
          if-no-files-found: warn
