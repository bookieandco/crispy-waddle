name: Jhadina Evolution Execute
run-name: Jhadina Evolution — ${{ inputs.task_id }}

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Approved Backlog/Evolution task ID"
        required: true
        type: string
      prompt:
        description: "Approved repair/upgrade instruction"
        required: true
        type: string
      base_branch:
        description: "Branch to start from"
        required: true
        default: "agent/jhadina-integration-spine"
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  JHADINA_RESULT_VERSION: "1"

concurrency:
  group: jhadina-evolution-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  execute-approved-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: jhadina-evolution-approval
    permissions:
      contents: write
      pull-requests: write
    env:
      TASK_ID: ${{ inputs.task_id }}
      APPROVED_PROMPT: ${{ inputs.prompt }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      BRANCH_NAME: jhadina/evolution/${{ inputs.task_id }}-${{ github.run_id }}

    steps:
      - name: Checkout approved base
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Create isolated branch
        run: git switch -c "$BRANCH_NAME"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Claude Code in the isolated workspace
        id: claude
        uses: anthropics/claude-code-base-action@beta
        with:
          prompt: |
            You are Jhadina's approved evolution worker.

            TASK ID: ${{ inputs.task_id }}
            APPROVED REQUEST:
            ${{ inputs.prompt }}

            Work ONLY on the approved request.
            Work only inside the repository workspace.
            Do not access secrets, credentials, production systems, payment systems,
            identity systems, policy/values enforcement, or military/security systems.
            Do not modify workflow permissions or GitHub Actions security settings.
            Do not modify .github/workflows files.
            Do not modify files outside the approved task scope.
            Do not commit or push changes; the workflow will do that after verification.

            Inspect first. Make the smallest safe change.
            Run the requested tests/typechecks when applicable.
            Leave a concise summary of the root cause, files changed, and verification performed.
          allowed_tools: "View,GlobTool,GrepTool,BatchTool,Write,Edit,Bash(git status),Bash(git diff:*),Bash(pnpm test),Bash(pnpm typecheck)"
          disallowed_tools: "WebFetch,WebSearch,Task,TaskOutput,Bash(git push),Bash(git commit),Bash(gh:*)"
          max_turns: "12"
          append_system_prompt: |
            Jhadina governance is authoritative. Never weaken or bypass a policy boundary.
            Never edit protected authority code or workflow configuration.
            If the request requires a protected change, stop and explain why.

      - name: Verify protected paths were not changed
        id: protected_paths
        run: |
          if git diff --name-only "$BASE_BRANCH...HEAD" | grep -E '(^|/)(\.github/workflows/|identity/|policy/|values/|security/|secrets/|payments/|transfers/|military/)' ; then
            echo "Protected path changed; blocking execution."
            exit 1
          fi

      - name: Run independent verification
        id: verification
        run: |
          pnpm --filter jhadina-evolution-core test
          pnpm --filter jhadina-evolution-core typecheck

      - name: Write structured result
        if: always()
        run: |
          mkdir -p .jhadina/results .jhadina/evidence
          STATUS="FAILED"
          if [ "${{ steps.protected_paths.outcome }}" = "success" ] && [ "${{ steps.verification.outcome }}" = "success" ]; then
            STATUS="VERIFIED"
          fi
          node - <<'NODE'
          const fs = require('fs');
          const status = process.env.STATUS;
          const result = {
            version: process.env.JHADINA_RESULT_VERSION,
            taskId: process.env.TASK_ID,
            runId: Number(process.env.GITHUB_RUN_ID),
            status,
            baseBranch: process.env.BASE_BRANCH,
            branch: process.env.BRANCH_NAME,
            changedFiles: require('child_process').execSync(`git diff --name-only ${process.env.BASE_BRANCH}...HEAD`, {encoding:'utf8'}).trim().split('\n').filter(Boolean),
            diffStat: require('child_process').execSync(`git diff --stat ${process.env.BASE_BRANCH}...HEAD`, {encoding:'utf8'}),
            verification: {
              protectedPaths: '${{ steps.protected_paths.outcome }}',
              evolutionCoreTests: '${{ steps.verification.outcome }}',
            },
            draftPr: null,
          };
          fs.writeFileSync(`.jhadina/results/${process.env.TASK_ID}.json`, JSON.stringify(result, null, 2));
          NODE
          cp ".jhadina/results/$TASK_ID.json" ".jhadina/evidence/$TASK_ID.json"
        env:
          STATUS: ${{ steps.protected_paths.outcome == 'success' && steps.verification.outcome == 'success' && 'VERIFIED' || 'FAILED' }}

      - name: Commit verified change
        if: steps.protected_paths.outcome == 'success' && steps.verification.outcome == 'success'
        run: |
          git config user.name "Jhadina Evolution"
          git config user.email "jhadina-evolution@users.noreply.github.com"
          git add -A
          git commit -m "chore(jhadina): apply approved evolution ${TASK_ID}"
          git push --set-upstream origin "$BRANCH_NAME"

      - name: Open draft PR
        id: draft_pr
        if: steps.protected_paths.outcome == 'success' && steps.verification.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL=$(gh pr create \
            --draft \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "Jhadina evolution: $TASK_ID" \
            --body "## Approved Jhadina Evolution\n\nTask: \`$TASK_ID\`\n\nExecuted after the Jhadina evolution approval gate.\n\n### Verification\n- jhadina-evolution-core tests passed\n- jhadina-evolution-core typecheck passed\n- protected-path verification passed\n\n### Evidence\nSee \`.jhadina/results/$TASK_ID.json\`." )
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Finalize structured result with PR
        if: always()
        run: |
          if [ -f ".jhadina/results/$TASK_ID.json" ]; then
            node - <<'NODE'
            const fs = require('fs');
            const path = `.jhadina/results/${process.env.TASK_ID}.json`;
            const result = JSON.parse(fs.readFileSync(path, 'utf8'));
            result.draftPr = process.env.DRAFT_PR_URL || null;
            fs.writeFileSync(path, JSON.stringify(result, null, 2));
            NODE
            cp ".jhadina/results/$TASK_ID.json" ".jhadina/evidence/$TASK_ID.json"
          fi
        env:
          DRAFT_PR_URL: ${{ steps.draft_pr.outputs.url }}

      - name: Upload structured result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jhadina-evolution-result-${{ inputs.task_id }}-${{ github.run_id }}
          path: .jhadina/results/${{ inputs.task_id }}.json
          if-no-files-found: error
          retention-days: 30
