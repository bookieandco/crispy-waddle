name: SAM Live Commissioning

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sam-live-commissioning.yml"
      - "apps/jhadina-web/scripts/sam-live-commissioning.ts"
      - "apps/jhadina-web/src/lib/money-opportunities/sam-*.ts"
      - "packages/opportunity-core/src/domain/sam-*.ts"
      - "supabase/functions/jhadina-sam-gateway/**"
      - "supabase/functions/jhadina-sam-runtime-gateway/**"
  schedule:
    - cron: "11 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sam-live-commissioning
  cancel-in-progress: true

jobs:
  commission:
    name: Real SAM evidence commissioning
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://kqbkaozfjubkjevdfvic.supabase.co
      SAM_GOV_API_KEY: ${{ secrets.sam_key }}
      SAM_RUNTIME_GATEWAY_URL: https://kqbkaozfjubkjevdfvic.supabase.co/functions/v1/jhadina-sam-runtime-gateway
    steps:
      - name: Check SAM.gov credential
        id: preflight
        shell: bash
        run: |
          if [ -z "$SAM_GOV_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "BLOCKED_EXTERNAL_CREDENTIAL: sam_key"
            echo "### SAM live commissioning" >> "$GITHUB_STEP_SUMMARY"
            echo "BLOCKED_EXTERNAL_CREDENTIAL: sam_key" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Request SAM runtime OIDC token
        if: steps.preflight.outputs.configured == 'true'
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('jhadina-sam-runtime')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Checkout
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: steps.preflight.outputs.configured == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false

      - name: Setup Node
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Frozen install
        if: steps.preflight.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Commission real SAM evidence
        if: steps.preflight.outputs.configured == 'true'
        env:
          SAM_RUNTIME_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @jhadina/opportunity-core exec tsx ../../apps/jhadina-web/scripts/sam-live-commissioning.ts | tee /tmp/sam-commissioning.json
          echo "### SAM live commissioning" >> "$GITHUB_STEP_SUMMARY"
          tail -n 160 /tmp/sam-commissioning.json >> "$GITHUB_STEP_SUMMARY"
