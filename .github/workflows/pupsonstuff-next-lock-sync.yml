name: PupsonStuff one-shot Next lockfile reconciliation

on:
  push:
    branches: ['fix/pupson-final-visual-3d-20261020']
    paths: ['.github/workflows/pupsonstuff-next-lock-sync.yml']

permissions:
  contents: write

concurrency:
  group: pupson-next-lock-sync
  cancel-in-progress: false

jobs:
  synchronize-pupson-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'bookieandco/crispy-waddle' && github.ref == 'refs/heads/fix/pupson-final-visual-3d-20261020'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Regenerate canonical lock without running dependency lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./apps/pupsonstuff/package.json').dependencies.next")" = '15.5.28'
          test "$(node -p "require('./package.json').pnpm.packageExtensions['next@15.5.28'].dependencies['@types/react']")" = '19.2.18'
          pnpm --filter @jhadina/pupsonstuff add next@15.5.28 --save-exact --lockfile-only --ignore-scripts
          git diff --exit-code -- package.json apps/pupsonstuff/package.json
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @jhadina/pupsonstuff type-check
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Expected the canonical lockfile to change to Next 15.5.28.' >&2
            exit 1
          fi
          git diff --stat -- pnpm-lock.yaml
      - name: Commit only regenerated canonical lockfile on the same draft branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/pupson-final-visual-3d-20261020'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add -- pnpm-lock.yaml
          git diff --cached --name-only | grep -x 'pnpm-lock.yaml'
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'build(pupson): regenerate frozen pnpm lock for Next 15.5.28'
          git push origin HEAD:fix/pupson-final-visual-3d-20261020
      - name: Record safety boundary
        if: always()
        run: |
          echo 'One-time source-only lockfile repair: no Supabase credentials, hosting, public deployment, payment calls, provider orders, or pet images involved.' >> "$GITHUB_STEP_SUMMARY"
