name: Safety Core

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/jhadina-core-spine/**'
      - 'packages/jhadina-intelligence-core/src/emergency-communication-bridge*'
      - 'packages/spatial-intelligence-core/src/safety-context-reader*'
      - 'apps/jhadina-web/src/lib/safety/**'
      - 'apps/jhadina-web/tsconfig.safety.json'
      - 'supabase/migrations/*safety*'
      - '.github/workflows/safety-core.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/jhadina-core-spine/**'
      - 'packages/jhadina-intelligence-core/src/emergency-communication-bridge*'
      - 'packages/spatial-intelligence-core/src/safety-context-reader*'
      - 'apps/jhadina-web/src/lib/safety/**'
      - 'apps/jhadina-web/tsconfig.safety.json'
      - 'supabase/migrations/*safety*'
      - '.github/workflows/safety-core.yml'

jobs:
  verify:
    name: Safety type-check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check Safety Core
        run: pnpm --filter @jhadina/core-spine type-check
      - name: Test Safety Core
        run: pnpm --filter @jhadina/core-spine exec vitest run src/safety-personal-stack.test.ts src/safety-production.test.ts src/emergency-adversarial.test.ts src/safety-drill-3.test.ts src/safety-prod-gate-2.test.ts src/safety-prod-gate-3.test.ts src/safety-prod-gate-4.test.ts src/safety-prod-gate-5.test.ts
      - name: Type-check governed communications
        run: pnpm --filter @jhadina/intelligence-core type-check
      - name: Test emergency communications bridge
        run: pnpm --filter @jhadina/intelligence-core exec tsx --test src/emergency-communication-bridge.test.ts
      - name: Type-check Spatial Intelligence
        run: pnpm --filter @jhadina/spatial-intelligence-core type-check
      - name: Test Safety spatial projection
        run: pnpm --filter @jhadina/spatial-intelligence-core exec vitest run src/safety-context-reader.test.ts
      - name: Type-check Jhadina web safety persistence
        run: pnpm --filter @jhadina/jhadina-web exec tsc --noEmit -p tsconfig.safety.json
