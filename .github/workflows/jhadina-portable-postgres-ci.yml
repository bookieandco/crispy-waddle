name: Jhadina Portable Postgres CI

on:
  pull_request:
    paths:
      - "packages/money-core/migrations/**"
      - "infrastructure/portable/**"
      - "docs/JHADINA_PORTABLE_INFRASTRUCTURE.md"
      - "scripts/jhadina-portable-runpod-postgres.py"
      - "scripts/jhadina-portable-runpod-postgres-contract.py"
      - "scripts/jhadina-portable-memory-gateway-contract.py"
      - "services/jhadina-portable-memory-gateway/**"
      - "apps/jhadina-web/src/lib/storage/createMemoryStorage.ts"
      - "apps/jhadina-web/src/lib/storage/createMemoryStorage.test.ts"
      - ".github/workflows/jhadina-portable-runpod-postgres.yml"
      - ".github/workflows/jhadina-portable-postgres-ci.yml"
  push:
    branches:
      - main
    paths:
      - "packages/money-core/migrations/**"
      - "infrastructure/portable/**"
      - "docs/JHADINA_PORTABLE_INFRASTRUCTURE.md"
      - "scripts/jhadina-portable-runpod-postgres.py"
      - "scripts/jhadina-portable-runpod-postgres-contract.py"
      - "scripts/jhadina-portable-memory-gateway-contract.py"
      - "services/jhadina-portable-memory-gateway/**"
      - "apps/jhadina-web/src/lib/storage/createMemoryStorage.ts"
      - "apps/jhadina-web/src/lib/storage/createMemoryStorage.test.ts"
      - ".github/workflows/jhadina-portable-runpod-postgres.yml"
      - ".github/workflows/jhadina-portable-postgres-ci.yml"
  workflow_dispatch:

jobs:
  portable-topology:
    name: Validate portable Compose topology
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JHADINA_POSTGRES_PASSWORD: portable-ci
      JHADINA_MINIO_ROOT_USER: jhadina
      JHADINA_MINIO_ROOT_PASSWORD: portable-ci-minio
      JHADINA_DATA_ROOT: /tmp/jhadina-portable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose -f infrastructure/portable/docker-compose.yml config --quiet
      - name: Validate RunPod staging commissioner
        run: |
          python3 -m py_compile scripts/jhadina-portable-runpod-postgres.py
          python3 -m py_compile scripts/jhadina-portable-runpod-postgres-contract.py
          python3 -m py_compile scripts/jhadina-portable-memory-gateway-contract.py
          python3 -m py_compile services/jhadina-portable-memory-gateway/app.py
          python3 -m py_compile services/jhadina-portable-memory-gateway/vercel_oidc.py
          python3 scripts/jhadina-portable-runpod-postgres-contract.py
          python3 scripts/jhadina-portable-memory-gateway-contract.py

  money-schema:
    name: Replay Money schema on vanilla PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jhadina
          POSTGRES_USER: jhadina
          POSTGRES_PASSWORD: portable-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jhadina -d jhadina"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://jhadina:portable-ci@127.0.0.1:5432/jhadina
      PGPASSWORD: portable-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Install portable compatibility roles
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infrastructure/portable/postgres-init/000_supabase_compat.sql
      - name: Replay Money Core migrations
        run: |
          set -euo pipefail

          # Historical migrations 003+ assume the execution-attempt base table
          # existed already. Reproduce that prerequisite without rewriting
          # Money's canonical numbered migration history.
          for migration in             packages/money-core/migrations/001_create_money_transaction_requests.sql             packages/money-core/migrations/002_create_money_execution_permits.sql
          do
            echo "Applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1             -f infrastructure/portable/postgres-init/010_money_execution_attempts_prerequisite.sql

          for migration in packages/money-core/migrations/*.sql; do
            case "$migration" in
              */001_create_money_transaction_requests.sql|*/002_create_money_execution_permits.sql)
                continue
                ;;
            esac
            echo "Applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify SHARK/Coffer portable schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            required text;
          BEGIN
            FOREACH required IN ARRAY ARRAY[
              'money_coffers',
              'money_wallet_connections',
              'money_signer_leases',
              'money_market_connector_admissions',
              'money_purse_charters',
              'money_shark_runtime_ingress',
              'money_shark_coffer_runtime_runs',
              'money_dex_execution_attempts'
            ]
            LOOP
              IF to_regclass('public.' || required) IS NULL THEN
                RAISE EXCEPTION 'portable_money_table_missing:%', required;
              END IF;
            END LOOP;
          END
          $$;
          SELECT 'PORTABLE_MONEY_POSTGRES_REPLAY_PASS' AS certification;
          SQL


      - name: Setup pnpm for disposable Purse SQL canary
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - name: Setup Node for disposable Purse SQL canary
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install frozen Purse SQL test dependencies
        run: pnpm install --frozen-lockfile
      - name: PURSE-COMMISSION.01 real PostgreSQL lease and restart evidence
        env:
          PURSE_EPHEMERAL_PG_TEST_URL: ${{ env.DATABASE_URL }}
        run: pnpm --filter @jhadina/money-core exec tsx --test src/purse-commission-pg.integration.test.ts
      - name: PURSE-COMMISSION.02 isolated disposable SQL backup and restore
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          # Intentionally synthetic and non-empty. This is not an original SHADOW ledger.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.money_coffers(coffer_id,user_id,currency,principal_capital_minor,hard_stop_floor_minor,survival_floor_minor,defensive_floor_minor,state)
            VALUES('purse-restore-coffer','purse-restore-user','USD',10000,100,200,300,'ACTIVE');
          INSERT INTO public.money_purse_charters(charter_id,charter_version,user_id,coffer_id,reporting_currency,autonomy_mode,verified_owner_payout_destination_id,config_json,effective_at,evidence_ids)
            VALUES('purse-restore-charter','ci','purse-restore-user','purse-restore-coffer','USD','PAPER_AUTONOMOUS','owner:ci','{"ci":true}'::jsonb,now(),ARRAY['synthetic:restore-only']);
          INSERT INTO public.money_purse_paper_leases(charter_id,user_id,worker_id,fencing_token,acquired_at,expires_at,evidence_ids)
            VALUES('purse-restore-charter','purse-restore-user','ci-worker',1,now(),now()+interval '30 min',ARRAY['synthetic:lease']);
          SQL
          sha="$(printf '%s' '{"ci":"synthetic-restore-only"}' | sha256sum | cut -d' ' -f1)"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v synthetic_sha="$sha" <<'SQL'
          INSERT INTO public.money_purse_paper_cycles(cycle_id,charter_id,user_id,worker_id,fencing_token,economic_sha256,payload_json,information_cutoff,created_at_evidence,expires_at)
            VALUES('purse-restore-cycle','purse-restore-charter','purse-restore-user','ci-worker',1,:'synthetic_sha','{"ci":"synthetic-restore-only"}'::jsonb,now(),now(),now()+interval '5 min');
          SQL
          pg_dump --no-owner --no-acl -Fc "$DATABASE_URL" > "$tmp/source.dump"
          sha256sum "$tmp/source.dump" > "$tmp/source.sha256"
          (cd "$tmp" && sha256sum -c source.sha256)
          createdb -h 127.0.0.1 -p 5432 -U jhadina purse_isolated_ci_restore
          pg_restore --exit-on-error --no-owner --no-acl -d postgresql://jhadina:portable-ci@127.0.0.1:5432/purse_isolated_ci_restore "$tmp/source.dump"
          for table in money_purse_charters money_purse_paper_leases money_purse_paper_cycles money_purse_paper_payday_receipts; do
            source_count="$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM public.$table")"
            restored_count="$(psql postgresql://jhadina:portable-ci@127.0.0.1:5432/purse_isolated_ci_restore -Atc "SELECT count(*) FROM public.$table")"
            test "$source_count" = "$restored_count"
            case "$table" in
              money_purse_charters|money_purse_paper_leases|money_purse_paper_cycles)
                test "$source_count" -gt 0
                ;;
            esac
          done
          psql postgresql://jhadina:portable-ci@127.0.0.1:5432/purse_isolated_ci_restore -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.money_purse_paper_cycles WHERE authority='PAPER_CYCLE_ONLY' AND can_execute=false AND can_sign=false AND can_broadcast=false AND can_move_money=false"
          echo "PURSE_DISPOSABLE_RESTORE_PASS (CI fixture only; NOT Google Drive or original ledger)"


  memory-schema:
    name: Replay Memory schema on vanilla PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jhadina
          POSTGRES_USER: jhadina
          POSTGRES_PASSWORD: portable-ci
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jhadina -d jhadina"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://jhadina:portable-ci@127.0.0.1:5433/jhadina
      PGPASSWORD: portable-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Install portable compatibility roles
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infrastructure/portable/postgres-init/000_supabase_compat.sql
      - name: Replay canonical Memory migrations
        run: |
          set -euo pipefail
          for migration in             supabase/migrations/20260822000000_create_jhadina_memory_core.sql             supabase/migrations/20260920030600_preserve_jhadina_memory_reasoning_lineage.sql             supabase/migrations/20260920224800_jhadina_personality_outcome_lineage.sql             supabase/migrations/20260923045337_personality_memory_final_lifecycle.sql
          do
            echo "Applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f infrastructure/portable/postgres-init/020_memory_runtime_grants.sql
      - name: Verify portable Memory lifecycle schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            required text;
          BEGIN
            FOREACH required IN ARRAY ARRAY[
              'jhadina_memory_candidates',
              'jhadina_memories',
              'jhadina_reasoning_events',
              'jhadina_timeline_events'
            ]
            LOOP
              IF to_regclass('public.' || required) IS NULL THEN
                RAISE EXCEPTION 'portable_memory_table_missing:%', required;
              END IF;
            END LOOP;

            IF to_regprocedure('public.jhadina_retire_memory(text,text,text,timestamp with time zone)') IS NULL THEN
              RAISE EXCEPTION 'portable_memory_retire_rpc_missing';
            END IF;
            IF to_regprocedure('public.jhadina_correct_memory(text,text,text,text,numeric,text,timestamp with time zone)') IS NULL THEN
              RAISE EXCEPTION 'portable_memory_correct_rpc_missing';
            END IF;
          END
          $$;

          DO $$
          BEGIN
            IF NOT has_table_privilege('jhadina_memory_gateway','public.jhadina_memories','SELECT') THEN
              RAISE EXCEPTION 'portable_memory_gateway_select_missing';
            END IF;
            IF NOT has_table_privilege('jhadina_memory_gateway','public.jhadina_memories','INSERT') THEN
              RAISE EXCEPTION 'portable_memory_gateway_insert_missing';
            END IF;
            IF NOT has_table_privilege('jhadina_memory_gateway','public.jhadina_reasoning_events','UPDATE') THEN
              RAISE EXCEPTION 'portable_memory_gateway_update_missing';
            END IF;
          END
          $$;

          SELECT 'PORTABLE_MEMORY_POSTGRES_REPLAY_PASS' AS certification;
          SQL
      - name: Create bounded Memory gateway runtime role
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='jhadina_runtime_test') THEN
              CREATE ROLE jhadina_runtime_test LOGIN PASSWORD 'portable-runtime';
            END IF;
          END
          $$;
          GRANT jhadina_memory_gateway TO jhadina_runtime_test;
          CREATE TABLE IF NOT EXISTS public.money_coffers (
            id text primary key,
            marker text not null
          );
          REVOKE ALL ON public.money_coffers FROM PUBLIC, anon, authenticated, jhadina_memory_gateway;
          SQL
      - name: Verify Memory gateway cannot read Money state
        env:
          PGPASSWORD: portable-runtime
        run: |
          set -euo pipefail
          if psql "postgresql://jhadina_runtime_test:portable-runtime@127.0.0.1:5433/jhadina" \
            -v ON_ERROR_STOP=1 -c 'select * from public.money_coffers limit 1' >/tmp/memory-money-read.out 2>&1; then
            echo "PORTABLE_MEMORY_GATEWAY_MONEY_ACCESS_FORBIDDEN" >&2
            cat /tmp/memory-money-read.out >&2
            exit 1
          fi
          grep -q 'permission denied' /tmp/memory-money-read.out
      - name: Exercise portable Memory gateway against PostgreSQL
        env:
          DATABASE_URL: postgresql://jhadina_runtime_test:portable-runtime@127.0.0.1:5433/jhadina
        run: |
          python3 -m venv /tmp/portable-memory-gateway-venv
          source /tmp/portable-memory-gateway-venv/bin/activate
          python -m pip install --upgrade pip wheel
          python -m pip install -r services/jhadina-portable-memory-gateway/requirements.txt pytest==8.4.2 httpx==0.28.1
          cd services/jhadina-portable-memory-gateway
          pytest -q test_app.py
