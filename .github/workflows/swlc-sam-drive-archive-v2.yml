name: SWLC SAM Drive V2 Archive Proof

on:
  pull_request:
    paths:
      - 'scripts/swlc-drive-archive/**'
      - '.github/workflows/swlc-sam-drive-archive-v2.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/swlc-drive-archive/**'
      - '.github/workflows/swlc-sam-drive-archive-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-synthetic-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked archive crypto dependency
        run: python -m pip install 'cryptography==46.0.4'
      - name: Prove Python source is byte-for-byte Drive reviewed copy
        shell: bash
        run: |
          set -euo pipefail
          echo '090958b0c31e34fbfd28bf7d6722ec074ac34c947859591256647d696785a0c9  scripts/swlc-drive-archive/swlc_sam_drive_archive.py' | sha256sum --check
          echo '2bde7cc34f91fa184efae7b6895fae8b40600f9dc389c2fb4a60c20003050123  scripts/swlc-drive-archive/swlc_sam_archive_verify.py' | sha256sum --check
      - name: Exercise encryption, tamper, cutoff and no-delete invariants
        run: python -m unittest discover -s scripts/swlc-drive-archive -p 'test_swlc_sam_archive.py' -v
      - name: Fail-closed production boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = (Path('scripts/swlc-drive-archive/swlc_sam_drive_archive.py').read_text()
               + Path('scripts/swlc-drive-archive/swlc_sam_archive_verify.py').read_text())
          for forbidden in ('DELETE FROM public.jhadina_sam_versions',
                            'TRUNCATE public.jhadina_sam_versions',
                            'VACUUM FULL public.jhadina_sam_versions'):
              assert forbidden not in src, f'Forbidden production deletion operation: {forbidden}'
          assert 'REPEATABLE READ READ ONLY' in src
          assert 'isolatedPostgresRestoreVerified' in src
          print('No production mutation path; no restore certificate was issued')
          PY
      - name: Record non-production evidence
        if: always()
        run: |
          {
            echo "### SWLC archive V2"
            echo "- Tests use only synthetic CSV data and ephemeral filesystem."
            echo "- No production credential, original source rows, or Supabase write query."
            echo "- Drive source hashes pinned to reviewed Python files."
            echo "- Actual export and independent database restore: NOT COMPLETED."
            echo "- Source deletion and database space reclamation: NOT AUTHORIZED."
          } >> "$GITHUB_STEP_SUMMARY"
