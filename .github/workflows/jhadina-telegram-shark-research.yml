name: Jhadina Telegram SHARK Research Preview

# No secret access on PR, forks or push-time test jobs.
# The one-shot API read + private reply is only on manual main dispatch.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/jhadina-telegram-shark-research.yml
      - ops/telegram/bot_research_once.py
      - ops/telegram/bot_public_market_once.py
      - ops/telegram/test_bot_public_market_once.py
      - ops/telegram/test_bot_research_once.py
      - ops/telegram/bot_inbox_receipt.py
      - ops/meme/public_mint_dossier.py
      - ops/meme/test_public_mint_dossier.py
      - ops/meme/public_alpha_study.py
      - ops/meme/test_public_alpha_study.py
      - ops/meme/public_alpha_canary_once.py
      - ops/meme/test_public_alpha_canary_once.py
      - ops/meme/solana_risk_probe.py
      - ops/meme/token_authority_forensics.py
      - ops/meme/experiment_7day.py
  pull_request:
    paths:
      - .github/workflows/jhadina-telegram-shark-research.yml
      - ops/telegram/bot_research_once.py
      - ops/telegram/bot_public_market_once.py
      - ops/telegram/test_bot_public_market_once.py
      - ops/telegram/test_bot_research_once.py
      - ops/telegram/bot_inbox_receipt.py
      - ops/meme/public_mint_dossier.py
      - ops/meme/test_public_mint_dossier.py
      - ops/meme/public_alpha_study.py
      - ops/meme/test_public_alpha_study.py
      - ops/meme/public_alpha_canary_once.py
      - ops/meme/test_public_alpha_canary_once.py
      - ops/meme/solana_risk_probe.py
      - ops/meme/token_authority_forensics.py
      - ops/meme/experiment_7day.py
      - ops/telegram/README-SHARK-PREVIEW.md
  workflow_dispatch:
    inputs:
      research_tag:
        description: 'Send /research-digest JHADINA-SHARK-06 to @R2dice2bot before running'
        default: JHADINA-SHARK-06
        required: true
        type: string
      mode:
        description: 'preview = private Telegram candidate preview; public-market = owner-selected public Solana market report'
        type: choice
        options: [preview, public-market]
        default: preview
        required: true
      public_mint:
        description: 'Public Solana mint for public-market mode ONLY (never a private key or Telegram message)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # One Telegram getUpdates consumer across manual owner tests.
  group: jhadina-telegram-inbox-smoke
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify owner permission, claim parsing, and secret redaction
        run: python -m unittest discover -s ops/telegram -p 'test_bot_research_once.py' -v
      - name: Verify isolated owner-selected public-market private reply gates
        run: python -m unittest discover -s ops/telegram -p 'test_bot_public_market_once.py' -v
      - name: Verify independent public-mint market dossier and quarantine gates
        run: python -m unittest discover -s ops/meme -p 'test_public_mint_dossier.py' -v
      - name: Verify prospective price-only research and conservative censorship
        run: python -m unittest discover -s ops/meme -p 'test_public_alpha_study.py' -v
      - name: Verify opt-in public-market canary never promotes Telegram messages
        run: python -m unittest discover -s ops/meme -p 'test_public_alpha_canary_once.py' -v

  private-one-shot-research:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode != 'public-market'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
      TELEGRAM_RESEARCH_TAG: ${{ inputs.research_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Send private, unverified SHARK research preview to allowlisted owner
        run: python ops/telegram/bot_research_once.py

  private-public-market-report:
    # Owner must explicitly select public-market mode and submit a PUBLIC mint.
    # This branch has no Telegram-derived mint input, no AI/model, no storage.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'public-market'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
      TELEGRAM_RESEARCH_TAG: ${{ inputs.research_tag }}
      SHARK_PUBLIC_MINT: ${{ inputs.public_mint }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check explicitly selected PUBLIC mint and reply to verified owner only
        run: python ops/telegram/bot_public_market_once.py
