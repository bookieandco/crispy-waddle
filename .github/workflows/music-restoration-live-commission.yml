name: Music Restoration Live Commission

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - services/director-hunyuan/**
      - services/music-restoration-worker/**
      - scripts/director-hunyuan-runpod-bootstrap.sh
      - scripts/music-restoration-runpod-bootstrap.sh
      - scripts/music-restoration-runpod-commission.sh
      - scripts/music-restoration-runpod-remote-commission.py
      - apps/jhadina-web/src/lib/vercel-oidc-runtime.ts
      - apps/jhadina-web/src/lib/music/restoration-runtime-server.ts
      - apps/jhadina-web/src/lib/director-hunyuan-video-provider.ts
      - apps/jhadina-web/src/app/api/director/hunyuan/health/route.ts
      - .github/workflows/music-restoration-live-commission.yml

permissions:
  contents: read

concurrency:
  group: music-restoration-live-commission
  cancel-in-progress: false

jobs:
  commission:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY || secrets.runpod_key }}
      RUNPOD_POD_ID: xn73vwwekavcc6
      HUNYUAN_PROXY: https://xn73vwwekavcc6-8091.proxy.runpod.net
      JHADINA_PRODUCTION: https://crispy-waddle-jhadina-web.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Require RunPod API authority
        run: |
          if [[ -z "${RUNPOD_API_KEY:-}" ]]; then
            echo "MUSIC_RESTORATION_COMMISSION_RUNPOD_API_KEY_REQUIRED" >&2
            exit 1
          fi

      - name: Install RunPod CLI
        run: |
          curl -fsSL https://cli.runpod.net | sudo bash
          runpodctl version

      - name: Create transient SSH identity
        id: key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.runpod/ssh"
          KEY_NAME="jhadina-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          KEY_PATH="$HOME/.runpod/ssh/runpodctl-ssh-key"
          ssh-keygen -q -t rsa -b 2048 -m PEM -N '' -C "$KEY_NAME" -f "$KEY_PATH"
          runpodctl ssh add-key --key-file "$KEY_PATH.pub" >/dev/null
          FINGERPRINT="$(ssh-keygen -lf "$KEY_PATH.pub" -E sha256 | awk '{print $2}')"
          echo "name=$KEY_NAME" >> "$GITHUB_OUTPUT"
          echo "path=$KEY_PATH" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Ensure pod SSH and proxy ports
        id: pod
        shell: bash
        run: |
          set -euo pipefail

          details="$(runpodctl pod get "$RUNPOD_POD_ID" -o json)"
          printf '%s\n' "$details" | tee /tmp/runpod-pod-before.json

          mapfile -t ports < <(printf '%s' "$details" | jq -r '.ports[]?')
          ensure_port() {
            local wanted="$1"
            local current
            for current in "${ports[@]:-}"; do
              [[ "$current" == "$wanted" ]] && return 0
            done
            ports+=("$wanted")
          }

          ensure_port "22/tcp"
          ensure_port "8091/http"

          declared="$(printf '%s' "$details" | jq -r '[.ports[]?] | join(",")')"
          repaired="$(IFS=,; echo "${ports[*]}")"
          if [[ "$declared" != "$repaired" ]]; then
            echo "MUSIC_RESTORATION_REPAIR_POD_PORTS:from=$declared:to=$repaired"
            runpodctl pod update "$RUNPOD_POD_ID" --ports "$repaired" >/tmp/runpod-port-update.json
            cat /tmp/runpod-port-update.json
          fi

          runpodctl pod start "$RUNPOD_POD_ID" >/dev/null 2>&1 || true

          ready=false
          for attempt in $(seq 1 90); do
            details="$(runpodctl pod get "$RUNPOD_POD_ID" -o json || true)"
            runtime_status="$(printf '%s' "$details" | jq -r '.runtimeStatus // "unknown"' 2>/dev/null || echo unknown)"
            ssh_ip="$(printf '%s' "$details" | jq -r '.ssh.ip // empty' 2>/dev/null || true)"
            ssh_port="$(printf '%s' "$details" | jq -r '.ssh.port // empty' 2>/dev/null || true)"
            ssh_error="$(printf '%s' "$details" | jq -r '.ssh.error // empty' 2>/dev/null || true)"
            echo "MUSIC_RESTORATION_POD_READINESS:attempt=$attempt:runtime=$runtime_status:ssh_error=${ssh_error:-none}"

            if [[ "$runtime_status" == "running" && -n "$ssh_ip" && -n "$ssh_port" ]]; then
              if python3 - "$ssh_ip" "$ssh_port" <<'PY'
import socket,sys
host=sys.argv[1]
port=int(sys.argv[2])
try:
    with socket.create_connection((host,port),timeout=4) as sock:
        sock.settimeout(4)
        banner=sock.recv(128)
    raise SystemExit(0 if banner.startswith(b"SSH-") else 1)
except OSError:
    raise SystemExit(1)
PY
              then
                echo "ssh_ip=$ssh_ip" >> "$GITHUB_OUTPUT"
                echo "ssh_port=$ssh_port" >> "$GITHUB_OUTPUT"
                echo "MUSIC_RESTORATION_POD_SSH_READY:$ssh_ip:$ssh_port"
                ready=true
                break
              fi
            fi
            sleep 10
          done

          if [[ "$ready" != "true" ]]; then
            echo "MUSIC_RESTORATION_POD_SSH_TIMEOUT" >&2
            runpodctl pod get "$RUNPOD_POD_ID" -o json || true
            runpodctl pod logs "$RUNPOD_POD_ID" --since 30m --source both --max-wait 15s || true
            exit 1
          fi

      - name: Commission canonical pod
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "${{ steps.key.outputs.path }}" \
            -p "${{ steps.pod.outputs.ssh_port }}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            "root@${{ steps.pod.outputs.ssh_ip }}" \
            'DIRECTOR_SOURCE_REF=main python3 -' \
            < scripts/music-restoration-runpod-remote-commission.py

      - name: Dump pod diagnostics on commission failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo "MUSIC_RESTORATION_POD_DIAGNOSTICS"
          runpodctl pod get "$RUNPOD_POD_ID" -o json || true
          runpodctl pod logs "$RUNPOD_POD_ID" --since 30m --source both --max-wait 15s || true

      - name: Verify public RunPod proxy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 480); do
            h_code="$(curl -sS -o /tmp/hunyuan-live.json -w '%{http_code}' "$HUNYUAN_PROXY/health/live" || true)"
            m_code="$(curl -sS -o /tmp/music-live.json -w '%{http_code}' "$HUNYUAN_PROXY/music-restoration/health/live" || true)"
            if [[ "$h_code" == "200" && "$m_code" == "200" ]]; then
              echo "MUSIC_RESTORATION_PUBLIC_LIVE_READY"
              exit 0
            fi
            sleep 10
          done
          echo "MUSIC_RESTORATION_PUBLIC_LIVE_TIMEOUT" >&2
          exit 1

      - name: Verify Vercel production health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            h="$(curl -fsS "$JHADINA_PRODUCTION/api/director/hunyuan/health" || true)"
            m="$(curl -fsS "$JHADINA_PRODUCTION/api/music/restoration/health" || true)"
            h_configured="$(printf '%s' "$h" | jq -r '.configured // false' 2>/dev/null || echo false)"
            m_configured="$(printf '%s' "$m" | jq -r '.configured // false' 2>/dev/null || echo false)"
            m_ready="$(printf '%s' "$m" | jq -r '.productionReady // false' 2>/dev/null || echo false)"
            if [[ "$h_configured" == "true" && "$m_configured" == "true" && "$m_ready" == "true" ]]; then
              echo "MUSIC_RESTORATION_VERCEL_RUNTIME_READY"
              exit 0
            fi
            sleep 10
          done
          echo "MUSIC_RESTORATION_VERCEL_HEALTH_TIMEOUT" >&2
          exit 1

      - name: Remove transient SSH identity
        if: always()
        shell: bash
        run: |
          set +e
          if command -v runpodctl >/dev/null 2>&1 && [[ -n "${RUNPOD_API_KEY:-}" ]]; then
            runpodctl ssh remove-key --fingerprint "${{ steps.key.outputs.fingerprint }}" >/dev/null 2>&1 || true
          fi
          rm -rf "$HOME/.runpod/ssh"
