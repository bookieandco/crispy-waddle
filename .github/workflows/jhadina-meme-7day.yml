name: Jhadina SHARK seven-day memecoin observation (paper-only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/meme/experiment_7day.py'
      - 'ops/meme/test_experiment_7day.py'
      - 'ops/meme/test_protection_pipeline.py'
      - 'ops/meme/solana_risk_probe.py'
      - 'ops/meme/paper_shadow_lab.py'
      - 'ops/meme/shadow_sealer.py'
      - 'ops/meme/test_shadow_sealer.py'
      - 'ops/meme/private_report.py'
      - 'ops/meme/test_private_report.py'
      - 'ops/meme/test_watch_pool.py'
      - 'ops/meme/test_horizon_followups.py'
      - 'ops/meme/paper_admission_worker.py'
      - 'ops/meme/test_paper_admission_worker.py'
      - 'ops/meme/quote_probe.py'
      - 'ops/meme/test_quote_probe.py'
      - '.github/workflows/jhadina-meme-7day.yml'
  schedule:
    - cron: '13,43 * * * *'

# Runs ONLY trusted main-branch code. The separate branch is data storage only.
# Standard GitHub-hosted runner in this public repo; no secrets or billed APIs.
permissions:
  contents: write
  actions: write

concurrency:
  group: jhadina-meme-seven-day-20261013
  cancel-in-progress: false

jobs:
  observe:
    if: github.repository == 'bookieandco/crispy-waddle' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATA_BRANCH: experiments/meme-20261013-seven-day-001
      STATE_PATH: training/meme/experiments/2026-10-13-seven-day-001/state.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify research-only contract with no network calls
        run: python -m unittest discover -s ops/meme -p 'test_*.py' -v
      - name: Load most recent data ledger from separate branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${DATA_BRANCH}:refs/remotes/origin/${DATA_BRANCH}"
          mkdir -p "$(dirname "$STATE_PATH")"
          if git cat-file -e "origin/${DATA_BRANCH}:${STATE_PATH}" 2>/dev/null; then
            git show "origin/${DATA_BRANCH}:${STATE_PATH}" > "$STATE_PATH"
          fi
          python ops/meme/experiment_7day.py --mode audit --state "$STATE_PATH"
      - name: Poll public DEX observations (zero wallet access)
        shell: bash
        run: |
          set -euo pipefail
          python ops/meme/experiment_7day.py --mode live --state "$STATE_PATH"
          python ops/meme/experiment_7day.py --mode audit --state "$STATE_PATH"
      - name: Add one read-only Solana mint-provenance receipt, fail closed
        shell: bash
        run: |
          set -euo pipefail
          python ops/meme/solana_risk_probe.py --mode probe --state "$STATE_PATH"
          python ops/meme/experiment_7day.py --mode audit --state "$STATE_PATH"
      - name: Seal prospective NO_TRADE and later Shadow grades
        shell: bash
        run: |
          set -euo pipefail
          python ops/meme/shadow_sealer.py --state "$STATE_PATH"
          python ops/meme/experiment_7day.py --mode audit --state "$STATE_PATH"
      - name: Fail-closed SHARK to Money paper-admission evidence
        shell: bash
        run: |
          set -euo pipefail
          python ops/meme/paper_admission_worker.py --state "$STATE_PATH"
          python ops/meme/experiment_7day.py --mode audit --state "$STATE_PATH"
      - name: Collect one keyless read-only Jupiter indicative route diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python ops/meme/quote_probe.py --state "$STATE_PATH"
          python ops/meme/experiment_7day.py --mode audit --state "$STATE_PATH"
      - name: Render public research-only iPhone dashboard
        shell: bash
        env:
          REPORT_PATH: training/meme/experiments/2026-10-13-seven-day-001/report.md
        run: |
          set -euo pipefail
          python ops/meme/solana_risk_probe.py --mode report --state "$STATE_PATH" --report "$REPORT_PATH"
      - name: Append data-ledger update only; never execute data-branch scripts
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/meme-experiment-state "origin/${DATA_BRANCH}"
          install -D -m 644 "$STATE_PATH" "/tmp/meme-experiment-state/${STATE_PATH}"
          install -D -m 644 training/meme/experiments/2026-10-13-seven-day-001/report.md /tmp/meme-experiment-state/training/meme/experiments/2026-10-13-seven-day-001/report.md
          git -C /tmp/meme-experiment-state config user.name 'jhadina-paper-research[bot]'
          git -C /tmp/meme-experiment-state config user.email 'jhadina-paper-research@users.noreply.github.com'
          git -C /tmp/meme-experiment-state add -- "$STATE_PATH" training/meme/experiments/2026-10-13-seven-day-001/report.md
          if ! git -C /tmp/meme-experiment-state diff --cached --quiet; then
            git -C /tmp/meme-experiment-state commit -m 'chore(shark): append sampled paper observation receipt'
            git -C /tmp/meme-experiment-state push origin "HEAD:refs/heads/${DATA_BRANCH}"
          else
            echo 'No state changes'
          fi
      - name: Optional owner-only private research digest
        if: github.event_name == 'schedule'
        shell: bash
        env:
          ENABLE_SHARK_MEME_DIGEST: ${{ vars.ENABLE_SHARK_MEME_DIGEST || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
        run: |
          set -euo pipefail
          python ops/meme/private_report.py --mode send --state "$STATE_PATH"
      - name: Check experiment cutoff
        id: cutoff
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt
          print('expired=' + ('true' if dt.datetime.now(dt.timezone.utc) >= dt.datetime(2026,10,20,22,50,tzinfo=dt.timezone.utc) else 'false'))
          PY
      - name: Disable this schedule after final ledger receipt
        if: steps.cutoff.outputs.expired == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/jhadina-meme-7day.yml/disable"
