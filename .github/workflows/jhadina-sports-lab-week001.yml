name: Jhadina Sports Lab Week001 offline audit (source access paused)
# Source-rights hold: NO schedule, collector, external feed request, or Git publication.
# This file intentionally does not accept an override for live provider polling.
on:
  push:
    paths:
      - '.github/workflows/jhadina-sports-lab-week001.yml'
      - 'training/sports/experiments/2026-10-13-week-001/**'
  pull_request:
    paths:
      - '.github/workflows/jhadina-sports-lab-week001.yml'
      - 'training/sports/experiments/2026-10-13-week-001/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jhadina-sports-week001-offline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-review:
    if: github.repository == 'bookieandco/crispy-waddle'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify paper-only governance and historical receipt tests
        run: node --test training/sports/experiments/2026-10-13-week-001/*.test.mjs
      - name: Recalculate historical unofficial scoreboard offline
        run: node training/sports/experiments/2026-10-13-week-001/scoreboard.mjs
      - name: Reconcile missing and conflicting unofficial results offline
        run: node training/sports/experiments/2026-10-13-week-001/offline-review.mjs
      - name: Preserve review-only artifact for owner
        uses: actions/upload-artifact@v4
        with:
          name: sports-week001-offline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sports-lab-output/scoreboard.json
            sports-lab-output/scoreboard.md
            sports-lab-output/offline-review.json
            sports-lab-output/offline-review.md
          if-no-files-found: error
          retention-days: 7
