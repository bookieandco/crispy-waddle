name: Director RunPod Live Commission

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - services/director-hunyuan/**
      - services/director-speaker-qc/**
      - scripts/director-hunyuan-runpod-bootstrap.sh
      - scripts/director-hunyuan-source-pins.sh
      - scripts/director-hunyuan-source-pins-contract.py
      - scripts/director-hunyuan-runpod-reconcile.sh
      - scripts/director-speaker-qc-runpod-bootstrap.sh
      - scripts/director-runpod-live-commission.py
      - apps/jhadina-web/src/app/api/director/hunyuan/**
      - apps/jhadina-web/src/app/api/director/bonez/quality-preflight/**
      - .github/workflows/director-runpod-live-commission.yml

permissions:
  contents: read

concurrency:
  group: jhadina-canonical-runpod-live-commission
  cancel-in-progress: false

jobs:
  commission:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip-director-live-commission]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY || secrets.runpod_key }}
      RUNPOD_POD_ID: xn73vwwekavcc6
      HUNYUAN_PROXY: https://xn73vwwekavcc6-8091.proxy.runpod.net
      SPEAKER_QC_PROXY: https://xn73vwwekavcc6-8092.proxy.runpod.net
      JHADINA_PRODUCTION: https://crispy-waddle-jhadina-web.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Require RunPod API authority
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RUNPOD_API_KEY:-}" ]]; then
            echo "DIRECTOR_RUNPOD_API_KEY_REQUIRED" >&2
            exit 1
          fi

      - name: Install RunPod CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.runpod.net | sudo bash
          runpodctl version
          if ! runpodctl exec python --help 2>&1 | grep -q -- '--pod_id'; then
            echo "DIRECTOR_RUNPOD_EXEC_POD_ID_FLAG_UNAVAILABLE" >&2
            exit 1
          fi

      - name: Create transient SSH identity
        id: key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.runpod/ssh"
          KEY_NAME="jhadina-director-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          KEY_PATH="$HOME/.runpod/ssh/runpodctl-ssh-key"
          ssh-keygen -q -t rsa -b 2048 -m PEM -N '' -C "$KEY_NAME" -f "$KEY_PATH"
          runpodctl ssh add-key --key-file "$KEY_PATH.pub" >/dev/null
          FINGERPRINT="$(ssh-keygen -lf "$KEY_PATH.pub" -E sha256 | awk '{print $2}')"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Ensure canonical Director pod ports and start
        shell: bash
        run: |
          set -euo pipefail
          details="$(runpodctl pod get "$RUNPOD_POD_ID" -o json)"
          mapfile -t ports < <(printf '%s' "$details" | jq -r '.ports[]?')
          ensure_port() {
            local wanted="$1"
            local current
            for current in "${ports[@]:-}"; do
              [[ "$current" == "$wanted" ]] && return 0
            done
            ports+=("$wanted")
          }
          ensure_port "22/tcp"
          ensure_port "8091/http"
          ensure_port "8092/http"
          declared="$(printf '%s' "$details" | jq -r '[.ports[]?] | join(",")')"
          repaired="$(IFS=,; echo "${ports[*]}")"
          if [[ "$declared" != "$repaired" ]]; then
            echo "DIRECTOR_RUNPOD_REPAIR_PORTS:from=$declared:to=$repaired"
            runpodctl pod update "$RUNPOD_POD_ID" --ports "$repaired" >/dev/null
          fi
          runpodctl pod start "$RUNPOD_POD_ID" >/dev/null 2>&1 || true

      - name: Require GPU and SSH allocation
        shell: bash
        run: |
          set -euo pipefail

          inspect_pod() {
            runpodctl pod get "$RUNPOD_POD_ID" -o json > /tmp/director-pod-allocation.json
            gpu="$(jq -r '.gpuCount // 0' /tmp/director-pod-allocation.json)"
            runtime="$(jq -r '.runtimeStatus // "unknown"' /tmp/director-pod-allocation.json)"
            ssh_error="$(jq -r '.ssh.error // ""' /tmp/director-pod-allocation.json)"
          }

          for recovery in $(seq 1 4); do
            inspect_pod
            if [[ "$gpu" -ge 1 ]]; then
              for attempt in $(seq 1 24); do
                inspect_pod
                if [[ "$gpu" -ge 1 && "$runtime" == "running" && -z "$ssh_error" ]]; then
                  echo "DIRECTOR_RUNPOD_GPU_SSH_READY"
                  exit 0
                fi
                sleep 5
              done
              echo "DIRECTOR_RUNPOD_GPU_PRESENT_SSH_WARMUP_RETRY:$recovery"
            else
              echo "DIRECTOR_RUNPOD_ZERO_GPU_RETRY:$recovery"
            fi

            # A stopped zero-GPU Pod stays bound to its original host and preserves
            # its local disk. Retrying start is the only non-destructive way to
            # reclaim that host's GPU when capacity becomes free.
            runpodctl pod stop "$RUNPOD_POD_ID" >/dev/null 2>&1 || true
            sleep 15
            runpodctl pod start "$RUNPOD_POD_ID" >/dev/null 2>&1 || true
            sleep 30
          done

          inspect_pod
          if [[ "$gpu" -lt 1 ]]; then
            echo "DIRECTOR_RUNPOD_ZERO_GPU_CAPACITY_BLOCKED" >&2
          else
            echo "DIRECTOR_RUNPOD_SSH_MAPPING_NOT_READY" >&2
          fi
          jq '{id,name,desiredStatus,runtimeStatus,gpuCount,ports,ssh}' /tmp/director-pod-allocation.json
          exit 1

      - name: Reconcile Director runtime
        shell: bash
        run: |
          set -euo pipefail
          if timeout 60s runpodctl exec python scripts/director-runpod-live-commission.py --pod_id "$RUNPOD_POD_ID"; then
            echo "DIRECTOR_RUNPOD_REMOTE_COMMISSION_ACCEPTED"
            exit 0
          fi
          echo "DIRECTOR_RUNPOD_REMOTE_EXEC_RETRY_AFTER_RESTART"
          runpodctl pod restart "$RUNPOD_POD_ID" >/dev/null
          sleep 30
          for attempt in $(seq 1 12); do
            echo "DIRECTOR_RUNPOD_REMOTE_EXEC_WARMUP_ATTEMPT:$attempt"
            if timeout 60s runpodctl exec python scripts/director-runpod-live-commission.py --pod_id "$RUNPOD_POD_ID"; then
              echo "DIRECTOR_RUNPOD_REMOTE_COMMISSION_ACCEPTED"
              exit 0
            fi
            sleep 15
          done
          echo "DIRECTOR_RUNPOD_REMOTE_EXEC_WARMUP_EXHAUSTED" >&2
          exit 1

      - name: Verify Hunyuan production readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 480); do
            live_code="$(curl -sS -o /tmp/director-hunyuan-live.json -w '%{http_code}' "$HUNYUAN_PROXY/health/live" || true)"
            health_code="$(curl -sS -o /tmp/director-hunyuan-health.json -w '%{http_code}' "$HUNYUAN_PROXY/health" || true)"
            ready="$(jq -r '.productionReady // false' /tmp/director-hunyuan-health.json 2>/dev/null || echo false)"
            if [[ "$live_code" == "200" && "$health_code" == "200" && "$ready" == "true" ]]; then
              echo "DIRECTOR_HUNYUAN_PUBLIC_PRODUCTION_READY"
              exit 0
            fi
            sleep 10
          done
          echo "DIRECTOR_HUNYUAN_PUBLIC_PRODUCTION_TIMEOUT" >&2
          cat /tmp/director-hunyuan-health.json 2>/dev/null || true
          exit 1

      - name: Probe optional speaker-QC runtime
        shell: bash
        run: |
          set -euo pipefail
          live_code="$(curl -sS -o /tmp/director-speaker-qc-live.json -w '%{http_code}' "$SPEAKER_QC_PROXY/health/live" || true)"
          health_code="$(curl -sS -o /tmp/director-speaker-qc-health.json -w '%{http_code}' "$SPEAKER_QC_PROXY/health" || true)"
          ready="$(jq -r '.productionReady // false' /tmp/director-speaker-qc-health.json 2>/dev/null || echo false)"
          if [[ "$live_code" == "200" && "$health_code" == "200" && "$ready" == "true" ]]; then
            echo "DIRECTOR_SPEAKER_QC_PUBLIC_PRODUCTION_READY"
          else
            echo "::warning::DIRECTOR_SPEAKER_QC_NOT_READY"
          fi

      - name: Capture production Director health
        if: always()
        shell: bash
        run: |
          set +e
          curl -sS "$JHADINA_PRODUCTION/api/director/hunyuan/health" -o /tmp/director-vercel-hunyuan.json
          curl -sS "$JHADINA_PRODUCTION/api/director/bonez/quality-preflight" -o /tmp/director-bonez-preflight.json
          echo "Vercel Hunyuan:"
          jq '{configured,status,productionReady,generationEnabled,error}' /tmp/director-vercel-hunyuan.json 2>/dev/null || true
          echo "Bonez preflight blockers:"
          jq '{stages: (.stages | with_entries(.value |= {passed,runnable,blockers}))}' /tmp/director-bonez-preflight.json 2>/dev/null || true

      - name: Capture replacement readiness
        if: always()
        shell: bash
        env:
          GITHUB_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_DIRECTOR_HUNYUAN_WORKER_TOKEN: ${{ secrets.DIRECTOR_HUNYUAN_WORKER_TOKEN }}
          GITHUB_DIRECTOR_SPEAKER_QC_TOKEN: ${{ secrets.DIRECTOR_SPEAKER_QC_TOKEN }}
          GITHUB_MUSIC_RESTORATION_WORKER_TOKEN: ${{ secrets.MUSIC_RESTORATION_WORKER_TOKEN }}
          GITHUB_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [[ ! -s /tmp/director-pod-allocation.json ]]; then
            runpodctl pod get "$RUNPOD_POD_ID" -o json > /tmp/director-pod-allocation.json
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          pod=json.loads(Path("/tmp/director-pod-allocation.json").read_text())
          raw=pod.get("env") or {}
          if isinstance(raw,dict):
              pod_env=raw
          elif isinstance(raw,list):
              pod_env={}
              for item in raw:
                  if isinstance(item,dict):
                      key=item.get("key") or item.get("name")
                      if key:
                          pod_env[str(key)]=item.get("value")
          else:
              pod_env={}

          required=[
              "DIRECTOR_HUNYUAN_WORKER_TOKEN",
              "DIRECTOR_HUNYUAN_LICENSE_ACKNOWLEDGED",
              "DIRECTOR_HUNYUAN_TERRITORY_ACKNOWLEDGED",
              "DIRECTOR_SPEAKER_QC_TOKEN",
              "MUSIC_RESTORATION_WORKER_TOKEN",
          ]
          github_vars={
              "VERCEL_TOKEN":"GITHUB_VERCEL_TOKEN",
              "DIRECTOR_HUNYUAN_WORKER_TOKEN":"GITHUB_DIRECTOR_HUNYUAN_WORKER_TOKEN",
              "DIRECTOR_SPEAKER_QC_TOKEN":"GITHUB_DIRECTOR_SPEAKER_QC_TOKEN",
              "MUSIC_RESTORATION_WORKER_TOKEN":"GITHUB_MUSIC_RESTORATION_WORKER_TOKEN",
              "SUPABASE_SERVICE_ROLE_KEY":"GITHUB_SUPABASE_SERVICE_ROLE_KEY",
          }
          safe={
              "id":pod.get("id"),
              "name":pod.get("name"),
              "desiredStatus":pod.get("desiredStatus"),
              "runtimeStatus":pod.get("runtimeStatus"),
              "gpuCount":int(pod.get("gpuCount") or 0),
              "ports":pod.get("ports"),
              "ssh":pod.get("ssh"),
          }
          Path("/tmp/director-pod-allocation-safe.json").write_text(json.dumps(safe,sort_keys=True,indent=2))
          report={
              "podId":pod.get("id"),
              "gpuCount":int(pod.get("gpuCount") or 0),
              "runtimeStatus":pod.get("runtimeStatus"),
              "oldPodEnvPresent":{key:bool(str(pod_env.get(key) or "").strip()) for key in required},
              "githubSecretPresent":{key:bool(os.getenv(env_name,"").strip()) for key,env_name in github_vars.items()},
          }
          Path("/tmp/director-runpod-replacement-readiness.json").write_text(json.dumps(report,sort_keys=True,indent=2))
          print(json.dumps(report,sort_keys=True))
          PY

      - name: Upload Director live receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: director-runpod-live-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            /tmp/director-hunyuan-live.json
            /tmp/director-hunyuan-health.json
            /tmp/director-speaker-qc-live.json
            /tmp/director-speaker-qc-health.json
            /tmp/director-vercel-hunyuan.json
            /tmp/director-bonez-preflight.json
            /tmp/director-pod-allocation-safe.json
            /tmp/director-runpod-replacement-readiness.json
          retention-days: 14

      - name: Remove transient SSH identity
        if: always()
        shell: bash
        run: |
          set +e
          if command -v runpodctl >/dev/null 2>&1 && [[ -n "${RUNPOD_API_KEY:-}" && -n "${{ steps.key.outputs.fingerprint }}" ]]; then
            runpodctl ssh remove-key --fingerprint "${{ steps.key.outputs.fingerprint }}" >/dev/null 2>&1 || true
          fi
          rm -rf "$HOME/.runpod/ssh"
