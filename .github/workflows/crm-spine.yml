name: CRM Spine

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/relationship-core/**'
      - 'supabase/migrations/*crm_spine*'
      - 'docs/architecture/CRM-SPINE-FINAL-*'
      - '.github/workflows/crm-spine.yml'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'packages/relationship-core/**'
      - 'supabase/migrations/*crm_spine*'
      - 'docs/architecture/CRM-SPINE-FINAL-*'
      - '.github/workflows/crm-spine.yml'
      - 'pnpm-lock.yaml'

jobs:
  verify:
    name: Relationship Core type-check and certification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Type-check Relationship Core
        run: pnpm --filter @jhadina/relationship-core type-check
      - name: Certify CRM Spine
        run: pnpm --filter @jhadina/relationship-core test
