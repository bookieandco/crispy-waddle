name: JhadinaTV PR

on:
  pull_request:
    paths:
      - 'packages/jhadina-tv-core/**'
      - 'apps/jhadina-web/pages/jhadinatv/**'
      - 'apps/jhadina-web/pages/api/jhadinatv/**'
      - 'apps/jhadina-web/lib/jhadinatv/**'
      - 'apps/jhadina-web/src/components/jhadinaTv/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/jhadinatv-pr.yml'

permissions:
  contents: read

jobs:
  jhadinatv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Type-check JhadinaTV core
        run: |
          set -o pipefail
          pnpm --filter @jhadina/tv-core type-check 2>&1 | tee /tmp/jhadinatv-typecheck.log
      - name: Test JhadinaTV core
        run: |
          set -o pipefail
          pnpm --filter @jhadina/tv-core test 2>&1 | tee /tmp/jhadinatv-test.log
      - name: Test JhadinaTV secure web boundary
        run: |
          set -o pipefail
          pnpm --filter @jhadina/jhadina-web exec vitest run \
            lib/jhadinatv/stream-capability.test.ts \
            lib/jhadinatv/hls-proxy.test.ts \
            lib/jhadinatv/jellyfin-access.test.ts \
            lib/jhadinatv/receiver-capability.test.ts \
            pages/api/jhadinatv/sources.test.ts \
            pages/api/jhadinatv/receivers.test.ts \
            pages/api/jhadinatv/privacy.test.ts \
            pages/api/jhadinatv/title.test.ts \
            pages/api/jhadinatv/jellyfin/stream.test.ts \
            pages/api/jhadinatv/world/channels.test.ts 2>&1 | tee /tmp/jhadinatv-web-security-test.log
      - name: Type-check JhadinaTV web integration
        run: |
          set -o pipefail
          pnpm --filter @jhadina/jhadina-web type-check 2>&1 | tee /tmp/jhadinatv-web-typecheck.log
      - name: Type-check JhadinaTV Pages Router and protected provider
        run: |
          set -o pipefail
          pnpm --filter @jhadina/jhadina-web exec tsc -p tsconfig.jhadinatv.json --noEmit 2>&1 | tee /tmp/jhadinatv-pages-typecheck.log
      - name: Upload JhadinaTV diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jhadinatv-diagnostics
          path: |
            /tmp/jhadinatv-typecheck.log
            /tmp/jhadinatv-test.log
            /tmp/jhadinatv-web-typecheck.log
            /tmp/jhadinatv-web-security-test.log
            /tmp/jhadinatv-pages-typecheck.log
          if-no-files-found: ignore
