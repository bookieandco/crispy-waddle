name: SH Dropshipping Certification

on:
  push:
    paths:
      - "packages/commerce-adapters/**"
      - "packages/jhadina-action-core/**"
      - "packages/opportunity-core/**"
      - "packages/order-fulfillment-core/**"
      - "apps/jhadina-web/src/lib/commerce/**"
      - "apps/jhadina-web/tsconfig.sh-dropshipping.json"
      - "docs/SH_*"
      - "supabase/migrations/*supplier_paid_order*.sql"
      - "supabase/migrations/*supliful_shopify*.sql"
      - "supabase/migrations/*supplier_paid_order*.sql"
      - "supabase/migrations/*supliful_shopify*.sql"
      - ".github/workflows/sh-dropshipping-certification.yml"
  pull_request:
    paths:
      - "packages/commerce-adapters/**"
      - "packages/jhadina-action-core/**"
      - "packages/opportunity-core/**"
      - "packages/order-fulfillment-core/**"
      - "apps/jhadina-web/src/lib/commerce/**"
      - "apps/jhadina-web/tsconfig.sh-dropshipping.json"
      - "docs/SH_*"
      - ".github/workflows/sh-dropshipping-certification.yml"

permissions:
  contents: read

jobs:
  certify:
    name: SH-RECON.10
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Type-check Action Core
        run: pnpm --filter @jhadina/action-core type-check

      - name: Test Action Core approval path
        run: pnpm --filter @jhadina/action-core test

      - name: Type-check Commerce adapters
        run: pnpm --filter @jhadina/commerce-adapters type-check

      - name: Type-check Opportunity Core
        run: pnpm --filter @jhadina/opportunity-core type-check

      - name: Type-check Order Fulfillment Core
        run: pnpm --filter @jhadina/order-fulfillment-core type-check

      - name: Test Opportunity dropshipping handoff
        run: pnpm --filter @jhadina/opportunity-core exec tsx src/domain/handoff-contracts.test.ts

      - name: Test governed dropshipping Commerce path
        working-directory: apps/jhadina-web
        run: |
          pnpm exec vitest run \
            src/lib/commerce/supplier-contracts.test.ts \
            src/lib/commerce/governed-supplier-procurement.test.ts \
            src/lib/commerce/commerce-proposal-lifecycle.test.ts \
            src/lib/commerce/supplier-discovery-reference.test.ts \
            src/lib/commerce/shipengine-parcel-shipping.test.ts \
            src/lib/commerce/supliful-shopify-procurement.test.ts

      - name: Type-check governed dropshipping web boundary
        run: pnpm --filter @jhadina/jhadina-web exec tsc --noEmit -p tsconfig.sh-dropshipping.json


  supliful-persistence:
    name: Supliful private vaults
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jhadina
          POSTGRES_PASSWORD: jhadina
          POSTGRES_DB: jhadina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jhadina -d jhadina_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://jhadina:jhadina@localhost:5432/jhadina_test
      TEST_USER_ID: 11111111-1111-4111-8111-111111111111
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap Supabase roles
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=jhadina psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create schema auth;
          create table auth.users(id uuid primary key);
          insert into auth.users(id) values ('11111111-1111-4111-8111-111111111111');
          SQL

      - name: Apply Supliful private-store migrations
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=jhadina psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261003234500_supplier_paid_order_vault.sql
          PGPASSWORD=jhadina psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261003235000_supliful_shopify_product_bindings.sql

      - name: Prove service-only PII and binding access
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=jhadina psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.jhadina_supplier_paid_orders(
            user_id,internal_order_id,internal_order_item_id,payment_status,
            customer_email,customer_phone,shipping_address,paid_at,payment_evidence_refs
          ) values (
            '11111111-1111-4111-8111-111111111111',
            'order-1','item-1','paid','buyer@example.com',null,
            '{"address1":"1 Test Way","city":"Los Angeles","countryCode":"US","zip":"90001"}'::jsonb,
            '2026-10-03T22:55:00Z',
            '["payment:stripe:1"]'::jsonb
          );

          insert into public.jhadina_supliful_shopify_product_bindings(
            user_id,internal_product_id,internal_variant_id,shopify_product_gid,
            shopify_variant_gid,fulfillment_service_name,evidence_refs,observed_at
          ) values (
            '11111111-1111-4111-8111-111111111111',
            'product-1','inventory-1','gid://shopify/Product/123',
            'gid://shopify/ProductVariant/456','Supliful Fulfillment',
            '["shopify:fulfillment-service:observed"]'::jsonb,
            '2026-10-03T22:50:00Z'
          );

          set role service_role;
          select count(*) from public.jhadina_supplier_paid_orders;
          select count(*) from public.jhadina_supliful_shopify_product_bindings;
          reset role;

          do $$
          begin
            if has_table_privilege('anon','public.jhadina_supplier_paid_orders','select')
              or has_table_privilege('authenticated','public.jhadina_supplier_paid_orders','select')
              or has_table_privilege('anon','public.jhadina_supliful_shopify_product_bindings','select')
              or has_table_privilege('authenticated','public.jhadina_supliful_shopify_product_bindings','select')
            then
              raise exception 'browser roles must not read Supliful private stores';
            end if;
          end $$;
          SQL
