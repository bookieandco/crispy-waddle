name: Refresh Music OIDC Lockfile

on:
  push:
    branches:
      - agent/music-restore-runtime-commission
    paths:
      - apps/jhadina-web/package.json
      - .github/workflows/refresh-music-oidc-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/music-restore-runtime-commission
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "LOCKFILE_ALREADY_CURRENT"
            exit 0
          fi
          git config user.name "jhadina-lock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "MUSIC-RESTORE-CONVERGENCE.0 refresh OIDC lockfile"
          git push origin HEAD:agent/music-restore-runtime-commission
