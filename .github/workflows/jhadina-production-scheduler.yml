name: Jhadina Production Scheduler

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/jhadina-production-scheduler.yml"
      - "apps/jhadina-web/src/lib/internal-scheduler-auth.ts"
      - "apps/jhadina-web/src/app/api/internal/scheduler/health/**"
      - "apps/jhadina-web/src/app/api/internal/opportunities/public/**"
      - "apps/jhadina-web/src/app/api/internal/opportunities/government/**"
      - "apps/jhadina-web/src/app/api/internal/opportunities/venture/**"
      - "apps/jhadina-web/src/lib/opportunities/venture-*.ts"
      - "supabase/migrations/*venture_live_runtime.sql"
      - "supabase/migrations/*venture_discovery_loop.sql"
      - "apps/jhadina-web/src/app/api/internal/money/paper-autopilot/**"
      - "apps/jhadina-web/src/lib/money/paper-*.ts"
      - "supabase/migrations/*money_paper_learning_loop.sql"
      - "apps/jhadina-web/src/app/api/opportunities/public/**"
      - "apps/jhadina-web/src/lib/opportunities/public-*.ts"
      - "apps/jhadina-web/src/lib/opportunities/government-*.ts"
      - "packages/opportunity-core/src/domain/public-*.ts"
      - "supabase/migrations/*public_opportunity_discovery.sql"
      - "apps/jhadina-web/src/lib/storage/**"
      - "apps/jhadina-web/src/lib/supabase/service-role.ts"
      - "apps/jhadina-web/src/lib/supabase/middleware.ts"
      - "apps/jhadina-web/src/lib/routes/handlers.ts"
      - "supabase/functions/jhadina-memory-gateway/**"
      - "supabase/functions/jhadina-service-proxy/**"
      - "vercel.json"
      - "apps/jhadina-web/vercel.json"
  schedule:
    - cron: "0 * * * *"
    - cron: "5 * * * *"
    - cron: "10 * * * *"
    - cron: "30 * * * *"
    - cron: "15 */4 * * *"
    - cron: "25 3 * * *"
    - cron: "40 3 * * *"
    - cron: "10 4 * * *"
    - cron: "45 * * * *"
    - cron: "55 * * * *"
    - cron: "15 22 * * 1-5"
    - cron: "20 */4 * * *"
    - cron: "27 */4 * * *"
    - cron: "32 */4 * * *"
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Production worker to invoke"
        required: true
        type: choice
        options:
          - shark-launch-outcomes
          - shark-historical-observations
          - local-gov-reference-scan
          - local-gov-jurisdiction-refresh
          - local-gov-source-discovery
          - local-gov-adapter-shadow
          - local-gov-award-prime-miner
          - local-gov-work-package-providers
          - local-gov-prime-coverage
          - government-demand-radar
          - venture-market-scout
          - venture-candidate-synthesis
          - venture-candidate-adoption
          - venture-supervisor
          - money-paper-autopilot

permissions:
  contents: read
  id-token: write

concurrency:
  group: jhadina-production-scheduler-${{ github.event_name }}-${{ github.event.schedule || inputs.job || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  admission-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for exact production durable health
        env:
          ORIGIN: ${{ vars.JHADINA_PRODUCTION_ORIGIN || 'https://crispy-waddle-jhadina-web.vercel.app' }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="${ORIGIN%/}/api/health"

          for attempt in $(seq 1 50); do
            response_file="$(mktemp)"
            status="$(curl --silent --show-error \
              --connect-timeout 20 \
              --max-time 30 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header "Accept: application/json" \
              --header "User-Agent: jhadina-production-admission/${GITHUB_RUN_ID}" \
              "$url" || true)"

            success="$(jq -r '.success // false' "$response_file" 2>/dev/null || echo false)"
            deployed_sha="$(jq -r '.commitSha // empty' "$response_file" 2>/dev/null || true)"
            environment="$(jq -r '.environment // empty' "$response_file" 2>/dev/null || true)"
            durable_memory="$(jq -r '.durableMemory // empty' "$response_file" 2>/dev/null || true)"
            echo "attempt=${attempt} status=${status} environment=${environment} deployed_sha=${deployed_sha} durable_memory=${durable_memory}"

            if [[ "$status" == "200" && "$success" == "true" && "$environment" == "production" && "$deployed_sha" == "$EXPECTED_SHA" && "$durable_memory" == "ready" ]]; then
              echo "Exact production deployment and durable Memory health admitted: $EXPECTED_SHA"
              exit 0
            fi

            sleep 15
          done

          echo "Production never reported exact healthy SHA $EXPECTED_SHA within the admission window" >&2
          exit 1

      - name: Request fresh scoped GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('jhadina-production-scheduler')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Verify protected scheduler identity
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          ORIGIN: ${{ vars.JHADINA_PRODUCTION_ORIGIN || 'https://crispy-waddle-jhadina-web.vercel.app' }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --connect-timeout 20 \
            --max-time 30 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header "User-Agent: jhadina-production-admission/${GITHUB_RUN_ID}" \
            "${ORIGIN%/}/api/internal/scheduler/health")"

          deployed_sha="$(jq -r '.commitSha // empty' "$response_file" 2>/dev/null || true)"
          environment="$(jq -r '.environment // empty' "$response_file" 2>/dev/null || true)"
          echo "protected_status=${status} environment=${environment} deployed_sha=${deployed_sha}"

          [[ "$status" == "200" ]]
          [[ "$environment" == "production" ]]
          [[ "$deployed_sha" == "$EXPECTED_SHA" ]]

  invoke:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve protected production worker
        id: target
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
        run: |
          set -euo pipefail

          case "${INPUT_JOB:-}:${SCHEDULE:-}" in
            shark-launch-outcomes:*|*:0\ \*\ \*\ \*\ \*)
              job="shark-launch-outcomes"
              path="/api/internal/shark/launch-outcomes"
              ;;
            shark-historical-observations:*|*:30\ \*\ \*\ \*\ \*)
              job="shark-historical-observations"
              path="/api/internal/shark/historical-observations"
              ;;
            local-gov-reference-scan:*|*:15\ \*/4\ \*\ \*\ \*)
              job="local-gov-reference-scan"
              path="/api/internal/opportunities/public/scan"
              ;;
            local-gov-jurisdiction-refresh:*|*:25\ 3\ \*\ \*\ \*)
              job="local-gov-jurisdiction-refresh"
              path="/api/internal/opportunities/public/jurisdictions"
              ;;
            local-gov-source-discovery:*|*:45\ \*\ \*\ \*\ \*)
              job="local-gov-source-discovery"
              path="/api/internal/opportunities/public/source-discovery"
              ;;
            local-gov-adapter-shadow:*|*:55\ \*\ \*\ \*\ \*)
              job="local-gov-adapter-shadow"
              path="/api/internal/opportunities/public/adapter-shadow"
              ;;
            local-gov-award-prime-miner:*|*:5\ \*\ \*\ \*\ \*)
              job="local-gov-award-prime-miner"
              path="/api/internal/opportunities/public/awards"
              ;;
            local-gov-work-package-providers:*|*:10\ \*\ \*\ \*\ \*)
              job="local-gov-work-package-providers"
              path="/api/internal/opportunities/public/work-package-providers"
              ;;
            local-gov-prime-coverage:*|*:40\ 3\ \*\ \*\ \*)
              job="local-gov-prime-coverage"
              path="/api/internal/opportunities/public/prime-coverage"
              ;;
            government-demand-radar:*|*:10\ 4\ \*\ \*\ \*)
              job="government-demand-radar"
              path="/api/internal/opportunities/government/demand-radar"
              ;;
            venture-market-scout:*|*:20\ \*/4\ \*\ \*\ \*)
              job="venture-market-scout"
              path="/api/internal/opportunities/venture/scout"
              ;;
            venture-candidate-synthesis:*|*:27\ \*/4\ \*\ \*\ \*)
              job="venture-candidate-synthesis"
              path="/api/internal/opportunities/venture/candidates"
              ;;
            venture-candidate-adoption:*|*:32\ \*/4\ \*\ \*\ \*)
              job="venture-candidate-adoption"
              path="/api/internal/opportunities/venture/adopt"
              ;;
            venture-supervisor:*|*:35\ \*\ \*\ \*\ \*)
              job="venture-supervisor"
              path="/api/internal/opportunities/venture/supervisor"
              ;;
            money-paper-autopilot:*|*:15\ 22\ \*\ \*\ 1-5)
              job="money-paper-autopilot"
              path="/api/internal/money/paper-autopilot"
              ;;
            *)
              echo "Unknown scheduler invocation: input=${INPUT_JOB:-} schedule=${SCHEDULE:-}" >&2
              exit 2
              ;;
          esac

          echo "job=${job}" >> "$GITHUB_OUTPUT"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Request scoped GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('jhadina-production-scheduler')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Invoke production worker
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          ORIGIN: ${{ vars.JHADINA_PRODUCTION_ORIGIN || 'https://crispy-waddle-jhadina-web.vercel.app' }}
          PATHNAME: ${{ steps.target.outputs.path }}
          JOB: ${{ steps.target.outputs.job }}
        run: |
          set -euo pipefail
          url="${ORIGIN%/}${PATHNAME}"
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --connect-timeout 20 \
            --max-time 320 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header "User-Agent: jhadina-production-scheduler/${GITHUB_RUN_ID}" \
            "$url")"

          echo "worker=${JOB} status=${status}"
          cat "$response_file"

          case "$status" in
            2??) ;;
            *)
              echo "Production scheduler worker failed with HTTP ${status}" >&2
              exit 1
              ;;
          esac

          if ! jq -e 'type == "object"' "$response_file" >/dev/null 2>&1; then
            echo "Production scheduler worker returned non-JSON content; refusing false-green success." >&2
            exit 1
          fi
