name: FOIA RunPod Bridge

on:
  push:
    branches:
      - feat/foia-runpod-bridge

permissions:
  contents: read

concurrency:
  group: foia-runpod-bridge
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY || secrets.runpod_key }}
    steps:
      - uses: actions/checkout@v4

      - name: Probe exact private OverageOS checkout
        id: overage_checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: bookieandco/Overageos-
          ref: 8e0a006ebe413b963ebf24816b11deabfdde5b19
          path: overage-private
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1

      - name: Report private checkout probe
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d overage-private/.git ]]; then
            actual="$(git -C overage-private rev-parse HEAD)"
            echo "FOIA_BRIDGE_PRIVATE_CHECKOUT:true"
            echo "FOIA_BRIDGE_PRIVATE_HEAD:$actual"
          else
            echo "FOIA_BRIDGE_PRIVATE_CHECKOUT:false"
          fi

      - name: Require existing RunPod authority
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${RUNPOD_API_KEY:-}" ]] || {
            echo "FOIA_BRIDGE_RUNPOD_KEY_REQUIRED" >&2
            exit 1
          }

      - name: Install RunPod CLI
        shell: bash
        run: |
          set -euo pipefail
          installed=false
          for attempt in 1 2 3 4; do
            if curl -fsSL https://cli.runpod.net | sudo bash; then
              installed=true
              break
            fi
            sleep $((attempt * 2))
          done
          [[ "$installed" == "true" ]] || {
            echo "FOIA_BRIDGE_RUNPODCTL_INSTALL_FAILED" >&2
            exit 11
          }
          runpodctl version

      - name: Register transient SSH key
        id: key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.runpod/ssh"
          KEY_PATH="$HOME/.runpod/ssh/runpodctl-ssh-key"
          ssh-keygen -q -t ed25519 -N '' -C "foia-bridge-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -f "$KEY_PATH"
          runpodctl ssh add-key --key-file "$KEY_PATH.pub" >/dev/null
          echo "fingerprint=$(ssh-keygen -lf "$KEY_PATH.pub" -E sha256 | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Resolve existing running workspace pod only
        shell: bash
        run: |
          set -euo pipefail
          runpodctl pod list --all -o json > /tmp/pods.json
          jq -r '
            (if type=="array" then . else (.pods // .items // []) end)
            | .[]?
            | {id,name,status:(.runtimeStatus // .status // null),gpuCount:(.gpuCount // 0),volumeMountPath:(.volumeMountPath // .volume_mount_path // null)}
            | @json
          ' /tmp/pods.json > /tmp/pod-inventory.txt
          cat /tmp/pod-inventory.txt

          resolved="$(jq -r '
            (if type=="array" then . else (.pods // .items // []) end)
            | map(select(
                ((.runtimeStatus // .status // "")=="running")
                and ((.volumeMountPath // .volume_mount_path // "")=="/workspace")
              ))
            | sort_by(
                if ((.gpuCount // 0)==0 and (.name // "")=="jhadina-shark-shadow") then 0
                elif ((.gpuCount // 0)==0 and (.name // "")=="jhadina-portable-staging") then 1
                elif ((.gpuCount // 0)==0) then 2
                elif ((.name // "")=="jhadina-shark-shadow-v2") then 3
                else 4 end
              )
            | if length>0 then .[0].id else empty end
          ' /tmp/pods.json)"
          if [[ -z "$resolved" ]]; then
            : > /tmp/stopped-pod-details.txt
            jq -r '
              (if type=="array" then . else (.pods // .items // []) end)
              | map(select(((.runtimeStatus // .status // "")=="stopped") and ((.gpuCount // 0)==0)))
              | .[].id
            ' /tmp/pods.json | while read -r pod_id; do
              [[ -n "$pod_id" ]] || continue
              if runpodctl pod get "$pod_id" -o json >/tmp/pod-detail.json 2>/dev/null; then
                jq -c '{
                  id,
                  name,
                  status:(.runtimeStatus // .status // null),
                  gpuCount:(.gpuCount // 0),
                  volumeMountPath:(.volumeMountPath // .volume_mount_path // null),
                  volumeInGb:(.volumeInGb // .volume_in_gb // null),
                  containerDiskInGb:(.containerDiskInGb // .container_disk_in_gb // null),
                  networkVolumeId:(.networkVolumeId // .network_volume_id // null),
                  ports:(.ports // []),
                  costPerHr:(.costPerHr // .cost_per_hr // null),
                  createdAt:(.createdAt // .created_at // null)
                }' /tmp/pod-detail.json >> /tmp/stopped-pod-details.txt
              fi
            done
            cat /tmp/stopped-pod-details.txt
            echo "FOIA_BRIDGE_EXISTING_RUNNING_WORKSPACE_POD_REQUIRED" >&2
            exit 2
          fi
          echo "RUNPOD_POD_ID=$resolved" >> "$GITHUB_ENV"
          echo "FOIA_BRIDGE_REUSE_POD:$resolved"

      - name: Resolve SSH endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if runpodctl ssh info "$RUNPOD_POD_ID" -o json > /tmp/ssh.json 2>/tmp/ssh.err; then
              break
            fi
            sleep 5
          done
          ip="$(jq -r '.ip // empty' /tmp/ssh.json)"
          port="$(jq -r '.port // empty' /tmp/ssh.json)"
          [[ -n "$ip" && -n "$port" ]] || {
            echo "FOIA_BRIDGE_SSH_ENDPOINT_REQUIRED" >&2
            exit 3
          }
          echo "RUNPOD_SSH_IP=$ip" >> "$GITHUB_ENV"
          echo "RUNPOD_SSH_PORT=$port" >> "$GITHUB_ENV"

      - name: Verify SSH and inspect private checkout availability
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh
            -i "$HOME/.runpod/ssh/runpodctl-ssh-key"
            -p "$RUNPOD_SSH_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=10
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile=/tmp/foia-known-hosts
            "root@$RUNPOD_SSH_IP")

          "${SSH[@]}" 'printf FOIA_BRIDGE_SSH_OK' > /tmp/ssh-probe.txt

          "${SSH[@]}" 'bash -s' > /tmp/foia-inspect.txt <<'REMOTE'
          set -euo pipefail
          echo "FOIA_REMOTE_INSPECT_BEGIN"
          echo "HOSTNAME:$(hostname)"
          for p in             /workspace/overageos/source             /workspace/overageos             /workspace/Overageos-             /workspace/repos/Overageos-             /workspace/jhadina/Overageos-
          do
            if [[ -d "$p" ]]; then
              echo "CANDIDATE:$p"
              [[ -f "$p/scripts/overage-foia-canary.sh" ]] && echo "HAS_FOIA_CANARY:$p"
              [[ -f "$p/backend/package.json" ]] && grep -q '"test:foia"' "$p/backend/package.json" && echo "HAS_FOIA_TEST_SCRIPT:$p" || true
              if [[ -d "$p/.git" ]]; then
                head="$(git -C "$p" rev-parse HEAD 2>/dev/null || true)"
                branch="$(git -C "$p" branch --show-current 2>/dev/null || true)"
                origin="$(git -C "$p" remote get-url origin 2>/dev/null || true)"
                safe_origin="$(printf '%s' "$origin" | sed -E 's#https://[^/@]+@#https://#; s#git@github\.com:#github.com/#')"
                echo "GIT_HEAD:$p:$head"
                echo "GIT_BRANCH:$p:$branch"
                echo "GIT_ORIGIN:$p:$safe_origin"
                if [[ "$safe_origin" == *"/Overageos-"* || "$safe_origin" == *"Overageos-.git"* ]]; then
                  if git -C "$p" ls-remote origin refs/heads/feat/county-foia-contact >/tmp/foia-lsremote.out 2>/dev/null; then
                    remote_sha="$(awk '{print $1}' /tmp/foia-lsremote.out | head -n1)"
                    echo "PRIVATE_REMOTE_ACCESS:$p:true"
                    echo "FOIA_REMOTE_SHA:$p:$remote_sha"
                  else
                    echo "PRIVATE_REMOTE_ACCESS:$p:false"
                  fi
                fi
              fi
            fi
          done

          find /workspace -maxdepth 5 -type d -name .git -print 2>/dev/null | while read -r gitdir; do
            repo="${gitdir%/.git}"
            origin="$(git -C "$repo" remote get-url origin 2>/dev/null || true)"
            safe_origin="$(printf '%s' "$origin" | sed -E 's#https://[^/@]+@#https://#; s#git@github\.com:#github.com/#')"
            if [[ "$safe_origin" == *"/Overageos-"* || "$safe_origin" == *"Overageos-.git"* ]]; then
              echo "FOUND_PRIVATE_CHECKOUT:$repo"
              echo "FOUND_PRIVATE_HEAD:$repo:$(git -C "$repo" rev-parse HEAD 2>/dev/null || true)"
              echo "FOUND_PRIVATE_ORIGIN:$repo:$safe_origin"
              if git -C "$repo" ls-remote origin refs/heads/feat/county-foia-contact >/tmp/foia-found-lsremote.out 2>/dev/null; then
                echo "FOUND_PRIVATE_REMOTE_ACCESS:$repo:true"
                echo "FOUND_PRIVATE_REMOTE_SHA:$repo:$(awk '{print $1}' /tmp/foia-found-lsremote.out | head -n1)"
              else
                echo "FOUND_PRIVATE_REMOTE_ACCESS:$repo:false"
              fi
            fi
          done

          [[ -e /root/.git-credentials ]] && echo "ROOT_GIT_CREDENTIALS_PRESENT:true" || echo "ROOT_GIT_CREDENTIALS_PRESENT:false"
          [[ -d /root/.config/gh ]] && echo "ROOT_GH_CONFIG_PRESENT:true" || echo "ROOT_GH_CONFIG_PRESENT:false"
          echo "FOIA_REMOTE_INSPECT_END"
          REMOTE

          cat /tmp/foia-inspect.txt

      - name: Upload diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foia-runpod-bridge-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            /tmp/ssh-probe.txt
            /tmp/foia-inspect.txt
            /tmp/ssh.json
            /tmp/pod-inventory.txt
            /tmp/stopped-pod-details.txt

      - name: Revoke transient SSH key
        if: always()
        shell: bash
        run: |
          set +e
          if command -v runpodctl >/dev/null 2>&1 && [[ -n "${RUNPOD_API_KEY:-}" && -n "${{ steps.key.outputs.fingerprint }}" ]]; then
            runpodctl ssh remove-key --fingerprint "${{ steps.key.outputs.fingerprint }}" >/dev/null 2>&1 || true
          fi
          rm -rf "$HOME/.runpod/ssh"
