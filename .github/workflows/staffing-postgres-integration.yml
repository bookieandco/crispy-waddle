name: Staffing Postgres Integration

on:
  pull_request:
    paths:
      - "packages/staffing-core/**"
      - "packages/opportunity-core/**"
      - ".github/workflows/staffing-postgres-integration.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "packages/staffing-core/**"
      - "packages/opportunity-core/**"
      - ".github/workflows/staffing-postgres-integration.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: staffing
          POSTGRES_PASSWORD: staffing
          POSTGRES_DB: staffing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staffing -d staffing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      STAFFING_TEST_DATABASE_URL: postgresql://staffing:staffing@localhost:5432/staffing_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Staffing integration test dependencies
        run: pnpm add -Dw pg@8.16.3 @types/pg@8.15.5 vitest@2.1.9 --lockfile-only=false

      - name: Verify Postgres connectivity
        run: PGPASSWORD=staffing psql "$STAFFING_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'select version();'

      - name: Type-check Staffing reconciliation path
        run: >-
          pnpm exec tsc --noEmit --strict --noImplicitAny
          --target ES2021 --module ESNext --moduleResolution node
          --skipLibCheck --esModuleInterop --allowSyntheticDefaultImports
          --types node
          packages/staffing-core/src/payment-reconciliation.ts
          packages/staffing-core/src/payment-reconciliation-repository.ts
          packages/staffing-core/src/payment-reconciliation-postgres.ts
          packages/staffing-core/src/payment-reconciliation.pg-fixture.ts
          packages/staffing-core/src/payment-reconciliation.pg.test.ts
          packages/staffing-core/src/payment-reconciliation-mixed.pg.test.ts
          packages/staffing-core/src/payment-reconciliation-rollback.pg.test.ts
          packages/staffing-core/src/payment-reconciliation-concurrency.test.ts
          packages/staffing-core/src/payment-reconciliation-postgres.integration.test.ts

      - name: Initialize blank DB and prove canonical schema, tenant RLS, and payment concurrency
        run: pnpm exec vitest run packages/staffing-core/src/payment-reconciliation.pg.test.ts

      - name: Prove payment idempotency, mixed contention, and rollback on the initialized schema
        run: >-
          pnpm exec vitest run
          packages/staffing-core/src/payment-reconciliation-mixed.pg.test.ts
          packages/staffing-core/src/payment-reconciliation-rollback.pg.test.ts
          packages/staffing-core/src/payment-reconciliation-concurrency.test.ts
          packages/staffing-core/src/payment-reconciliation-postgres.integration.test.ts
