name: Jhadina Interactive Final Certification

on:
  pull_request:
    paths:
      - "apps/jhadina-web/src/app/ask-jhadina/**"
      - "apps/jhadina-web/src/app/api/jhadina/voice/**"
      - "services/jhadina-voice/**"
      - "docs/JHADINA_INTERACTIVE_FINAL_CERTIFICATION.md"
      - ".github/workflows/jhadina-interactive-final.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interactive-final:
    name: Interactive source certification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Interactive unit tests
        run: |
          pnpm --filter @jhadina/jhadina-web exec vitest run             src/app/ask-jhadina/interactive-runtime.test.ts             'src/app/api/jhadina/voice/[action]/route.test.ts'

      - name: Jhadina Web type-check
        run: pnpm --filter @jhadina/jhadina-web type-check

      - name: Jhadina Web production build
        run: pnpm --filter @jhadina/jhadina-web build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile voice runtime
        run: python -m compileall -q services/jhadina-voice

      - name: Install voice boundary dependencies
        run: pip install -r services/jhadina-voice/requirements-ci.txt

      - name: Native voice boundary tests
        working-directory: services/jhadina-voice
        run: python -m unittest -v test_worker.py test_app.py
