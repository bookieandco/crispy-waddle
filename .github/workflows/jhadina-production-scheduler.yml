name: Jhadina Production Scheduler

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/jhadina-production-scheduler.yml"
      - "docs/LOCAL_GOV_PRODUCTION_CONVERGENCE_TRIGGER_*.md"
      - "apps/jhadina-web/src/lib/internal-scheduler-auth.ts"
      - "apps/jhadina-web/src/app/api/internal/scheduler/health/**"
      - "apps/jhadina-web/src/app/api/internal/shark/**"
      - "apps/jhadina-web/src/lib/shark/**"
      - "packages/shark-intelligence-core/src/meme-trader/**"
      - "supabase/migrations/*shark_pump_lifecycle*.sql"
      - "apps/jhadina-web/src/app/api/internal/opportunities/public/**"
      - "apps/jhadina-web/src/app/api/internal/opportunities/government/**"
      - "apps/jhadina-web/src/app/api/internal/opportunities/venture/**"
      - "apps/jhadina-web/src/app/api/internal/relationships/**"
      - "apps/jhadina-web/src/lib/relationships/**"
      - "apps/jhadina-web/src/lib/opportunities/venture-*.ts"
      - "supabase/migrations/*venture_live_runtime.sql"
      - "supabase/migrations/*venture_discovery_loop.sql"
      - "apps/jhadina-web/src/app/api/internal/money/paper-autopilot/**"
      - "apps/jhadina-web/src/app/api/internal/money/shark-coffer-runtime/**"
      - "apps/jhadina-web/src/app/api/internal/money/shark-coffer-commissioning/**"
      - "apps/jhadina-web/src/app/api/internal/money/shark-shadow-learning/**"
      - "apps/jhadina-web/src/app/api/internal/money/shark-shadow-runpod-import/**"
      - "apps/jhadina-web/src/lib/money/paper-*.ts"
      - "apps/jhadina-web/src/lib/money/shark-coffer-runtime-*.ts"
      - "apps/jhadina-web/src/lib/money/shark-coffer-commissioning*.ts"
      - "apps/jhadina-web/src/lib/money/shark-shadow-learning*.ts"
      - "packages/money-core/src/shark-coffer-runtime*.ts"
      - "packages/money-core/src/shark-shadow-learning*.ts"
      - "supabase/migrations/*shark_coffer_runtime*.sql"
      - "supabase/migrations/*shark_shadow_learning*.sql"
      - "apps/jhadina-web/src/app/api/internal/music/autopilot/**"
      - "apps/jhadina-web/src/lib/music/music-autopilot-*.ts"
      - "apps/jhadina-web/src/lib/music/music-privileged-*.ts"
      - "supabase/migrations/*music_autopilot*.sql"
      - "supabase/migrations/*money_paper_learning_loop.sql"
      - "apps/jhadina-web/src/app/api/opportunities/public/**"
      - "apps/jhadina-web/src/lib/opportunities/public-*.ts"
      - "apps/jhadina-web/scripts/local-gov-production-convergence.ts"
      - "apps/jhadina-web/src/lib/opportunities/government-*.ts"
      - "packages/opportunity-core/src/domain/public-*.ts"
      - "supabase/migrations/*public_opportunity_discovery.sql"
      - "apps/jhadina-web/src/lib/storage/**"
      - "apps/jhadina-web/src/lib/supabase/service-role.ts"
      - "apps/jhadina-web/src/lib/supabase/middleware.ts"
      - "apps/jhadina-web/src/lib/routes/handlers.ts"
      - "supabase/functions/jhadina-memory-gateway/**"
      - "supabase/functions/jhadina-service-proxy/**"
      - "vercel.json"
      - "apps/jhadina-web/vercel.json"
  schedule:
    - cron: "*/5 * * * *"
    - cron: "3-58/5 * * * *"
    - cron: "4-59/5 * * * *"
    - cron: "0 * * * *"
    - cron: "2 * * * *"
    - cron: "5 * * * *"
    - cron: "10 * * * *"
    - cron: "30 * * * *"
    - cron: "15 */4 * * *"
    - cron: "15 3 * * *"
    - cron: "25 3 * * *"
    - cron: "40 3 * * *"
    - cron: "10 4 * * *"
    - cron: "45 * * * *"
    - cron: "55 * * * *"
    - cron: "15 22 * * 1-5"
    - cron: "20 * * * *"
    - cron: "20 */4 * * *"
    - cron: "27 */4 * * *"
    - cron: "32 */4 * * *"
    - cron: "35 * * * *"
    - cron: "50 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Production worker to invoke"
        required: true
        type: choice
        options:
          - shark-pump-lifecycle
          - shark-launch-outcomes
          - shark-historical-observations
          - local-gov-reference-scan
          - local-gov-jurisdiction-refresh
          - local-gov-buyer-registries
          - local-gov-source-discovery
          - local-gov-adapter-shadow
          - local-gov-usac
          - local-gov-award-prime-miner
          - local-gov-work-package-providers
          - local-gov-prime-coverage
          - local-gov-production-convergence
          - government-demand-radar
          - venture-market-scout
          - venture-candidate-synthesis
          - venture-candidate-adoption
          - venture-supervisor
          - money-paper-autopilot
          - money-shark-coffer-runtime
          - money-shark-coffer-commission
          - money-shark-shadow-learning
          - money-shark-shadow-learning-replay
          - money-shark-shadow-runpod-sync
          - music-autopilot
          - relationship-worker

permissions:
  contents: read
  id-token: write

concurrency:
  group: jhadina-production-scheduler-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.event.schedule || inputs.job || github.ref }}
  cancel-in-progress: false

jobs:
  admission-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for exact production durable health
        env:
          ORIGIN: ${{ vars.JHADINA_PRODUCTION_ORIGIN || 'https://crispy-waddle-jhadina-web.vercel.app' }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="${ORIGIN%/}/api/health"

          for attempt in $(seq 1 50); do
            response_file="$(mktemp)"
            status="$(curl --silent --show-error \
              --connect-timeout 20 \
              --max-time 30 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header "Accept: application/json" \
              --header "User-Agent: jhadina-production-admission/${GITHUB_RUN_ID}" \
              "$url" || true)"

            success="$(jq -r '.success // false' "$response_file" 2>/dev/null || echo false)"
            deployed_sha="$(jq -r '.commitSha // empty' "$response_file" 2>/dev/null || true)"
            environment="$(jq -r '.environment // empty' "$response_file" 2>/dev/null || true)"
            durable_memory="$(jq -r '.durableMemory // empty' "$response_file" 2>/dev/null || true)"
            contains_expected=false
            if [[ "$deployed_sha" == "$EXPECTED_SHA" ]]; then
              contains_expected=true
            elif [[ -n "$deployed_sha" ]]; then
              compare_status="$(gh api "/repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_SHA}...${deployed_sha}" --jq '.status' 2>/dev/null || true)"
              if [[ "$compare_status" == "ahead" || "$compare_status" == "identical" ]]; then
                contains_expected=true
              fi
            fi
            echo "attempt=${attempt} status=${status} environment=${environment} deployed_sha=${deployed_sha} contains_expected=${contains_expected} durable_memory=${durable_memory}"

            if [[ "$status" == "200" && "$success" == "true" && "$environment" == "production" && "$contains_expected" == "true" && "$durable_memory" == "ready" ]]; then
              echo "Production contains trigger SHA and durable Memory is ready: $EXPECTED_SHA"
              exit 0
            fi

            sleep 15
          done

          echo "Production never reported exact healthy SHA $EXPECTED_SHA within the admission window" >&2
          exit 1

      - name: Request fresh scoped GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('jhadina-production-scheduler')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Verify protected scheduler identity
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          ORIGIN: ${{ vars.JHADINA_PRODUCTION_ORIGIN || 'https://crispy-waddle-jhadina-web.vercel.app' }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --connect-timeout 20 \
            --max-time 30 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header "User-Agent: jhadina-production-admission/${GITHUB_RUN_ID}" \
            "${ORIGIN%/}/api/internal/scheduler/health")"

          deployed_sha="$(jq -r '.commitSha // empty' "$response_file" 2>/dev/null || true)"
          environment="$(jq -r '.environment // empty' "$response_file" 2>/dev/null || true)"
          contains_expected=false
          if [[ "$deployed_sha" == "$EXPECTED_SHA" ]]; then
            contains_expected=true
          elif [[ -n "$deployed_sha" ]]; then
            compare_status="$(gh api "/repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_SHA}...${deployed_sha}" --jq '.status' 2>/dev/null || true)"
            if [[ "$compare_status" == "ahead" || "$compare_status" == "identical" ]]; then
              contains_expected=true
            fi
          fi
          echo "protected_status=${status} environment=${environment} deployed_sha=${deployed_sha} contains_expected=${contains_expected}"

          [[ "$status" == "200" ]]
          [[ "$environment" == "production" ]]
          [[ "$contains_expected" == "true" ]]

  invoke:
    if: github.event_name != 'push' && inputs.job != 'local-gov-production-convergence' && inputs.job != 'money-shark-coffer-commission' && inputs.job != 'money-shark-shadow-runpod-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve protected production worker
        id: target
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
        run: |
          set -euo pipefail

          case "${INPUT_JOB:-}:${SCHEDULE:-}" in
            shark-pump-lifecycle:*|*:\*/5\ \*\ \*\ \*\ \*)
              job="shark-pump-lifecycle"
              path="/api/internal/shark/pump-lifecycle"
              ;;
            money-shark-coffer-runtime:*|*:3-58/5\ \*\ \*\ \*\ \*)
              job="money-shark-coffer-runtime"
              path="/api/internal/money/shark-coffer-runtime"
              ;;
            money-shark-shadow-learning-replay:*)
              job="money-shark-shadow-learning-replay"
              path="/api/internal/money/shark-shadow-learning?mode=replay&lookbackHours=8760&limit=500"
              ;;
            money-shark-shadow-learning:*|*:4-59/5\ \*\ \*\ \*\ \*)
              job="money-shark-shadow-learning"
              path="/api/internal/money/shark-shadow-learning?mode=live&lookbackHours=336&limit=100"
              ;;
            shark-launch-outcomes:*|*:0\ \*\ \*\ \*\ \*)
              job="shark-launch-outcomes"
              path="/api/internal/shark/launch-outcomes"
              ;;
            shark-historical-observations:*|*:30\ \*\ \*\ \*\ \*)
              job="shark-historical-observations"
              path="/api/internal/shark/historical-observations"
              ;;
            local-gov-reference-scan:*|*:15\ \*/4\ \*\ \*\ \*)
              job="local-gov-reference-scan"
              path="/api/internal/opportunities/public/scan"
              ;;
            local-gov-buyer-registries:*|*:15\ 3\ \*\ \*\ \*)
              job="local-gov-buyer-registries"
              path="/api/internal/opportunities/public/buyer-registries"
              ;;
            local-gov-jurisdiction-refresh:*|*:25\ 3\ \*\ \*\ \*)
              job="local-gov-jurisdiction-refresh"
              path="/api/internal/opportunities/public/jurisdictions"
              ;;
            local-gov-source-discovery:*|*:45\ \*\ \*\ \*\ \*)
              job="local-gov-source-discovery"
              path="/api/internal/opportunities/public/source-discovery"
              ;;
            local-gov-adapter-shadow:*|*:55\ \*\ \*\ \*\ \*)
              job="local-gov-adapter-shadow"
              path="/api/internal/opportunities/public/adapter-shadow"
              ;;
            local-gov-usac:*|*:2\ \*\ \*\ \*\ \*)
              job="local-gov-usac"
              path="/api/internal/opportunities/public/usac"
              ;;
            local-gov-award-prime-miner:*|*:5\ \*\ \*\ \*\ \*)
              job="local-gov-award-prime-miner"
              path="/api/internal/opportunities/public/awards"
              ;;
            local-gov-work-package-providers:*|*:10\ \*\ \*\ \*\ \*)
              job="local-gov-work-package-providers"
              path="/api/internal/opportunities/public/work-package-providers"
              ;;
            local-gov-prime-coverage:*|*:40\ 3\ \*\ \*\ \*)
              job="local-gov-prime-coverage"
              path="/api/internal/opportunities/public/prime-coverage"
              ;;
            government-demand-radar:*|*:10\ 4\ \*\ \*\ \*)
              job="government-demand-radar"
              path="/api/internal/opportunities/government/demand-radar"
              ;;
            venture-market-scout:*|*:20\ \*/4\ \*\ \*\ \*)
              job="venture-market-scout"
              path="/api/internal/opportunities/venture/scout"
              ;;
            venture-candidate-synthesis:*|*:27\ \*/4\ \*\ \*\ \*)
              job="venture-candidate-synthesis"
              path="/api/internal/opportunities/venture/candidates"
              ;;
            venture-candidate-adoption:*|*:32\ \*/4\ \*\ \*\ \*)
              job="venture-candidate-adoption"
              path="/api/internal/opportunities/venture/adopt"
              ;;
            venture-supervisor:*|*:35\ \*\ \*\ \*\ \*)
              job="venture-supervisor"
              path="/api/internal/opportunities/venture/supervisor"
              ;;
            money-paper-autopilot:*|*:15\ 22\ \*\ \*\ 1-5)
              job="money-paper-autopilot"
              path="/api/internal/money/paper-autopilot"
              ;;
            music-autopilot:*|*:20\ \*\ \*\ \*\ \*)
              job="music-autopilot"
              path="/api/internal/music/autopilot"
              ;;
            relationship-worker:*|*:50\ \*\ \*\ \*\ \*)
              job="relationship-worker"
              path="/api/internal/relationships/worker"
              ;;
            *)
              echo "Unknown scheduler invocation: input=${INPUT_JOB:-} schedule=${SCHEDULE:-}" >&2
              exit 2
              ;;
          esac

          echo "job=${job}" >> "$GITHUB_OUTPUT"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Verify exact production before worker
        env:
          ORIGIN: ${{ vars.JHADINA_PRODUCTION_ORIGIN || 'https://crispy-waddle-jhadina-web.vercel.app' }}
          EXPECTED_SHA: ${{ github.sha }}
          JOB: ${{ steps.target.outputs.job }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --connect-timeout 20 \
            --max-time 30 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Accept: application/json" \
            --header "User-Agent: jhadina-production-preflight/${GITHUB_RUN_ID}" \
            "${ORIGIN%/}/api/health" || true)"

          success="$(jq -r '.success // false' "$response_file" 2>/dev/null || echo false)"
          deployed_sha="$(jq -r '.commitSha // empty' "$response_file" 2>/dev/null || true)"
          environment="$(jq -r '.environment // empty' "$response_file" 2>/dev/null || true)"
          durable_memory="$(jq -r '.durableMemory // empty' "$response_file" 2>/dev/null || true)"

          contains_expected=false
          if [[ "$deployed_sha" == "$EXPECTED_SHA" ]]; then
            contains_expected=true
          elif [[ -n "$deployed_sha" ]]; then
            compare_status="$(gh api "/repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_SHA}...${deployed_sha}" --jq '.status' 2>/dev/null || true)"
            if [[ "$compare_status" == "ahead" || "$compare_status" == "identical" ]]; then
              contains_expected=true
            fi
          fi

          echo "worker=${JOB} health_status=${status} environment=${environment} deployed_sha=${deployed_sha} expected_sha=${EXPECTED_SHA} contains_expected=${contains_expected} durable_memory=${durable_memory}"

          if [[ "$status" != "200" || "$success" != "true" || "$environment" != "production" || "$contains_expected" != "true" || "$durable_memory" != "ready" ]]; then
            echo "STALE_OR_UNHEALTHY_PRODUCTION: refusing to invoke ${JOB} until production contains the trigger commit." >&2
            exit 1
          fi

      - name: Request scoped GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('jhadina-production-scheduler')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Invoke production worker
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          ORIGIN: ${{ vars.JHADINA_PRODUCTION_ORIGIN || 'https://crispy-waddle-jhadina-web.vercel.app' }}
          PATHNAME: ${{ steps.target.outputs.path }}
          JOB: ${{ steps.target.outputs.job }}
        run: |
          set -euo pipefail
          url="${ORIGIN%/}${PATHNAME}"
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --connect-timeout 20 \
            --max-time 320 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header "User-Agent: jhadina-production-scheduler/${GITHUB_RUN_ID}" \
            "$url")"

          echo "worker=${JOB} status=${status}"
          cat "$response_file"

          case "$status" in
            2??) ;;
            *)
              echo "Production scheduler worker failed with HTTP ${status}" >&2
              exit 1
              ;;
          esac

          if ! jq -e 'type == "object"' "$response_file" >/dev/null 2>&1; then
            echo "Production scheduler worker returned non-JSON content; refusing false-green success." >&2
            exit 1
          fi

  money-shark-shadow-runpod-sync:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'money-shark-shadow-runpod-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY || secrets.runpod_key }}
      RUNPOD_POD_ID: xn73vwwekavcc6
      ORIGIN: ${{ vars.JHADINA_PRODUCTION_ORIGIN || 'https://crispy-waddle-jhadina-web.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact healthy production
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --connect-timeout 20 --max-time 30             --output "$response_file" --write-out '%{http_code}'             --header "Accept: application/json"             --header "User-Agent: shark-shadow-runpod-sync/${GITHUB_RUN_ID}"             "${ORIGIN%/}/api/health" || true)"
          success="$(jq -r '.success // false' "$response_file" 2>/dev/null || echo false)"
          environment="$(jq -r '.environment // empty' "$response_file" 2>/dev/null || true)"
          durable="$(jq -r '.durableMemory // empty' "$response_file" 2>/dev/null || true)"
          [[ "$status" == "200" && "$success" == "true" && "$environment" == "production" && "$durable" == "ready" ]]

      - name: Require existing running RunPod
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${RUNPOD_API_KEY:-}" ]] || { echo "RUNPOD_SHADOW_API_KEY_REQUIRED" >&2; exit 1; }
          bash scripts/install-runpodctl-ci.sh
          runpodctl pod get "$RUNPOD_POD_ID" -o json > /tmp/shadow-sync-pod.json
          runtime="$(jq -r '.runtimeStatus // "unknown"' /tmp/shadow-sync-pod.json)"
          [[ "$runtime" == "running" ]] || { echo "RUNPOD_SHADOW_POD_NOT_RUNNING:$runtime" >&2; exit 2; }

      - name: Create transient RunPod SSH identity
        id: shadow_sync_key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.runpod/ssh"
          KEY_NAME="jhadina-shadow-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          KEY_PATH="$HOME/.runpod/ssh/runpodctl-ssh-key"
          ssh-keygen -q -t ed25519 -N '' -C "$KEY_NAME" -f "$KEY_PATH"
          runpodctl ssh add-key --key-file "$KEY_PATH.pub" >/dev/null
          FINGERPRINT="$(ssh-keygen -lf "$KEY_PATH.pub" -E sha256 | awk '{print $2}')"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Export pending RunPod shadow evidence
        id: export
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s runpodctl exec python scripts/shark-shadow-runpod-sync.py export --limit 200 --pod_id "$RUNPOD_POD_ID" | tee /tmp/shadow-sync-export.log
          grep -E '^\{' /tmp/shadow-sync-export.log | tail -n1 > /tmp/shadow-sync-export.json
          jq -e '.authority == "SHADOW_EXPORT_ONLY" and .canExecute == false and (.records|type=="array")' /tmp/shadow-sync-export.json >/dev/null
          count="$(jq -r '.count' /tmp/shadow-sync-export.json)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          jq '{records: [.records[] | {recordType,recordId,payload,createdAt}]}' /tmp/shadow-sync-export.json > /tmp/shadow-sync-import.json

      - name: Request scoped GitHub OIDC token
        if: steps.export.outputs.count != '0'
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('jhadina-production-scheduler')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Import evidence into SWLC staging
        if: steps.export.outputs.count != '0'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --connect-timeout 20 --max-time 120             --request POST             --output /tmp/shadow-sync-import-response.json             --write-out '%{http_code}'             --header "Accept: application/json"             --header "Content-Type: application/json"             --header "Authorization: Bearer ${OIDC_TOKEN}"             --header "User-Agent: shark-shadow-runpod-sync/${GITHUB_RUN_ID}"             --data-binary @/tmp/shadow-sync-import.json             "${ORIGIN%/}/api/internal/money/shark-shadow-runpod-import")"
          cat /tmp/shadow-sync-import-response.json
          [[ "$status" =~ ^2 ]]
          jq -e '.receipt.canExecute == false and .receipt.canAuthorizeLive == false and .receipt.rejected == 0' /tmp/shadow-sync-import-response.json >/dev/null

      - name: Acknowledge imported RunPod queue records
        if: steps.export.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          ids="$(jq -r '[.records[].syncId|tostring]|join(",")' /tmp/shadow-sync-export.json)"
          [[ -n "$ids" ]] || exit 0
          timeout 180s runpodctl exec python scripts/shark-shadow-runpod-sync.py ack --ids "$ids" --pod_id "$RUNPOD_POD_ID" | tee /tmp/shadow-sync-ack.log

      - name: Remove transient RunPod SSH identity
        if: always()
        shell: bash
        run: |
          set +e
          if command -v runpodctl >/dev/null 2>&1 && [[ -n "${RUNPOD_API_KEY:-}" && -n "${{ steps.shadow_sync_key.outputs.fingerprint }}" ]]; then
            runpodctl ssh remove-key --fingerprint "${{ steps.shadow_sync_key.outputs.fingerprint }}" >/dev/null 2>&1 || true
          fi
          rm -rf "$HOME/.runpod/ssh"

      - name: Upload sync receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shark-shadow-runpod-sync-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            /tmp/shadow-sync-pod.json
            /tmp/shadow-sync-export.json
            /tmp/shadow-sync-import-response.json
            /tmp/shadow-sync-ack.log
          retention-days: 14


  money-shark-coffer-commission:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'money-shark-coffer-commission'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify exact production lineage
        env:
          ORIGIN: ${{ vars.JHADINA_PRODUCTION_ORIGIN || 'https://crispy-waddle-jhadina-web.vercel.app' }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --connect-timeout 20 \
            --max-time 30 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Accept: application/json" \
            --header "User-Agent: shark-coffer-commission/${GITHUB_RUN_ID}" \
            "${ORIGIN%/}/api/health" || true)"
          success="$(jq -r '.success // false' "$response_file" 2>/dev/null || echo false)"
          deployed_sha="$(jq -r '.commitSha // empty' "$response_file" 2>/dev/null || true)"
          environment="$(jq -r '.environment // empty' "$response_file" 2>/dev/null || true)"
          durable_memory="$(jq -r '.durableMemory // empty' "$response_file" 2>/dev/null || true)"
          echo "status=${status} environment=${environment} deployed_sha=${deployed_sha} expected_sha=${EXPECTED_SHA} durable_memory=${durable_memory}"
          [[ "$status" == "200" ]]
          [[ "$success" == "true" ]]
          [[ "$environment" == "production" ]]
          [[ "$deployed_sha" == "$EXPECTED_SHA" ]]
          [[ "$durable_memory" == "ready" ]]

      - name: Request scoped GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('jhadina-production-scheduler')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Capture baseline commissioning snapshot
        env:
          ORIGIN: ${{ vars.JHADINA_PRODUCTION_ORIGIN || 'https://crispy-waddle-jhadina-web.vercel.app' }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error \
            --connect-timeout 20 \
            --max-time 60 \
            --output /tmp/shark-coffer-baseline.json \
            --write-out '%{http_code}' \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header "User-Agent: shark-coffer-commission/${GITHUB_RUN_ID}" \
            "${ORIGIN%/}/api/internal/money/shark-coffer-commissioning?windowHours=24")"
          cat /tmp/shark-coffer-baseline.json
          [[ "$status" == "200" ]]
          jq -e '.ok == true and .canExecute == false and .snapshot.canExecute == false' /tmp/shark-coffer-baseline.json >/dev/null
          jq -e '.snapshot.gates.commission1 == "PASS"' /tmp/shark-coffer-baseline.json >/dev/null

      - name: Run one bounded real SHARK observation cycle
        env:
          ORIGIN: ${{ vars.JHADINA_PRODUCTION_ORIGIN || 'https://crispy-waddle-jhadina-web.vercel.app' }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error \
            --connect-timeout 20 \
            --max-time 320 \
            --output /tmp/shark-pump.json \
            --write-out '%{http_code}' \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header "User-Agent: shark-coffer-commission/${GITHUB_RUN_ID}" \
            "${ORIGIN%/}/api/internal/shark/pump-lifecycle?limit=5")"
          cat /tmp/shark-pump.json
          [[ "$status" =~ ^2 ]]
          jq -e '.ok == true and .authority == "READ_ONLY_RESEARCH" and .canAuthorizeTrade == false' /tmp/shark-pump.json >/dev/null

      - name: Run one bounded SHARK Coffer cycle
        env:
          ORIGIN: ${{ vars.JHADINA_PRODUCTION_ORIGIN || 'https://crispy-waddle-jhadina-web.vercel.app' }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error \
            --connect-timeout 20 \
            --max-time 320 \
            --output /tmp/shark-coffer-cycle.json \
            --write-out '%{http_code}' \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header "User-Agent: shark-coffer-commission/${GITHUB_RUN_ID}" \
            "${ORIGIN%/}/api/internal/money/shark-coffer-runtime?limit=5")"
          cat /tmp/shark-coffer-cycle.json
          [[ "$status" =~ ^2 ]]
          jq -e '.ok == true and .canExecute == false' /tmp/shark-coffer-cycle.json >/dev/null

      - name: Certify COMMISSION.1 through COMMISSION.7 evidence
        env:
          ORIGIN: ${{ vars.JHADINA_PRODUCTION_ORIGIN || 'https://crispy-waddle-jhadina-web.vercel.app' }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error \
            --connect-timeout 20 \
            --max-time 60 \
            --output /tmp/shark-coffer-final.json \
            --write-out '%{http_code}' \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header "User-Agent: shark-coffer-commission/${GITHUB_RUN_ID}" \
            "${ORIGIN%/}/api/internal/money/shark-coffer-commissioning?windowHours=24")"
          cat /tmp/shark-coffer-final.json
          [[ "$status" == "200" ]]
          jq -e '.ok == true and .authority == "COMMISSIONING_EVIDENCE_ONLY" and .canExecute == false and .snapshot.canExecute == false' /tmp/shark-coffer-final.json >/dev/null
          jq -e '
            .snapshot.gates.commission1 == "PASS" and
            .snapshot.gates.commission3 == "PASS" and
            .snapshot.gates.commission4 == "PASS" and
            .snapshot.gates.commission5 == "PASS" and
            .snapshot.gates.commission6 == "PASS" and
            .snapshot.gates.commission7 == "PASS"
          ' /tmp/shark-coffer-final.json >/dev/null

          {
            echo "### SHARK Coffer commissioning"
            echo
            echo "COMMISSION.1-.7 = PASS"
            echo
            echo '~~~json'
            jq '{observedAt:.snapshot.observedAt,windowHours:.snapshot.windowHours,activeCharterCount:.snapshot.activeCharterCount,memeEnabledCharterCount:.snapshot.memeEnabledCharterCount,paperMemeCharterCount:.snapshot.paperMemeCharterCount,liveGovernedMemeCharterCount:.snapshot.liveGovernedMemeCharterCount,counts:.snapshot.counts,gates:.snapshot.gates,authority:.snapshot.authority,canExecute:.snapshot.canExecute}' /tmp/shark-coffer-final.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  local-gov-convergence-bootstrap:
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'LOCAL-GOV.PROD')) ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'local-gov-production-convergence')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap national public buyers and official domains
        run: >-
          pnpm --filter @jhadina/opportunity-core exec tsx
          --tsconfig ../../apps/jhadina-web/tsconfig.json
          ../../apps/jhadina-web/scripts/local-gov-production-convergence.ts bootstrap

  local-gov-convergence-sources:
    needs: local-gov-convergence-bootstrap
    if: needs.local-gov-convergence-bootstrap.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        state: [AL, AK, AZ, AR, CA, CO, CT, DE, DC, FL, GA, HI, ID, IL, IN, IA, KS, KY, LA, ME, MD, MA, MI, MN, MS, MO, MT, NE, NV, NH, NJ, NM, NY, NC, ND, OH, OK, OR, PA, RI, SC, SD, TN, TX, UT, VT, VA, WA, WV, WI, WY]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commission public procurement sources
        env:
          STATE: ${{ matrix.state }}
          LOCAL_GOV_CONVERGENCE_STATE_MAX_MS: "3000000"
        run: >-
          pnpm --filter @jhadina/opportunity-core exec tsx
          --tsconfig ../../apps/jhadina-web/tsconfig.json
          ../../apps/jhadina-web/scripts/local-gov-production-convergence.ts
          state-sources --state "${STATE}"

  local-gov-convergence-adapters:
    needs:
      - local-gov-convergence-bootstrap
      - local-gov-convergence-sources
    if: >-
      always() &&
      needs.local-gov-convergence-bootstrap.result == 'success' &&
      needs.local-gov-convergence-sources.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        state: [AL, AK, AZ, AR, CA, CO, CT, DE, DC, FL, GA, HI, ID, IL, IN, IA, KS, KY, LA, ME, MD, MA, MI, MN, MS, MO, MT, NE, NV, NH, NJ, NM, NY, NC, ND, OH, OK, OR, PA, RI, SC, SD, TN, TX, UT, VT, VA, WA, WV, WI, WY]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Certify or terminalize public source adapters
        env:
          STATE: ${{ matrix.state }}
          LOCAL_GOV_CONVERGENCE_STATE_MAX_MS: "3000000"
        run: >-
          pnpm --filter @jhadina/opportunity-core exec tsx
          --tsconfig ../../apps/jhadina-web/tsconfig.json
          ../../apps/jhadina-web/scripts/local-gov-production-convergence.ts
          state-adapters --state "${STATE}"


  local-gov-convergence-usac:
    needs: local-gov-convergence-bootstrap
    if: needs.local-gov-convergence-bootstrap.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Backfill USAC school and rural-health procurement
        env:
          LOCAL_GOV_CONVERGENCE_STATE_MAX_MS: "3000000"
        run: >-
          pnpm --filter @jhadina/opportunity-core exec tsx
          --tsconfig ../../apps/jhadina-web/tsconfig.json
          ../../apps/jhadina-web/scripts/local-gov-production-convergence.ts usac

  local-gov-convergence-finalize:
    needs:
      - local-gov-convergence-bootstrap
      - local-gov-convergence-sources
      - local-gov-convergence-adapters
      - local-gov-convergence-usac
    if: >-
      always() &&
      needs.local-gov-convergence-bootstrap.result == 'success' &&
      needs.local-gov-convergence-sources.result != 'cancelled' &&
      needs.local-gov-convergence-adapters.result != 'cancelled' &&
      needs.local-gov-convergence-usac.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mine awards, match providers, and persist national coverage
        run: >-
          pnpm --filter @jhadina/opportunity-core exec tsx
          --tsconfig ../../apps/jhadina-web/tsconfig.json
          ../../apps/jhadina-web/scripts/local-gov-production-convergence.ts finalize
