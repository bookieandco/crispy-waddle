name: Media Production Certification
on:
  pull_request:
    paths:
      - 'packages/music-core/**'
      - 'packages/jhadina-tv-core/**'
      - 'apps/jhadina-web/**'
      - '.github/workflows/media-production-certification.yml'
  push:
    branches: [feat/media-prod-reconcile]
jobs:
  certify-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 8.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jhadina/music-core type-check
      - run: pnpm --filter @jhadina/music-core test
      - run: pnpm --filter @jhadina/tv-core type-check
      - run: pnpm --filter @jhadina/tv-core test
      - run: pnpm --filter jhadina-web type-check
