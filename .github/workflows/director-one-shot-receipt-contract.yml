name: Director One Shot Receipt Safety

on:
  pull_request:
    paths:
      - .github/workflows/director-runpod-one-shot.yml
      - .github/workflows/director-one-shot-receipt-contract.yml
      - scripts/director-one-shot-receipt-contract.py
      - scripts/director-runpod-inventory-recovery-contract.py
      - scripts/director-human-media-one-shot-contract.py
  push:
    branches:
      - fix/director-finish-receipts-scheduled-safety-20261014
    paths:
      - .github/workflows/director-runpod-one-shot.yml
      - .github/workflows/director-one-shot-receipt-contract.yml
      - scripts/director-one-shot-receipt-contract.py
      - scripts/director-runpod-inventory-recovery-contract.py
      - scripts/director-human-media-one-shot-contract.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    name: No-create and parseable receipts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete receipt matrix
        run: python3 scripts/director-one-shot-receipt-contract.py
      - name: Verify existing RunPod recovery safety
        run: python3 scripts/director-runpod-inventory-recovery-contract.py
      - name: Verify MuseTalk in-place recovery safety
        run: python3 scripts/director-human-media-one-shot-contract.py
