name: Opportunity Factory Final

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/opportunity-factory-final.yml"
      - "apps/jhadina-web/src/lib/opportunities/**"
      - "apps/jhadina-web/src/lib/money-opportunities/sam-*.ts"
      - "apps/jhadina-web/src/app/api/internal/opportunity/**"
      - "packages/opportunity-core/src/domain/opportunity-factory-final.ts"
      - "packages/opportunity-core/src/domain/venture-*.ts"
      - "supabase/migrations/*opportunity_factory*.sql"
      - "supabase/migrations/*venture*.sql"
  schedule:
    - cron: "31 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: opportunity-factory-final
  cancel-in-progress: true

jobs:
  certify:
    name: Derive live Opportunity Factory evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ORIGIN: ${{ vars.JHADINA_PRODUCTION_ORIGIN || 'https://crispy-waddle-jhadina-web.vercel.app' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for exact production deployment
        if: github.event_name == 'push'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          url="${ORIGIN%/}/api/health"
          for attempt in $(seq 1 60); do
            response_file="$(mktemp)"
            status="$(curl --silent --show-error \
              --connect-timeout 20 \
              --max-time 30 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header "Accept: application/json" \
              --header "User-Agent: opportunity-factory-final/${GITHUB_RUN_ID}" \
              "$url" || true)"
            success="$(jq -r '.success // false' "$response_file" 2>/dev/null || echo false)"
            deployed_sha="$(jq -r '.commitSha // empty' "$response_file" 2>/dev/null || true)"
            environment="$(jq -r '.environment // empty' "$response_file" 2>/dev/null || true)"
            echo "attempt=${attempt} status=${status} environment=${environment} deployed_sha=${deployed_sha}"
            if [[ "$status" == "200" && "$success" == "true" && "$environment" == "production" && "$deployed_sha" == "$EXPECTED_SHA" ]]; then
              exit 0
            fi
            sleep 15
          done
          echo "Production never reported exact SHA $EXPECTED_SHA" >&2
          exit 1

      - name: Request Opportunity Factory OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('jhadina-opportunity-factory-final')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Certify source-derived production evidence
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --connect-timeout 20 \
            --max-time 120 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/json" \
            --header "Authorization: Bearer $OIDC_TOKEN" \
            --header "X-Source-Commit: $SOURCE_COMMIT" \
            --header "User-Agent: opportunity-factory-final/${GITHUB_RUN_ID}" \
            "${ORIGIN%/}/api/internal/opportunity/final")"
          cat "$response_file"
          echo
          echo "### Opportunity Factory FINAL" >> "$GITHUB_STEP_SUMMARY"
          jq . "$response_file" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || cat "$response_file" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" != "200" ]]; then
            echo "Certification endpoint returned HTTP $status" >&2
            exit 1
          fi
          final_status="$(jq -r '.status // empty' "$response_file")"
          if [[ "$final_status" != "pass" ]]; then
            echo "OPPORTUNITY-FACTORY.FINAL remains $final_status; no FINAL receipt was persisted." >&2
            exit 1
          fi
