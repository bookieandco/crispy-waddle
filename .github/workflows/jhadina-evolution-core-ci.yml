name: Jhadina Evolution Core CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/jhadina-evolution-core-ci.yml"
      - "packages/jhadina-evolution-core/**"
      - "packages/jhadina-core-spine/**"
      - "supabase/migrations/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/jhadina-evolution-core-ci.yml"
      - "packages/jhadina-evolution-core/**"
      - "packages/jhadina-core-spine/**"
      - "supabase/migrations/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  evolution-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test evolution core
        run: pnpm --filter @jhadina/evolution-core test

      - name: Typecheck evolution core
        run: pnpm --filter @jhadina/evolution-core type-check

      - name: Typecheck core spine
        run: pnpm --filter @jhadina/core-spine type-check

      - name: Validate migration files
        run: |
          test -d supabase/migrations
          test -n "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print -quit)"
