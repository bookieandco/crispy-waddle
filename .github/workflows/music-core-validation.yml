name: Music Core Validation

on:
  pull_request:
    paths:
      - "packages/music-core/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/music-core-validation.yml"

jobs:
  music-core:
    name: Music Core type-check and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check Music Core
        run: pnpm --filter @jhadina/music-core type-check
      - name: Test Music Core
        run: pnpm --filter @jhadina/music-core test
