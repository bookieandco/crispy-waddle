name: Jhadina Security Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: jhadina-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --prod

      - name: Static security tripwires
        shell: bash
        run: |
          set -euo pipefail
          # Production code must never use the permissive test policy.
          if git grep -n 'AllowAllActionPolicy' -- ':!**/*.test.ts' ':!**/*.spec.ts'; then
            echo 'ERROR: AllowAllActionPolicy referenced by non-test code.'
            exit 1
          fi
          # Reject obvious secret material accidentally committed to source.
          if git grep -n -I -E '(BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|sk_live_[A-Za-z0-9]+|service_role.{0,20}=)' -- ':!pnpm-lock.yaml'; then
            echo 'ERROR: possible credential material found in repository.'
            exit 1
          fi

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test
