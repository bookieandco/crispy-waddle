name: SHARK Shadow Live Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: shark-shadow-live-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      POD_ID: ${{ vars.RUNPOD_SHADOW_LIVE_POD_ID || 'wx1h6rvoppd2a8' }}
    steps:
      - name: Verify live shadow health
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${POD_ID}-8094.proxy.runpod.net/health"
          curl -fsS --connect-timeout 10 --max-time 30 "$URL" > /tmp/health.json
          jq -e '
            .status=="ready"
            and .canExecute==false
            and .canSign==false
            and .canBroadcast==false
            and .canAuthorizeLive==false
            and (.counts.runpod_shark_shadow_decisions // 0) > 0
          ' /tmp/health.json >/dev/null
          updated="$(jq -r '.service.updatedAt // empty' /tmp/health.json)"
          [[ -n "$updated" ]] || { echo "SHADOW_WATCHDOG_SERVICE_TIMESTAMP_MISSING" >&2; exit 2; }
          age="$(jq -n --arg updated "$updated" 'now - ($updated|fromdateiso8601)')"
          awk -v age="$age" 'BEGIN { exit !(age >= 0 && age <= 1200) }' || {
            echo "SHADOW_WATCHDOG_STALE_SERVICE:age_seconds=$age" >&2
            exit 3
          }
          jq '{observedAt:(now|todate),podId:"'${POD_ID}'",status,counts,lastLive,lastOutcomes,service,authority,canExecute,canSign,canBroadcast,canAuthorizeLive}' /tmp/health.json | tee /tmp/watchdog.json

      - name: Upload watchdog receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shark-shadow-watchdog-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            /tmp/watchdog.json
            /tmp/health.json
          retention-days: 7
