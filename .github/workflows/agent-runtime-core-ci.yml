name: Agent Runtime Core CI

on:
  workflow_dispatch:
  push:
    branches:
      - "audit-build/v3.3-provenance-assurance"
    paths:
      - "packages/agent-runtime-core/**"
      - ".github/workflows/agent-runtime-core-ci.yml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - "packages/agent-runtime-core/**"
      - ".github/workflows/agent-runtime-core-ci.yml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate lockfile for audit evidence
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: agent-runtime-core-pnpm-lock-${{ github.sha }}
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Download generated lockfile
        uses: actions/download-artifact@v5
        with:
          name: agent-runtime-core-pnpm-lock-${{ github.sha }}
          path: .ci-generated-lockfile
      - name: Replace working lockfile with generated lockfile
        run: cp .ci-generated-lockfile/pnpm-lock.yaml pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check agent runtime core
        run: pnpm --filter @jhadina/agent-runtime-core type-check
      - name: Test agent runtime core
        run: pnpm --filter @jhadina/agent-runtime-core test
