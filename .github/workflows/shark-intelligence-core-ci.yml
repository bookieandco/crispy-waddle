name: SHARK Intelligence Core CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/shark-intelligence-core-ci.yml"
      - "packages/shark-intelligence-core/**"
      - "apps/jhadina-web/src/lib/shark/**"
      - "apps/jhadina-web/src/app/api/internal/shark/**"
      - "apps/jhadina-web/src/app/api/wallet/intelligence/**"
      - "apps/jhadina-web/src/app/api/webhooks/helius/**"
      - "supabase/migrations/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  shark-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: SHARK type-check
        run: pnpm --filter @jhadina/shark-intelligence-core type-check
      - name: SHARK tests
        run: pnpm --filter @jhadina/shark-intelligence-core test
      - name: Jhadina SHARK integration type-check
        run: pnpm --filter @jhadina/jhadina-web exec tsc --noEmit -p tsconfig.shark.json
      - name: Validate SHARK migrations
        run: |
          test -f supabase/migrations/20260902010000_shark_launch_outcome_history.sql
          test -f supabase/migrations/20260918000100_shark_durable_launch_ingestion.sql
          test -f supabase/migrations/20260919000100_shark_historical_observation_ratio_contract.sql
          test -f supabase/migrations/20260920000100_shark_evidence_provenance_contract.sql
          test -f supabase/migrations/20260920000200_shark_service_role_only_rls.sql
          test -f supabase/migrations/20260920000300_shark_schema_reconciliation.sql
          test -f supabase/migrations/20260920000400_shark_latest_observation_rpc.sql
          test -f supabase/migrations/20260920000500_shark_historical_backfill_scheduler.sql
          test -f supabase/migrations/20260920000600_shark_outcome_revision_contract.sql
          test -f supabase/migrations/20260920000700_shark_actor_association_confidence.sql
          test -f supabase/migrations/20260920000800_shark_atomic_outcome_apply.sql
          test -f supabase/migrations/20260920000900_shark_atomic_launch_bundle.sql
          test -f supabase/migrations/20260920001000_shark_wallet_intelligence_quota.sql
