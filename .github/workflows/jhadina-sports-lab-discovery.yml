name: Jhadina Sports Lab discovery — source-rights hold
# Manual workflow is intentionally offline until permission and provenance are reviewed.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline governance checks only (no ESPN polling)
        run: node --test training/sports/experiments/2026-10-13-week-001/*.test.mjs
