name: Director Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  director:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @jhadina/director-core type-check
      - run: pnpm --filter @jhadina/director-core test
