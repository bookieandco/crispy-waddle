name: Jhadina Telegram Owner Receipt Test

# No Telegram message access on push or pull requests.
# The one-time live check is ONLY activated by a manual dispatch on main.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/jhadina-telegram-inbox-smoke.yml
      - ops/telegram/bot_inbox_receipt.py
      - ops/telegram/test_bot_inbox_receipt.py
  workflow_dispatch:
    inputs:
      proof_tag:
        description: 'Use an 8-48 character tag; privately send /research-check TAG to @R2dice2bot'
        required: true
        default: JHADINA-OWNER-VERIFY-26
        type: string

permissions:
  contents: read

concurrency:
  group: jhadina-telegram-inbox-smoke
  cancel-in-progress: false

jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate safe Telegram receipt logic without credentials
        run: python -m unittest discover -s ops/telegram -p 'test_bot_inbox_receipt.py' -v

  owner-secret-ready:
    # Secret presence & numeric structure only. No Telegram API calls on push.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
    steps:
      - name: Verify private owner allowlist is configured
        shell: bash
        run: |
          python3 - <<'PY'
          import os, sys
          value = os.environ.get("TELEGRAM_ALLOWED_USER_ID", "").strip()
          if (not value or not value.isascii() or not value.isdigit()
                  or len(value) > 20 or int(value) <= 0):
              print("::error::OWNER_ALLOWLIST_SECRET_MISSING_OR_INVALID")
              sys.exit(1)
          print("OWNER_ALLOWLIST_SECRET_READY")
          print("Telegram account ID was not disclosed; live owner message proof requires manual dispatch")
          PY

  private-inbox-receipt:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [offline-unit-tests, owner-secret-ready]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
      TELEGRAM_PROOF_TAG: ${{ inputs.proof_tag }}
      TELEGRAM_REQUIRE_OWNER_ALLOWLIST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check recent private receipt (no offset acknowledgement)
        run: python ops/telegram/bot_inbox_receipt.py
