name: JhadinaTV PR

on:
  pull_request:
    paths:
      - 'packages/jhadina-tv-core/**'
      - 'apps/jhadina-web/pages/jhadinatv/**'
      - 'apps/jhadina-web/pages/api/jhadinatv/**'
      - 'apps/jhadina-web/lib/jhadinatv/**'
      - 'apps/jhadina-web/src/components/jhadinaTv/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/jhadinatv-pr.yml'

permissions:
  contents: read

jobs:
  jhadinatv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - name: Type-check JhadinaTV
        run: |
          set -o pipefail
          pnpm --filter @jhadina/tv-core type-check 2>&1 | tee /tmp/jhadinatv-typecheck.log
      - name: Test JhadinaTV
        run: |
          set -o pipefail
          pnpm --filter @jhadina/tv-core test 2>&1 | tee /tmp/jhadinatv-test.log
      - name: Upload JhadinaTV diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jhadinatv-diagnostics
          path: |
            /tmp/jhadinatv-typecheck.log
            /tmp/jhadinatv-test.log
          if-no-files-found: ignore
