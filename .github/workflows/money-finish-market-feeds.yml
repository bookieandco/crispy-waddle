name: MONEY-FINISH.05-.07 Market Feeds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/money-finish-market-feeds.yml"
      - "packages/money-core/src/money-finish-feed-admission*"
      - "packages/money-core/src/money-metalpriceapi-reference*"
      - "packages/money-core/src/money-finish-event-calendar*"
      - "packages/money-core/src/money-finish-option-chain*"
      - "packages/money-core/src/index.ts"
      - "docs/architecture/MONEY-FINISH-05-07-*"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
  push:
    branches: [main]
    paths:
      - "packages/money-core/src/money-finish-feed-admission*"
      - "packages/money-core/src/money-metalpriceapi-reference*"
      - "packages/money-core/src/money-finish-event-calendar*"
      - "packages/money-core/src/money-finish-option-chain*"
      - ".github/workflows/money-finish-market-feeds.yml"
permissions:
  contents: read
jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Money Core type check
        run: pnpm --filter @jhadina/money-core type-check
      - name: Point-in-time and provider negative tests
        run: pnpm --filter @jhadina/money-core exec tsx --test src/money-finish-feed-admission.test.ts src/money-metalpriceapi-reference.test.ts src/money-finish-event-calendar.test.ts src/money-finish-option-chain.test.ts src/money-finish-source-admission.test.ts src/alpaca-stock-market-data.test.ts src/finnhub-forex-market-data.test.ts src/options-contracts.test.ts
      - name: Full Money Core unit regression
        run: pnpm --filter @jhadina/money-core test
