name: PupsonStuff Fulfillment Postgres

on:
  pull_request:
    paths:
      - 'supabase/migrations/*pupsonstuff*.sql'
      - 'apps/pupsonstuff/lib/fulfillment-bridge.ts'
      - '.github/workflows/pupsonstuff-fulfillment-postgres.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/*pupsonstuff*.sql'
      - 'apps/pupsonstuff/lib/fulfillment-bridge.ts'
      - '.github/workflows/pupsonstuff-fulfillment-postgres.yml'
  workflow_dispatch:

jobs:
  fulfillment-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pupson
          POSTGRES_PASSWORD: pupson
          POSTGRES_DB: pupson_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pupson -d pupson_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://pupson:pupson@localhost:5432/pupson_test

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap legacy fulfillment table
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=pupson psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create table public.pupson_fulfillment_orders (
            id uuid primary key,
            status text not null default 'pending'
              check (status in (
                'pending','submitting','submitted','in_production','shipped',
                'fulfilled','blocked','failed','cancelled'
              ))
          );
          SQL

      - name: Apply unknown-submission migration
        run: |
          set -euo pipefail
          PGPASSWORD=pupson psql "$DATABASE_URL" -v ON_ERROR_STOP=1             -f supabase/migrations/20261002210000_pupsonstuff_submission_unknown.sql

      - name: Verify fail-closed state is admitted
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=pupson psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.pupson_fulfillment_orders(id,status)
          values ('11111111-1111-4111-8111-111111111111','submission_unknown');

          do $$
          begin
            if not exists (
              select 1 from public.pupson_fulfillment_orders
              where id='11111111-1111-4111-8111-111111111111'
                and status='submission_unknown'
            ) then
              raise exception 'submission_unknown status was not persisted';
            end if;
          end $$;
          SQL
