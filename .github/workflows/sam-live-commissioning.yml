name: SAM Live Commissioning

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sam-live-commissioning
  cancel-in-progress: true

jobs:
  commission:
    name: Real SAM evidence commissioning
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://kqbkaozfjubkjevdfvic.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      INEGI_DENUE_TOKEN: ${{ secrets.INEGI_DENUE_TOKEN }}
      FMCSA_APP_TOKEN: ${{ secrets.FMCSA_APP_TOKEN }}
      FSIS_MPI_CSV_URL: ${{ vars.FSIS_MPI_CSV_URL }}
      FSIS_MPI_DEMOGRAPHIC_CSV_URL: ${{ vars.FSIS_MPI_DEMOGRAPHIC_CSV_URL }}
      CANADA_CID_HS6_DESCRIPTION_URL: ${{ vars.CANADA_CID_HS6_DESCRIPTION_URL }}
      CANADA_CID_IMPORTERS_HS6_URL: ${{ vars.CANADA_CID_IMPORTERS_HS6_URL }}
      CANADA_ODBUS_CSV_URL: ${{ vars.CANADA_ODBUS_CSV_URL }}
    steps:
      - name: Check live credentials
        id: preflight
        shell: bash
        run: |
          missing=""
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then missing="$missing SUPABASE_SERVICE_ROLE_KEY"; fi
          if [ -z "$SAM_GOV_API_KEY" ]; then missing="$missing SAM_GOV_API_KEY"; fi
          echo "PROVIDER_SOURCE_READINESS:"
          if [ -n "$EXA_API_KEY" ]; then echo "  exa=configured"; else echo "  exa=unconfigured"; fi
          if [ -n "$INEGI_DENUE_TOKEN" ]; then echo "  denue=configured"; else echo "  denue=unconfigured"; fi
          if [ -n "$FMCSA_APP_TOKEN" ]; then echo "  fmcsa=keyless+app-token"; else echo "  fmcsa=keyless"; fi
          if [ -n "$FSIS_MPI_CSV_URL" ]; then echo "  fsis=configured"; else echo "  fsis=unconfigured"; fi
          echo "  usaspending=keyless"
          echo "  canada_importer=keyless"
          if [ -n "$CANADA_ODBUS_CSV_URL" ]; then echo "  canada_odbusiness=configured"; else echo "  canada_odbusiness=unconfigured"; fi
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "BLOCKED_EXTERNAL_CREDENTIAL:$missing"
            echo "### SAM live commissioning" >> "$GITHUB_STEP_SUMMARY"
            echo "BLOCKED_EXTERNAL_CREDENTIAL:$missing" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: steps.preflight.outputs.configured == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false

      - name: Setup Node
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Frozen install
        if: steps.preflight.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Commission real SAM evidence
        if: steps.preflight.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @jhadina/opportunity-core exec tsx ../../apps/jhadina-web/scripts/sam-live-commissioning.ts | tee /tmp/sam-commissioning.json
          echo "### SAM live commissioning" >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 /tmp/sam-commissioning.json >> "$GITHUB_STEP_SUMMARY"
