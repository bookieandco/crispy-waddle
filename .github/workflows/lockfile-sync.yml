name: Bootstrap pnpm lockfile

on:
  push:
    branches:
      - feat/jhadina-entertainment-intelligence

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: "!contains(github.event.head_commit.message, '[lockfile-sync]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit generated lockfile and remove bootstrap workflow
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already matches package manifests.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml .github/workflows/lockfile-sync.yml
          git rm .github/workflows/lockfile-sync.yml
          git commit -m 'chore(deps): regenerate pnpm lockfile [lockfile-sync]'
          git push
