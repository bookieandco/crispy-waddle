name: Music Juggernaut Final Certification

on:
  pull_request:
    paths:
      - "packages/growth-core/src/music-juggernaut/**"
      - "packages/growth-core/src/index.ts"
      - "apps/jhadina-web/src/lib/music/**"
      - "apps/jhadina-web/src/lib/intelligence/ask-music-juggernaut-command*"
      - "apps/jhadina-web/src/app/api/music/juggernaut/**"
      - "apps/jhadina-web/src/app/api/jhadina/command/route.ts"
      - "apps/jhadina-web/src/app/music/**"
      - "supabase/migrations/*music_juggernaut*.sql"
      - "supabase/migrations/20260930170500_growth_direct_audience_consent.sql"
      - ".github/workflows/music-juggernaut-final.yml"
  push:
    branches: [main]
    paths:
      - "packages/growth-core/src/music-juggernaut/**"
      - "apps/jhadina-web/src/lib/music/**"
      - "apps/jhadina-web/src/app/api/music/juggernaut/**"

jobs:
  certify:
    name: MUSIC-JUGGERNAUT.FINAL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Growth Core type-check
        run: pnpm --filter @jhadina/growth-core type-check
      - name: Growth Core Music tests
        run: pnpm --filter @jhadina/growth-core test -- src/music-juggernaut
      - name: Jhadina Web type-check
        run: pnpm --filter @jhadina/jhadina-web type-check
      - name: Music web regression tests
        run: pnpm --filter @jhadina/jhadina-web test -- src/lib/intelligence/ask-music-juggernaut-command.test.ts src/lib/music/music-paid-proposal-bridge.test.ts src/lib/music/artist-hub-resolver.test.ts src/lib/music/royalty-snapshot.test.ts src/lib/music/music-royalty-snapshot-service.test.ts src/lib/music/music-section-perception-bridge.test.ts
      - name: Verify governed persistence
        run: |
          test -f supabase/migrations/20260930170000_music_juggernaut_final.sql
          test -f supabase/migrations/20260930170500_growth_direct_audience_consent.sql
          test -f supabase/migrations/20260930183743_music_juggernaut_fk_indexes.sql
          test -f supabase/migrations/20261001032500_music_juggernaut_commissioning.sql
          grep -q "enable row level security" supabase/migrations/20260930170000_music_juggernaut_final.sql
          grep -q "consent evidence reference required" supabase/migrations/20260930170500_growth_direct_audience_consent.sql
          grep -q "GROWTH_PAID_AD_MUST_REQUIRE_APPROVAL" apps/jhadina-web/src/lib/growth/governed-paid-campaign.ts
          grep -q "enable row level security" supabase/migrations/20261001032500_music_juggernaut_commissioning.sql
          grep -q "jhadina_music_royalty_snapshots" supabase/migrations/20261001032500_music_juggernaut_commissioning.sql
          if grep -Fq '\\nrevoke' supabase/migrations/20260930170000_music_juggernaut_final.sql; then
            echo "Literal escaped newline found in Music Juggernaut SQL"
            exit 1
          fi
          if grep -Eq "set search_path='' as [$]$" supabase/migrations/20260930170000_music_juggernaut_final.sql; then
            echo "Malformed single-dollar SQL function delimiter found"
            exit 1
          fi
