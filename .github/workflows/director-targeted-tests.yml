name: Director Targeted Tests
on:
  pull_request:
    paths:
      - "packages/director-core/**"
      - "apps/jhadina-web/src/app/api/workstation/**"
      - "apps/jhadina-web/src/app/api/director/**"
      - "apps/jhadina-web/src/app/workstation/**"
      - "apps/jhadina-web/src/lib/director-**"
      - "apps/jhadina-web/src/lib/social/director-bridge*"
      - "apps/jhadina-web/src/app/api/social/director/**"
      - "apps/jhadina-web/src/lib/supabase-generated-asset-repository.ts"
      - "apps/jhadina-web/lib/supabase-generated-asset-repository.ts"
      - "packages/social-core/src/content-projects*"
      - "docs/DIRECTOR*.md"
      - "supabase/migrations/*director*"
      - ".github/workflows/director-targeted-tests.yml"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "packages/director-core/**"
      - "apps/jhadina-web/src/app/api/workstation/**"
      - "apps/jhadina-web/src/app/api/director/**"
      - "apps/jhadina-web/src/app/workstation/**"
      - "apps/jhadina-web/src/lib/director-**"
      - "apps/jhadina-web/src/lib/social/director-bridge*"
      - "apps/jhadina-web/src/app/api/social/director/**"
      - "apps/jhadina-web/src/lib/supabase-generated-asset-repository.ts"
      - "apps/jhadina-web/lib/supabase-generated-asset-repository.ts"
      - "packages/social-core/src/content-projects*"
      - "docs/DIRECTOR*.md"
      - "supabase/migrations/*director*"
      - ".github/workflows/director-targeted-tests.yml"
      - "pnpm-lock.yaml"
jobs:
  director-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 8.15.9, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Director Core authority and lifecycle
        run: >
          pnpm --filter @jhadina/director-core exec vitest run
          src/creative-gate-adapter.test.ts
          src/storyboard-sequence.test.ts
          src/storyboard-stage-binding.test.ts
          src/storyboard-persistence.test.ts
          src/storyboard-shot-adapter.test.ts
          src/generation-plan-adapter.test.ts
          src/media-quality-evidence.test.ts
          src/media-review-gate-adapter.test.ts
          src/production-authority.test.ts
          src/media-review-lifecycle.test.ts
          src/review-transition.test.ts
          src/production-orchestrator.test.ts
          src/final-lifecycle.test.ts
          src/social-production-bridge.test.ts
          src/studio-qc.test.ts
          src/studio-asset-approval.test.ts
          src/reference-derived-contracts.test.ts
          src/cast-bible.test.ts
          src/character-reference-and-extend.test.ts
          src/character-training-pipeline.test.ts
          src/character-lora-approval.test.ts
          src/video-upscale-finishing.test.ts
          src/studio-character-training.test.ts
          src/source-driven-character-swap.test.ts
          src/creative-workspace-media.test.ts
          src/playhead-generation-continuation.test.ts
          src/creative-audio-generation.test.ts
          src/transcript-assisted-lip-sync.test.ts
          src/character-performance-rig.test.ts
          src/character-animation-enhancements.test.ts
          src/cartoon-production-workflow.test.ts
          src/performance-capture-plan.test.ts
          src/human-performance-observer.test.ts
          src/pose-action-recognition.test.ts
          src/roboflow-people-observation.test.ts
          src/hybrid-animation-production.test.ts
          src/action-sequence-control.test.ts
          src/model-prompt-translation.test.ts
          src/generation-plan-prompt-translation.test.ts
          src/dialogue-coverage-workflow.test.ts
          src/longform-dialogue-state.test.ts
          src/performance-master.test.ts
          src/motion-capture-3d.test.ts
          src/studio-rig-animation.test.ts
          src/studio-rig-animation-mocap.test.ts
          src/agentic-project-context.test.ts
          src/localized-video-repair.test.ts
          src/world-reference-workflow.test.ts
          src/world-3d-backend-profile.test.ts
          src/quick-cut-planner.test.ts
          src/studio-character-replacement-worker.test.ts
          src/studio-character-replacement.test.ts
          src/whole-video-provider.test.ts
          src/paid-video-generation.test.ts
          src/commercial-creative-lab.test.ts
          src/product-reference-bootstrap.test.ts
          src/camera-language.test.ts
          src/performance-direction.test.ts
          src/realism-direction.test.ts
          src/cinematic-lighting.test.ts
          src/cinematography-analysis.test.ts
          src/production-story-compass.test.ts
          src/field-capture-ledger.test.ts
          src/editorial-reduction-workflow.test.ts
          src/audio-priority-mix.test.ts
          src/final-export-inspection.test.ts
          src/screenplay-blueprint.test.ts
          src/production-audio-capture.test.ts
          src/editorial-cut-decision.test.ts
          src/cinematic-story-bible.test.ts
          src/prompt-complexity-budget.test.ts
          src/music-lipsync-package.test.ts
          src/voice-replacement-edit.test.ts
          src/character-reference-presentation.test.ts
          src/generation-audio-intent.test.ts
          src/scene-attempt-budget.test.ts
          src/animation-principles.test.ts
          src/animation-performance-state.test.ts
          src/directed-take-qc.test.ts
          src/ugc-production.test.ts
          src/previs-blockout.test.ts
          src/storyboard-reference-board.test.ts
          src/generation-reference-manifest.test.ts
          src/continuity-reference-strategy.test.ts
      - run: pnpm --filter @jhadina/director-core run type-check
      - name: Workstation authority, Studio QC and Social bridge
        run: >
          pnpm --filter @jhadina/jhadina-web exec vitest run
          src/lib/director-project-authority.test.ts
          src/lib/director-generation-provider-factory.test.ts
          src/lib/director-character-training-runtime.test.ts
          src/lib/director-studio-qc-repository.test.ts
          src/lib/director-cast-repository.test.ts
          src/app/api/director/characters/bootstrap/route.test.ts
          src/app/api/director/commercial/multiplier/route.test.ts
          src/app/api/director/commercial/creative/route.test.ts
          src/app/api/director/videos/reference-product/route.test.ts
          src/app/api/director/products/bootstrap/route.test.ts
          src/app/api/director/products/references/[assetId]/admit/route.test.ts
          src/app/api/director/products/references/route.test.ts
          src/lib/director-reference-video-provider.test.ts
          src/lib/director-reference-asset-resolver.test.ts
          src/lib/director-reference-media.test.ts
          src/app/api/workstation/editing-assets/route.test.ts
          src/lib/social/director-bridge.test.ts
      - run: pnpm --filter @jhadina/jhadina-web run type-check
