name: Director RunPod API Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/director-runpod-api-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY || secrets.runpod_key }}
      RUNPOD_POD_ID: xn73vwwekavcc6
      HUNYUAN_PROXY: https://xn73vwwekavcc6-8091.proxy.runpod.net
      SPEAKER_QC_PROXY: https://xn73vwwekavcc6-8092.proxy.runpod.net
    steps:
      - uses: actions/checkout@v4

      - name: Require RunPod API authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}" || { echo "DIRECTOR_RUNPOD_API_KEY_REQUIRED" >&2; exit 1; }

      - name: Install RunPod CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.runpod.net | sudo bash
          runpodctl version

      - name: Inspect pod safely
        shell: bash
        run: |
          set -euo pipefail
          runpodctl pod get "$RUNPOD_POD_ID" -o json > /tmp/pod.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data=json.loads(Path("/tmp/pod.json").read_text())
          deny=("env","token","secret","password","credential","key")

          def scrub(value):
              if isinstance(value,dict):
                  out={}
                  for k,v in value.items():
                      low=str(k).lower()
                      if any(word in low for word in deny):
                          out[k]="<redacted>"
                      else:
                          out[k]=scrub(v)
                  return out
              if isinstance(value,list):
                  return [scrub(v) for v in value]
              return value

          clean=scrub(data)
          print(json.dumps(clean,indent=2,sort_keys=True))
          PY

      - name: Probe public ports
        shell: bash
        run: |
          set -euo pipefail
          for item in             "hunyuan-live|$HUNYUAN_PROXY/health/live"             "hunyuan-health|$HUNYUAN_PROXY/health"             "speaker-live|$SPEAKER_QC_PROXY/health/live"; do
            name="${item%%|*}"
            url="${item#*|}"
            code="$(curl --connect-timeout 5 --max-time 15 -sS -o "/tmp/$name.body" -w '%{http_code}' "$url" || true)"
            printf '%s http=%s body=' "$name" "$code"
            head -c 600 "/tmp/$name.body" 2>/dev/null || true
            printf '\n'
          done
