          src/app/api/director/bonez/voice-audition/bootstrap/route.test.ts
          src/lib/director-phantom-video-provider.test.ts
          src/lib/director-phantom-generation-provider.test.ts
          src/lib/director-hunyuan-video-provider.test.ts
          src/lib/director-human-media-worker.test.ts
          src/lib/director-speaker-qc-provider.test.ts
          src/app/api/director/hunyuan/health/route.test.ts
