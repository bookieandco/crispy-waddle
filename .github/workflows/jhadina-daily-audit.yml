name: Jhadina Daily Evolution Audit

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: jhadina-daily-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build evolution core
        run: pnpm --filter @jhadina/evolution-core build

      - name: Run read-only daily audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .jhadina/audits
          RUN_ID="daily-${GITHUB_RUN_ID}"
          SCHEDULED_FOR="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BRANCH="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA}"
          REPOSITORY="${GITHUB_REPOSITORY}"
          VERSION="daily-audit-v1"

          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { mkdirSync, writeFileSync } from 'node:fs';
          
          const runId = process.env.RUN_ID;
          const scheduledFor = process.env.SCHEDULED_FOR;
          const repository = process.env.REPOSITORY;
          const branch = process.env.BRANCH;
          const commit = process.env.COMMIT;
          const version = process.env.VERSION;
          const commands = [
            ['git', ['status', '--short', '--branch']],
            ['git', ['log', '-20', '--oneline', '--decorate']],
            ['git', ['diff', '--stat', 'HEAD~1..HEAD']],
            ['pnpm', ['outdated', '--format', 'json']],
            ['pnpm', ['audit', '--json']],
            ['gh', ['pr', 'list', '--state', 'open', '--limit', '50', '--json', 'number,title,headRefName,baseRefName,statusCheckRollup']],
            ['gh', ['issue', 'list', '--state', 'open', '--limit', '50', '--json', 'number,title,labels,updatedAt']]
          ];
          const evidence = [];
          let status = 'COMPLETED';
          for (const [program, args] of commands) {
            let output = '';
            let exitCode = 0;
            try {
              output = execFileSync(program, args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
            } catch (error) {
              exitCode = typeof error?.status === 'number' ? error.status : 1;
              output = `${error?.stdout ?? ''}${error?.stderr ?? ''}`;
              if (program !== 'pnpm') status = 'FAILED';
            }
            const outputSha256 = createHash('sha256').update(output).digest('hex');
            evidence.push({ source: program, command: [program, ...args].join(' '), exitCode, outputSha256, output });
          }
          const base = {
            schemaVersion: '1.0',
            eventType: 'DAILY_AUDIT_RUN',
            runId,
            scheduledFor,
            startedAt: scheduledFor,
            completedAt: new Date().toISOString(),
            status,
            repository,
            branch,
            commit,
            auditorVersion: version,
            evidence,
            candidateIds: [],
            previousEventHash: null
          };
          const eventHash = createHash('sha256').update(JSON.stringify(base)).digest('hex');
          const event = { ...base, eventHash };
          mkdirSync('.jhadina/audits', { recursive: true });
          writeFileSync(`.jhadina/audits/${runId}.json`, JSON.stringify(event, null, 2) + '\n');
          NODE
        env:
          RUN_ID: daily-${{ github.run_id }}
          SCHEDULED_FOR: ${{ github.event.repository.updated_at || '' }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          VERSION: daily-audit-v1

      - name: Upload reproducible audit record
        uses: actions/upload-artifact@v4
        with:
          name: jhadina-daily-audit-${{ github.run_id }}
          path: .jhadina/audits/
          if-no-files-found: error
          retention-days: 90
