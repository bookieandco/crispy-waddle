name: Jhadina sports study-case integrity

on:
  push:
    paths:
      - 'training/sports/nfl/**'
      - '.github/workflows/jhadina-sports-study.yml'
  pull_request:
    paths:
      - 'training/sports/nfl/**'
      - '.github/workflows/jhadina-sports-study.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-study:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate immutable original forecast and as-of cutoff
        run: node training/sports/nfl/verify-case.mjs
      - name: Validate captured live observation (non-training evidence only)
        run: node training/sports/nfl/validate-live.mjs training/sports/nfl/2026/2026-10-12-buf-at-lar/pregame.case.json training/sports/nfl/2026/2026-10-12-buf-at-lar/live.observation-001.json
      - name: Validate second independent live timestamp
        run: node training/sports/nfl/validate-live.mjs training/sports/nfl/2026/2026-10-12-buf-at-lar/pregame.case.json training/sports/nfl/2026/2026-10-12-buf-at-lar/live.observation-002.json
      - name: Validate deterministic offline Supabase replay package
        run: node training/sports/nfl/export-study-events.mjs training/sports/nfl/2026/2026-10-12-buf-at-lar/pregame.case.json training/sports/nfl/2026/2026-10-12-buf-at-lar/pregame.availability-001.json training/sports/nfl/2026/2026-10-12-buf-at-lar/live.observation-001.json training/sports/nfl/2026/2026-10-12-buf-at-lar/live.observation-002.json > /dev/null
      - name: Run sports scoring and provenance tests
        run: node --test training/sports/nfl/grade-case.test.mjs training/sports/nfl/verify-case.test.mjs training/sports/nfl/compile-lessons.test.mjs training/sports/nfl/admit-reviewed-case.test.mjs training/sports/nfl/validate-live.test.mjs training/sports/nfl/export-study-events.test.mjs training/sports/nfl/compare-probabilities.test.mjs
