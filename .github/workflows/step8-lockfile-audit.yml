name: Step 8 Lockfile Audit

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to audit'
        required: true
        default: 'feat/jhadina-step8-capability-event-bus'
        type: string

permissions:
  contents: read

jobs:
  lockfile-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Generate lockfile only
        run: pnpm install --lockfile-only

      - name: Show lockfile diff
        run: git diff -- pnpm-lock.yaml

      - name: Verify frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: step8-generated-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
