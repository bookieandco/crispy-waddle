name: MONEY-FINISH.08-.10 Research Models
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/money-finish-research-models.yml"
      - "packages/money-core/src/money-finish-signal-league*"
      - "packages/money-core/src/money-finish-options-risk*"
      - "packages/money-core/src/money-finish-fx-challengers*"
      - "packages/money-core/src/money-finish-stock-rank-orb*"
      - "packages/money-core/src/index.ts"
      - "docs/architecture/MONEY-FINISH-08-10-*"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/money-finish-research-models.yml"
      - "packages/money-core/src/money-finish-signal-league*"
      - "packages/money-core/src/money-finish-options-risk*"
      - "packages/money-core/src/money-finish-fx-challengers*"
permissions:
  contents: read
jobs:
  research-models:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Money Core type-check
        run: pnpm --filter @jhadina/money-core type-check
      - name: Research-only unit and negative authority tests
        run: pnpm --filter @jhadina/money-core exec tsx --test src/money-finish-signal-league.test.ts src/money-finish-stock-rank-orb.test.ts src/money-finish-options-risk.test.ts src/money-finish-fx-challengers.test.ts src/money-finish-feed-admission.test.ts src/money-finish-option-chain.test.ts src/money-finish-source-admission.test.ts src/options-contracts.test.ts src/stock-paper-baseline-strategy.test.ts
      - name: Complete Money Core unit regression
        run: pnpm --filter @jhadina/money-core test
