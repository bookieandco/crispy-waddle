name: Staffing Postgres Integration

on:
  pull_request:
    paths:
      - "packages/staffing-core/**"
      - ".github/workflows/staffing-postgres-integration.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [feat/staffingos-standalone-boundary]
    paths:
      - "packages/staffing-core/**"
      - ".github/workflows/staffing-postgres-integration.yml"
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: staffing
          POSTGRES_PASSWORD: staffing
          POSTGRES_DB: staffing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staffing -d staffing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      STAFFING_TEST_DATABASE_URL: postgresql://staffing:staffing@localhost:5432/staffing_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install CI-only Postgres test dependencies
        run: pnpm add -Dw pg @types/pg vitest --lockfile-only=false

      - name: Verify Postgres connectivity
        run: |
          set -euo pipefail
          PGPASSWORD=staffing psql "$STAFFING_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'select version();'

      - name: Bootstrap integration schema
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=staffing psql "$STAFFING_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create table if not exists public.invoices (
            id uuid primary key,
            organization_id uuid not null,
            total numeric(18,2) not null,
            paid numeric(18,2) not null default 0,
            currency text not null,
            status text not null default 'OPEN'
          );
          create or replace function public.placement_is_org_member(uuid)
          returns boolean language sql stable as $$ select true $$;
          SQL

      - name: Apply payment migration
        run: |
          PGPASSWORD=staffing psql "$STAFFING_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/staffing-core/migrations/0022_payment_reconciliation.sql

      - name: Run staffing Postgres integration tests
        run: pnpm exec vitest run packages/staffing-core/src/payment-reconciliation.pg.test.ts
