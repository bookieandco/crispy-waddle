name: Gaming Core Certification

on:
  push:
    branches:
      - 'jhadina-gaming-*'
  pull_request:
    paths:
      - 'packages/gaming-core/**'
      - 'apps/jhadina-web/public/gaming/gameboy/**'
      - 'apps/jhadina-web/public/gaming/neon-run/**'
      - 'apps/jhadina-web/public/gaming/diagnostics/**'
      - 'apps/jhadina-web/src/app/gaming/**'
      - 'apps/jhadina-web/src/lib/jhadina/jhadina-world-registry.ts'
      - 'apps/jhadina-web/src/components/JhadinaShellNavigation.tsx'
      - 'scripts/gaming-verify-browser-shell.mjs'
      - 'scripts/gaming-test-backup.mjs'
      - 'scripts/gaming-test-storage.mjs'
      - 'scripts/gaming-test-neon-run.mjs'
      - 'scripts/install-gameboy-emulatorjs.mjs'
      - '.github/workflows/gaming-core-certification.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jhadina/gaming-core run certify
      - run: pnpm turbo run build test type-check --filter=@jhadina/gaming-core
      - run: node scripts/gaming-verify-browser-shell.mjs
      - run: node scripts/gaming-test-backup.mjs
      - run: node scripts/gaming-test-storage.mjs
      - run: node scripts/gaming-test-neon-run.mjs
      - run: node --check scripts/install-gameboy-emulatorjs.mjs
