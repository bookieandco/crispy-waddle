name: MONEY Forward-Only Portable Research Gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/money-core/src/money-forward-only-commissioning*"
      - "packages/money-core/src/index.ts"
      - "scripts/money-portable-production-probe.py"
      - "scripts/test_money_portable_production_probe.py"
      - ".github/workflows/money-forward-only-portable.yml"
      - "docs/architecture/MONEY-FORWARD-ONLY-PORTABLE-HANDOFF-2026-10-08.md"
permissions:
  contents: read
jobs:
  forward-only-code:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Money TypeScript
        run: pnpm --filter @jhadina/money-core type-check
      - name: Forward-only and historical negative contract tests
        run: pnpm --filter @jhadina/money-core exec tsx --test src/money-forward-only-commissioning.test.ts src/money-finish-final-gate.test.ts src/money-finish-incubation.test.ts src/money-finish-forward-grades.test.ts src/money-finish-forward-journal.test.ts
      - name: Full Money Core unit suite
        run: pnpm --filter @jhadina/money-core test
      - name: Portable public health preflight contract tests
        run: |
          python3 -m py_compile scripts/money-portable-production-probe.py scripts/test_money_portable_production_probe.py
          python3 scripts/test_money_portable_production_probe.py -v
