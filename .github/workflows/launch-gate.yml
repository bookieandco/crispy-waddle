name: Jhadina Launch Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: launch-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, type-check, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Repair workspace lockfile on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          pnpm install --lockfile-only
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already matches workspace manifests.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore: synchronize pnpm lockfile'
          git push origin HEAD:main

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Production build
        run: pnpm build

  lockfile-generation:
    name: Generate and verify lockfile
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Generate lockfile
        run: pnpm install --lockfile-only

      - name: Verify generated lockfile
        run: pnpm install --frozen-lockfile

      - name: Capture lockfile diff
        run: git diff -- pnpm-lock.yaml > lockfile.diff

      - name: Upload generated lockfile and diff
        uses: actions/upload-artifact@v4
        with:
          name: step8-lockfile-repair
          path: |
            pnpm-lock.yaml
            lockfile.diff
          retention-days: 1
