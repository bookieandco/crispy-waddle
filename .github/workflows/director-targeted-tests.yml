          src/production-final-program.test.ts
          src/project-final-qc.test.ts
          src/edge-watch-prefilter.test.ts
          src/ultralytics-observation.test.ts
          src/visual-annotation-provider.test.ts
      - run: pnpm --filter @jhadina/director-core run type-check
      - name: Workstation authority, Studio QC and Social bridge
        run: >
          pnpm --filter @jhadina/jhadina-web exec vitest run
          src/lib/director-project-authority.test.ts
          src/lib/director-generation-artifact-deployment.test.ts
          src/lib/supabase-artifact-admission-ledger.test.ts
          src/lib/director-generation-provider-factory.test.ts
          src/lib/director-character-training-runtime.test.ts
          src/lib/director-studio-qc-repository.test.ts
          src/lib/director-cast-repository.test.ts
          src/app/api/director/characters/bootstrap/route.test.ts
          src/app/api/director/commercial/multiplier/route.test.ts
          src/app/api/director/commercial/creative/route.test.ts
          src/app/api/director/videos/reference-product/route.test.ts
          src/app/api/director/products/bootstrap/route.test.ts
          src/app/api/director/products/references/[assetId]/admit/route.test.ts
          src/app/api/director/products/references/route.test.ts
          src/lib/director-reference-video-provider.test.ts
          src/lib/director-certification-mp4.test.ts
          src/lib/director-certification-provider.test.ts
          src/lib/director-bonez-canon.test.ts
          src/app/api/director/bonez/bootstrap/route.test.ts
          src/app/api/director/bonez/quality-preflight/route.test.ts
