name: PupsonStuff CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/pupsonstuff/**"
      - "supabase/migrations/*pupsonstuff*.sql"
      - ".github/workflows/pupsonstuff-fulfillment-postgres.yml"
      - "services/pupson-background-remover/**"
      - "services/pupson-media-gateway/**"
      - "services/pupson-upscaler/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/pupsonstuff-ci.yml"
  push:
    branches:
      - main
      - pupsonstuff-import
      - pupsonstuff-main-integration
    paths:
      - "apps/pupsonstuff/**"
      - "supabase/migrations/*pupsonstuff*.sql"
      - ".github/workflows/pupsonstuff-fulfillment-postgres.yml"
      - "services/pupson-background-remover/**"
      - "services/pupson-media-gateway/**"
      - "services/pupson-upscaler/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/pupsonstuff-ci.yml"

jobs:
  verify:
    name: Type-check, test, and build PupsonStuff
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Lock original boutique pixels and approved 3D GLBs
        run: |
          node --test apps/pupsonstuff/scripts/verify-original-assets.check.mjs
          node apps/pupsonstuff/scripts/verify-original-assets.mjs

      - name: Cloudflare preview view-only and remote-canary contracts
        run: |
          node --test apps/pupsonstuff/scripts/generate-cloudflare-preview.check.mjs
          node --test apps/pupsonstuff/scripts/cloudflare-preview-canary.check.mjs
          node apps/pupsonstuff/scripts/generate-cloudflare-preview.mjs

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate media service syntax
        run: |
          node --check services/pupson-media-gateway/server.mjs
          python -m py_compile services/pupson-background-remover/media_worker.py

      - name: Type-check PupsonStuff
        run: pnpm --filter @jhadina/pupsonstuff type-check

      - name: Test PupsonStuff
        run: pnpm --filter @jhadina/pupsonstuff test

      - name: Build PupsonStuff
        run: pnpm --filter @jhadina/pupsonstuff build
