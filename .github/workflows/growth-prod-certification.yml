name: Growth Production Certification

on:
  pull_request:
    paths:
      - 'packages/growth-core/**'
      - 'packages/jhadina-action-core/**'
      - 'packages/security-core/**'
      - 'apps/jhadina-web/src/lib/growth/**'
      - 'apps/jhadina-web/src/lib/intelligence/ask-growth-command*'
      - 'apps/jhadina-web/src/lib/context/production-growth-context-provider*'
      - 'apps/jhadina-web/src/lib/context/growth-context.integration.test.ts'
      - 'apps/jhadina-web/src/lib/context/context-builder.ts'
      - 'apps/jhadina-web/src/app/api/jhadina/command/**'
      - 'apps/jhadina-web/src/app/ask-jhadina/**'
      - 'packages/jhadina-core-spine/src/types.ts'
      - 'apps/jhadina-web/src/lib/auth/**'
      - 'apps/jhadina-web/src/app/api/growth/**'
      - 'apps/jhadina-web/tsconfig.growth-prod.json'
      - 'supabase/migrations/*growth*'
      - 'supabase/migrations/*social*'
      - '.github/workflows/growth-prod-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    name: GROWTH-PROD source certification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile

      - name: Type-check Action Core
        run: pnpm --filter @jhadina/action-core type-check

      - name: Test Action Core approval receipts
        run: pnpm --filter @jhadina/action-core test

      - name: Type-check Security Core
        run: pnpm --filter @jhadina/security-core type-check

      - name: Test Security Core paid-ad gate
        run: pnpm --filter @jhadina/security-core test

      - name: Type-check Growth Core
        run: pnpm --filter @jhadina/growth-core type-check

      - name: Test Growth Core
        run: pnpm --filter @jhadina/growth-core test

      - name: Type-check Growth production web integration
        run: pnpm --filter @jhadina/jhadina-web exec tsc -p tsconfig.growth-prod.json --noEmit

      - name: Test Growth production web integration
        run: |
          pnpm --filter @jhadina/jhadina-web exec vitest run \
            src/lib/growth \
            src/lib/intelligence/ask-growth-command.test.ts \
            src/lib/context/production-growth-context-provider.test.ts \
            src/lib/context/growth-context.integration.test.ts \
            src/app/api/jhadina/command/route.growth.test.ts \
            src/app/api/jhadina/command/route.social.test.ts

      - name: Fail if production paid provider silently falls back to mock
        run: |
          if grep -R "MockChannelAdapter" apps/jhadina-web/src/lib/growth apps/jhadina-web/src/app/api/growth; then
            echo "Mock advertising adapter referenced by production Growth runtime"
            exit 1
          fi

      - name: Verify production migration source is present
        run: |
          test -f supabase/migrations/20260921212651_jhadina_growth_production_spine.sql
          test -f supabase/migrations/20260921213205_jhadina_growth_lifecycle_rpc.sql
          test -f supabase/migrations/20260921214442_growth_prod_hardening.sql
          test -f supabase/migrations/20260921214803_jhadina_social_governed_publication.sql
          test -f supabase/migrations/20260921223500_social_prod_schema_reconciliation.sql

      - name: Verify production evidence APIs require idempotency keys
        run: |
          grep -q "eventKey" apps/jhadina-web/src/app/api/growth/customers/events/route.ts
          grep -q "observationKey" apps/jhadina-web/src/app/api/growth/ads/campaigns/'[id]'/performance/route.ts
          grep -q "idempotencyKey" apps/jhadina-web/src/app/api/growth/customers/'[id]'/lifecycle/route.ts


  weekly-social-migration:
    name: Weekly Social privileged migration apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jhadina
          POSTGRES_PASSWORD: jhadina
          POSTGRES_DB: jhadina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jhadina -d jhadina_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://jhadina:jhadina@localhost:5432/jhadina_test
      TEST_USER_ID: 11111111-1111-4111-8111-111111111111
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap Supabase-compatible roles
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=jhadina psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create schema auth;
          create table auth.users(id uuid primary key);
          insert into auth.users(id)
          values ('11111111-1111-4111-8111-111111111111');

          create or replace function auth.uid()
          returns uuid
          language sql
          stable
          as $$
            select null::uuid
          $$;
          SQL

      - name: Apply weekly Social privileged migration chain
        shell: bash
        run: |
          set -euo pipefail
          for migration in \
            supabase/migrations/20260921212651_jhadina_growth_production_spine.sql \
            supabase/migrations/20260921214803_jhadina_social_governed_publication.sql \
            supabase/migrations/20261007194500_social_weekly_juggernaut_runtime.sql \
            supabase/migrations/20261007201500_social_weekly_privileged_execution.sql
          do
            echo "Applying $migration"
            PGPASSWORD=jhadina psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Prove privileged weekly function grants
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=jhadina psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_count integer;
            v_bad integer;
          begin
            select count(*)
              into v_count
              from pg_proc p
              join pg_namespace n on n.oid = p.pronamespace
             where n.nspname = 'public'
               and p.proname = any(array[
                 'jhadina_social_weekly_prepare_proposal',
                 'jhadina_growth_weekly_prepare_paid_campaign',
                 'jhadina_social_consume_weekly_publication_delegation',
                 'jhadina_social_weekly_enqueue_outbox',
                 'jhadina_social_weekly_begin_outbox_attempt',
                 'jhadina_social_weekly_complete_outbox',
                 'jhadina_social_weekly_fail_outbox',
                 'jhadina_growth_consume_weekly_paid_delegation',
                 'jhadina_growth_weekly_enqueue_paid_campaign',
                 'jhadina_growth_weekly_begin_paid_outbox_attempt',
                 'jhadina_growth_weekly_resolve_paid_outbox'
               ]);

            if v_count <> 11 then
              raise exception 'expected 11 weekly privileged functions, got %', v_count;
            end if;

            select count(*)
              into v_bad
              from pg_proc p
              join pg_namespace n on n.oid = p.pronamespace
             where n.nspname = 'public'
               and p.proname = any(array[
                 'jhadina_social_weekly_prepare_proposal',
                 'jhadina_growth_weekly_prepare_paid_campaign',
                 'jhadina_social_consume_weekly_publication_delegation',
                 'jhadina_social_weekly_enqueue_outbox',
                 'jhadina_social_weekly_begin_outbox_attempt',
                 'jhadina_social_weekly_complete_outbox',
                 'jhadina_social_weekly_fail_outbox',
                 'jhadina_growth_consume_weekly_paid_delegation',
                 'jhadina_growth_weekly_enqueue_paid_campaign',
                 'jhadina_growth_weekly_begin_paid_outbox_attempt',
                 'jhadina_growth_weekly_resolve_paid_outbox'
               ])
               and (
                 has_function_privilege('anon', p.oid, 'EXECUTE')
                 or has_function_privilege('authenticated', p.oid, 'EXECUTE')
                 or not has_function_privilege('service_role', p.oid, 'EXECUTE')
               );

            if v_bad <> 0 then
              raise exception 'weekly privileged function grant boundary failed for % functions', v_bad;
            end if;
          end
          $$;
          SQL
