name: GEV Satellite Live Certification

on:
  pull_request:
    paths:
      - 'packages/spatial-intelligence-core/src/public-satellite-provider.ts'
      - 'packages/spatial-intelligence-core/src/public-satellite-provider.test.ts'
      - 'packages/spatial-intelligence-core/src/gev-spatial-context-read-provider.ts'
      - 'packages/spatial-intelligence-core/src/spatial-reality-admission-read-provider.ts'
      - 'packages/spatial-intelligence-core/src/spatial-knowledge-projection.ts'
      - 'apps/jhadina-web/src/lib/context/production-spatial-context-provider.ts'
      - 'apps/jhadina-web/src/lib/context/satellite-live-certification.test.ts'
      - 'apps/jhadina-web/src/app/api/spatial/satellite/health/route.ts'
      - '.github/workflows/gev-satellite-live-certification.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gev-satellite-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: Workload OIDC Spatial gateway probe
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feat/ask-jhadina-gev-bridge-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint short-lived GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const token = await core.getIDToken('jhadina-spatial-gateway')
            core.setSecret(token)
            return token

      - name: Probe deployed Spatial gateway
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.result }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -sSf -X POST \
            -H "authorization: Bearer $OIDC_TOKEN" \
            -H "content-type: application/json" \
            --data '{"action":"probe","payload":{}}' \
            https://kqbkaozfjubkjevdfvic.supabase.co/functions/v1/jhadina-spatial-gateway)"
          echo "$body" | jq -e '
            .data.evidence == true and
            .data.realityCandidates == true and
            .data.realityAdmissions == true and
            .data.knowledgeNodes == true and
            .data.knowledgeRelations == true
          ' >/dev/null
          echo "OIDC Spatial gateway probe: PASS" >> "$GITHUB_STEP_SUMMARY"

  certify:
    name: Real CelesTrak + NASA + durable Spatial canary
    needs: gateway
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feat/ask-jhadina-gev-bridge-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://kqbkaozfjubkjevdfvic.supabase.co
      JHADINA_SPATIAL_GATEWAY_URL: https://kqbkaozfjubkjevdfvic.supabase.co/functions/v1/jhadina-spatial-gateway
      SATELLITE_LIVE_CERT: '1'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Gate the one-shot upstream read
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$subject" = "cert(spatial): run satellite live certification" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping live upstream read for non-certification commit: $subject" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mint short-lived GitHub OIDC token
        if: steps.gate.outputs.run == 'true'
        id: oidc
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const token = await core.getIDToken('jhadina-spatial-gateway')
            core.setSecret(token)
            return token

      - name: Setup pnpm
        if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Frozen install
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run real provider + durable evidence canary
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          SPATIAL_WORKLOAD_OIDC_TOKEN: ${{ steps.oidc.outputs.result }}
        run: |
          set -euo pipefail
          pnpm --filter @jhadina/jhadina-web exec vitest run src/lib/context/satellite-live-certification.test.ts --reporter=verbose 2>&1 | tee /tmp/gev-satellite-live.log
          echo "### GEV satellite live certification" >> "$GITHUB_STEP_SUMMARY"
          tail -n 160 /tmp/gev-satellite-live.log >> "$GITHUB_STEP_SUMMARY"
