name: Director RunPod Zero GPU Recovery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/director-runpod-zero-gpu-recovery.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY || secrets.runpod_key }}
      RUNPOD_POD_ID: xn73vwwekavcc6
    steps:
      - uses: actions/checkout@v4

      - name: Require RunPod API authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}" || { echo "DIRECTOR_RUNPOD_API_KEY_REQUIRED" >&2; exit 1; }

      - name: Install RunPod CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.runpod.net | sudo bash
          runpodctl version

      - name: Read current allocation
        id: before
        shell: bash
        run: |
          set -euo pipefail
          runpodctl pod get "$RUNPOD_POD_ID" -o json > /tmp/pod-before.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/pod-before.json").read_text())
          print("gpu_count="+str(int(d.get("gpuCount") or 0)))
          print("runtime_status="+str(d.get("runtimeStatus") or "unknown"))
          ssh=d.get("ssh") or {}
          print("ssh_ready="+("true" if isinstance(ssh,dict) and not ssh.get("error") else "false"))
          PY

      - name: Recover same pod allocation
        if: steps.before.outputs.gpu_count == '0' || steps.before.outputs.ssh_ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "DIRECTOR_RUNPOD_ZERO_GPU_RECOVERY_BEGIN"
          runpodctl pod stop "$RUNPOD_POD_ID" >/dev/null
          for attempt in $(seq 1 30); do
            runpodctl pod get "$RUNPOD_POD_ID" -o json > /tmp/pod-stopped.json || true
            status="$(jq -r '.runtimeStatus // .desiredStatus // "unknown"' /tmp/pod-stopped.json 2>/dev/null || echo unknown)"
            if [[ "$status" != "running" && "$status" != "RUNNING" ]]; then
              break
            fi
            sleep 2
          done
          runpodctl pod start "$RUNPOD_POD_ID" >/dev/null

      - name: Verify GPU and SSH allocation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            runpodctl pod get "$RUNPOD_POD_ID" -o json > /tmp/pod-after.json || true
            gpu="$(jq -r '.gpuCount // 0' /tmp/pod-after.json 2>/dev/null || echo 0)"
            runtime="$(jq -r '.runtimeStatus // "unknown"' /tmp/pod-after.json 2>/dev/null || echo unknown)"
            ssh_error="$(jq -r '.ssh.error // ""' /tmp/pod-after.json 2>/dev/null || true)"
            echo "DIRECTOR_RUNPOD_RECOVERY_PROBE:$attempt:gpu=$gpu:runtime=$runtime:ssh=$([[ -z "$ssh_error" ]] && echo ready || echo pending)"
            if [[ "$gpu" -ge 1 && "$runtime" == "running" && -z "$ssh_error" ]]; then
              echo "DIRECTOR_RUNPOD_GPU_SSH_RECOVERED"
              exit 0
            fi
            sleep 5
          done
          echo "DIRECTOR_RUNPOD_GPU_SSH_NOT_RECOVERED" >&2
          jq '{id,name,desiredStatus,runtimeStatus,gpuCount,ports,ssh}' /tmp/pod-after.json 2>/dev/null || true
          exit 1
