name: Phase 4.7 Live Commerce Verification

# Manual trigger only. This is the only workflow permitted to make a
# real call against Stripe's test API for the Phase 4.6 proposal
# lifecycle (propose -> approve -> execute), and it never runs unless a
# human explicitly dispatches it — no push, pull_request, or schedule
# trigger exists here. Construction of this workflow does not authorize
# dispatching it, and dispatching the "propose" stage does not
# authorize dispatching "approve-execute" — each is a separate,
# explicit decision.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Which stage to run"
        required: true
        type: choice
        options:
          - propose
          - approve-execute

permissions:
  contents: read

concurrency:
  group: phase4-7-live-commerce-verification
  cancel-in-progress: false

jobs:
  live-verification:
    name: Phase 4.7 — ${{ inputs.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The credential is scoped to exactly one place in this file: the
      # env: block on the final step below, never job- or
      # workflow-level, never echoed, never passed to an artifact
      # upload — same structural property pl7-live-stripe-verification.yml
      # already established. No artifact is uploaded from this job;
      # evidence lives only in this step's own log output. GitHub Actions
      # automatically redacts the registered secret value anywhere it
      # would appear in step output, as a backstop behind the fact that
      # the suite itself never logs it.
      - name: Run the Phase 4.7 live Commerce verification stage
        working-directory: apps/jhadina-web
        env:
          JHADINA_SECRET_STRIPE_SANDBOX: ${{ secrets.JHADINA_SECRET_STRIPE_SANDBOX }}
          PHASE47_STAGE: ${{ inputs.stage }}
        run: pnpm exec vitest run --config vitest.phase4-7-live.config.ts
