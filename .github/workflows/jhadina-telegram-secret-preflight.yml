name: Jhadina Telegram Bot Secret Preflight

# Trusted main-branch workflow only. Never load this secret from a PR or fork.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/jhadina-telegram-secret-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-secret-preflight
  cancel-in-progress: false

jobs:
  telegram-identity-only:
    name: Verify @R2dice2bot identity (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Validate existing GitHub secret without printing it
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          if not token:
              print("::error::BOT_SECRET_MISSING: set TELEGRAM_BOT_TOKEN under repository Actions secrets")
              sys.exit(1)

          def safe_bot_read(method):
              # Method names are fixed, both requests are read-only.
              if method not in ("getMe", "getWebhookInfo"):
                  raise ValueError("invalid Telegram preflight method")
              request = urllib.request.Request(
                  "https://api.telegram.org/bot" + token + "/" + method,
                  headers={"User-Agent": "Jhadina-Telegram-Secret-Preflight/1.0"}
              )
              try:
                  with urllib.request.urlopen(request, timeout=12) as response:
                      payload = response.read(32769)
                  if len(payload) > 32768:
                      raise ValueError("oversized Telegram result")
                  data = json.loads(payload)
                  if data.get("ok") is not True or not isinstance(data.get("result"), dict):
                      raise ValueError("malformed Telegram result")
                  return data["result"]
              except Exception:
                  # Never print exceptions, requests or URLs containing the secret.
                  print("::error::TELEGRAM_PREFLIGHT_API_FAILED")
                  sys.exit(1)

          identity = safe_bot_read("getMe")
          if identity.get("is_bot") is not True or str(identity.get("username", "")).casefold() != "r2dice2bot":
              print("::error::BOT_USERNAME_MISMATCH: stored key does not identify @R2dice2bot")
              sys.exit(1)
          print("BOT_KEY_VERIFIED: @R2dice2bot")

          webhook = safe_bot_read("getWebhookInfo")
          if webhook.get("url"):
              print("::warning::EXISTING_WEBHOOK_PRESENT: do not start a competing getUpdates reader")
              print("WEBHOOK_STATUS: EXISTING_INTEGRATION")
          else:
              print("WEBHOOK_STATUS: NO_ACTIVE_WEBHOOK")
          print("READ_ONLY_PREFLIGHT_COMPLETE: no messages read, webhook unchanged, no trades")
          PY
